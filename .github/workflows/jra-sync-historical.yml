name: JRA Sync + Pages Deploy - Historical v15.13.2

on:
  schedule:
    # JST 08:00 every day. The script automatically selects the next JRA race day.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 (YYYYMMDD)。空欄なら今日以降の次回JRA開催日を自動選択"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official race pages
        shell: bash
        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}
        run: |
          set -euo pipefail
          # Date-based archives preserve previously synced races.
          # jra_daily.json / jra_history.json remain as compatibility aliases.
          mkdir -p data/daily data/history

          python3 - <<'PY'
          import datetime
          import html as htmlmod
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os
          import sys

          UA = "Mozilla/5.0 (compatible; keiba-simulator/jra-sync-14.0)"
          BASE = "https://www.jra.go.jp"
          ACCESS = BASE + "/JRADB/accessD.html"
          cal_url = BASE + "/JRADB/"
          JST = ZoneInfo("Asia/Tokyo")

          # ------------------------------------------------------------
          # Date
          # ------------------------------------------------------------
          now = datetime.datetime.now(JST)
          requested = os.environ.get("RACE_DATE_INPUT", "").strip()
          auto_date = not bool(requested)

          if requested:
              if not re.fullmatch(r"\d{8}", requested):
                  raise RuntimeError("race_date は YYYYMMDD 形式で指定してください")
              target_ymd = requested
          else:
              target_ymd = now.strftime("%Y%m%d")

          target_date = datetime.datetime.strptime(target_ymd, "%Y%m%d").date()
          target_date_iso = target_date.isoformat()

          # GitHub Actionsの手動指定がない場合は、今日が非開催日でも
          # 次回のJRA開催日を自動的に選ぶ。
          search_from_date = target_date
          search_to_date = target_date + datetime.timedelta(days=14)

          print("")
          print("=" * 70)
          print("DATE SELECTION")
          print("=" * 70)
          print("MODE:", "AUTO / NEXT JRA RACE DAY" if auto_date else "MANUAL")
          print("START DATE:", target_date_iso)
          if auto_date:
              print("SEARCH RANGE:", search_from_date.isoformat(), "->", search_to_date.isoformat())
          print("=" * 70)

          # ------------------------------------------------------------
          # HTTP session
          # ------------------------------------------------------------
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def request_bytes(url, method="GET", data=None, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with opener.open(req, timeout=20) as r:
                  return r.read()

          def decode_jra(raw):
              # JRA accessD pages declare Shift_JIS. Do not use response.apparent_encoding.
              for enc in ("cp932", "shift_jis", "utf-8"):
                  try:
                      text = raw.decode(enc)
                      if "<html" in text.lower() or "JRADB" in text:
                          return text
                  except UnicodeDecodeError:
                      pass
              return raw.decode("cp932", "replace")

          def get_html(url, referer=None):
              return decode_jra(request_bytes(url, "GET", None, referer))

          def post_cname(token, referer=None):
              data = urllib.parse.urlencode({"cname": token}).encode("ascii")
              return decode_jra(request_bytes(ACCESS, "POST", data, referer))

          # ------------------------------------------------------------
          # HISTORICAL RESULT MODE
          # ------------------------------------------------------------
          # v15.13.2 policy: past dates are NOT bulk-downloaded here.
          # The selected-race workflow is the only path that downloads a
          # historical result detail page. Existing legacy archives remain
          # readable, but this workflow no longer creates new 36-race result
          # archives for a past date.
          if requested and target_date < now.date():
              archive = Path(f"data/history/{target_ymd}.json")
              if archive.exists():
                  try:
                      legacy = json.loads(archive.read_text(encoding="utf-8"))
                      races = []
                      for r in legacy.get("races", []):
                          races.append({k: r.get(k) for k in (
                              "venue","venue_code","meet","meet_day","no","date",
                              "time","name","distance","surface","course","going","url","token"
                          ) if r.get(k) is not None})
                      out_dir = Path(f"data/history/{target_ymd}")
                      out_dir.mkdir(parents=True, exist_ok=True)
                      meta = {
                          "date": target_date_iso,
                          "updated_at": now.isoformat(),
                          "target_ymd": target_ymd,
                          "source": "JRA公式 過去レース・軽量メタデータ",
                          "mode": "historical_metadata",
                          "races": races,
                          "race_count": len(races),
                          "parser_version": "15.13.2-lightweight-metadata",
                      }
                      (out_dir / "meta.json").write_text(
                          json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8"
                      )
                      print("WROTE LIGHTWEIGHT METADATA:", out_dir / "meta.json", "RACES:", len(races))
                  except Exception as exc:
                      print("LEGACY METADATA SEED WARNING:", repr(exc))
              print("Historical bulk result download is disabled in v15.13.2.")
              print("Use workflow: JRA Sync - Historical Selected Race v15.13.2")
              sys.exit(0)

          # ------------------------------------------------------------
          # JRA token discovery
          #
          # JRA DB is not reliably discoverable by ordinary GET requests.
          # Enter through the accessD selector using pw01dli00/F3, then
          # follow accessD CNAME links until target-date race tokens appear.
          # ------------------------------------------------------------
          ENTRY_TOKEN = "pw01dli00/F3"

          RACE_TOKEN_RE = re.compile(
              r"pw01dde[0-9A-Za-z]{22}(?:/|%2F)[0-9A-Fa-f]{2}", re.I
          )

          # Navigation tokens such as pw01dli00/F3 are also embedded in
          # JavaScript/HTML. Their payload length is not assumed here.
          NAV_TOKEN_RE = re.compile(
              r"pw01d(?:li|de)[0-9A-Za-z]+(?:/|%2F)[0-9A-Fa-f]{2}",
              re.I,
          )

          TOKEN_EXACT = re.compile(
              r"^pw01dde"
              r"(?P<prefix>[0-9A-Za-z]{2})"
              r"(?P<venue>[0-9]{2})"
              r"(?P<meetday>[0-9]{4})"
              r"(?P<race>[0-9]{2})"
              r"(?P<date>[0-9]{8})"
              r"/(?P<hex>[0-9A-Fa-f]{2})$",
              re.I,
          )

          def normalize_token(t):
              t = htmlmod.unescape(t).strip()
              t = urllib.parse.unquote(t)
              return t

          def find_tokens(text):
              text = htmlmod.unescape(text)
              found = set()

              for pat in (RACE_TOKEN_RE, NAV_TOKEN_RE):
                  for raw in pat.findall(text):
                      found.add(normalize_token(raw))

              # Also catch CNAME=... even if the surrounding HTML/JS format
              # changes slightly.
              for raw in re.findall(
                  r"CNAME\s*=\s*([^&\"'<>\s]+)", text, re.I
              ):
                  raw = normalize_token(raw)
                  if raw.startswith("pw01d") and "/" in raw:
                      found.add(raw)

              return found

          def find_race_tokens(text):
              return {
                  t for t in find_tokens(text)
                  if t.startswith("pw01dde")
              }

          def is_target_race_token(t):
              m = TOKEN_EXACT.fullmatch(t)
              if not m:
                  return False

              race_ymd = m.group("date")

              # 手動指定なら、その日だけを対象にする。
              if not auto_date:
                  return race_ymd == target_ymd

              # 自動指定なら、今日から14日先までを候補にする。
              try:
                  race_date = datetime.datetime.strptime(
                      race_ymd, "%Y%m%d"
                  ).date()
              except ValueError:
                  return False

              return search_from_date <= race_date <= search_to_date

          print("")
          print("=" * 70)
          print("JRA TOKEN DISCOVERY")
          print("=" * 70)
          print("ENTRY TOKEN:", ENTRY_TOKEN)

          discovered = set()
          visited = set()
          queue = []
          target_tokens = set()

          # ------------------------------------------------------------
          # STEP 1: POST the known JRA accessD entry token.
          # ------------------------------------------------------------
          try:
              entry_page = post_cname(ENTRY_TOKEN, BASE)
          except Exception as e:
              raise RuntimeError(
                  "JRA accessD入口の取得に失敗しました: " + repr(e)
              )

          entry_all = find_tokens(entry_page)
          entry_races = find_race_tokens(entry_page)
          discovered.update(entry_all)

          print("ENTRY ALL TOKENS:", len(entry_all))
          print("ENTRY RACE TOKENS:", len(entry_races))

          for t in sorted(entry_all):
              if is_target_race_token(t):
                  target_tokens.add(t)
              elif t != ENTRY_TOKEN:
                  queue.append(t)

          # ------------------------------------------------------------
          # STEP 2: breadth-first navigation through accessD pages.
          # Do not fetch race pages unless necessary; the purpose here is
          # to discover the race-token graph.
          # ------------------------------------------------------------
          max_pages = 250
          scanned_pages = 0

          while queue and scanned_pages < max_pages:
              token = queue.pop(0)

              if token in visited:
                  continue
              visited.add(token)

              # Race pages themselves are endpoints. If it is a target race,
              # keep it; there is no reason to crawl it for discovery.
              if token.startswith("pw01dde"):
                  if is_target_race_token(token):
                      target_tokens.add(token)
                  continue

              try:
                  page = post_cname(token, ACCESS)
              except Exception as e:
                  print("navigation warning:", token, repr(e))
                  continue

              scanned_pages += 1
              found = find_tokens(page)

              new_count = 0
              for child in found:
                  if child not in discovered:
                      discovered.add(child)
                      new_count += 1

                  if child.startswith("pw01dde"):
                      if is_target_race_token(child):
                          target_tokens.add(child)
                  elif child not in visited:
                      queue.append(child)

              print(
                  f"NAV {scanned_pages:03d}: "
                  f"found={len(found):03d} "
                  f"new={new_count:03d} "
                  f"target={len(target_tokens):02d}"
              )

              # AUTO modeでは複数日のtokenが見つかる可能性があるため、
              # 36件で途中停止せず、候補期間内のtokenを十分に収集してから
              # 最も早い開催日を1日だけ選択する。MANUAL modeの挙動は変更しない。
              if (not auto_date) and len(target_tokens) >= 36:
                  break

              time.sleep(0.25)

          print("")
          print("DISCOVERED TOKENS:", len(discovered))
          print("VISITED NAV TOKENS:", len(visited))
          print("TARGET TOKENS:", len(target_tokens))

          # ------------------------------------------------------------
          # STEP 3: If target race tokens were discovered directly, use them.
          # Otherwise make a second pass through any remaining navigation
          # tokens. This is deliberately bounded to avoid an accidental crawl.
          # ------------------------------------------------------------
          if len(target_tokens) < 36 and queue:
              print("")
              print("TARGET TOKENS < 36")
              print("Continuing remaining navigation queue...")

              while queue and scanned_pages < max_pages:
                  token = queue.pop(0)

                  if token in visited:
                      continue
                  visited.add(token)

                  if token.startswith("pw01dde"):
                      if is_target_race_token(token):
                          target_tokens.add(token)
                      continue

                  try:
                      page = post_cname(token, ACCESS)
                  except Exception as e:
                      print("navigation warning:", token, repr(e))
                      continue

                  scanned_pages += 1
                  found = find_tokens(page)

                  for child in found:
                      discovered.add(child)
                      if child.startswith("pw01dde"):
                          if is_target_race_token(child):
                              target_tokens.add(child)
                      elif child not in visited:
                          queue.append(child)

                  print(
                      f"NAV {scanned_pages:03d}: "
                      f"found={len(found):03d} "
                      f"target={len(target_tokens):02d}"
                  )

                  if (not auto_date) and len(target_tokens) >= 36:
                      break

                  time.sleep(0.25)

          # ------------------------------------------------------------
          # 自動モードでは、発見した候補tokenの中から最も早い開催日を選ぶ。
          # これにより月曜などの非開催日は次の土日へ自動的に進む。
          # ------------------------------------------------------------
          if auto_date and target_tokens:
              candidate_ymds = []
              for token in target_tokens:
                  mm = TOKEN_EXACT.fullmatch(token)
                  if not mm:
                      continue
                  candidate_ymds.append(mm.group("date"))

              if candidate_ymds:
                  selected_ymd = min(candidate_ymds)
                  target_ymd = selected_ymd
                  target_date = datetime.datetime.strptime(
                      target_ymd, "%Y%m%d"
                  ).date()
                  target_date_iso = target_date.isoformat()

                  # 選択した開催日だけを残す。
                  target_tokens = {
                      token for token in target_tokens
                      if (
                          (mm := TOKEN_EXACT.fullmatch(token))
                          and mm.group("date") == target_ymd
                      )
                  }

                  print("")
                  print("=" * 70)
                  print("AUTO SELECTED NEXT JRA RACE DAY")
                  print("=" * 70)
                  print("SELECTED DATE:", target_ymd, target_date_iso)
                  print("TARGET TOKENS AFTER DATE FILTER:", len(target_tokens))
                  print("=" * 70)

          if auto_date and not target_tokens:
              raise RuntimeError(
                  f"今日以降14日間にJRA開催日のtokenを発見できませんでした。開始日={search_from_date.isoformat()}"
              )

          # ------------------------------------------------------------
          # STEP 4: Structural validation / de-duplication.
          # ------------------------------------------------------------
          unique = {}
          for token in sorted(target_tokens):
              mm = TOKEN_EXACT.fullmatch(token)
              if not mm:
                  continue
              if mm.group("date") != target_ymd:
                  continue

              key = (mm.group("venue"), int(mm.group("race")))
              unique[key] = token

          print("")
          print("=" * 70)
          print("TARGET RACE TOKENS:", len(unique))
          print("=" * 70)

          for key, token in sorted(unique.items()):
              print(" ", key, token)

          if len(unique) == 0:
              raise RuntimeError(
                  f"対象日 {target_ymd} のJRAレースtokenを1件も取得できませんでした。"
              )

          # ------------------------------------------------------------
          # HTML helpers
          # ------------------------------------------------------------
          def class_attr(cls):
              # IMPORTANT: this must also match class="num" (single class).
              return rf'class\s*=\s*["\'][^"\']*\b{re.escape(cls)}\b[^"\']*["\']'

          TR_RE = re.compile(r"<tr\b[^>]*>.*?</tr>", re.I | re.S)

          def strip_tags(s):
              s = re.sub(r"<br\s*/?>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", "", s, flags=re.S)
              return re.sub(r"\s+", " ", htmlmod.unescape(s)).strip()

          def first_group(pattern, text, flags=re.I | re.S):
              mm = re.search(pattern, text, flags)
              return strip_tags(mm.group(1)) if mm else ""

          def parse_horse_row(tr):
              # A real horse row has both horse and jockey cells.
              if not re.search(class_attr("horse"), tr, re.I):
                  return None
              if not re.search(class_attr("jockey"), tr, re.I):
                  return None

              num_s = first_group(
                  rf'<td[^>]*{class_attr("num")}[^>]*>.*?([0-9]{{1,2}})', tr
              )
              if not num_s or not num_s.isdigit():
                  return None
              number = int(num_s)
              if not 1 <= number <= 18:
                  return None

              name = first_group(
                  rf'<div[^>]*{class_attr("name")}[^>]*>\s*(.*?)\s*</div>', tr
              )
              # The name div can contain an anchor; strip_tags handles it.
              name = re.sub(r"\s+", " ", name).strip()
              if not name:
                  return None

              odds_s = first_group(
                  rf'<div[^>]*{class_attr("odds")}[^>]*>.*?'
                  rf'<strong[^>]*>\s*([0-9]+(?:\.[0-9]+)?)\s*</strong>',
                  tr,
              )
              # JRA may publish 0.0 (or temporarily omit odds) for a runner
              # whose market value is unavailable. Keep the horse row and
              # normalize unavailable odds to null. The app already treats
              # odds<=0/null as "no market odds" and can fall back safely.
              if odds_s:
                  parsed_odds = float(odds_s)
                  odds = parsed_odds if parsed_odds > 0 else None
              else:
                  odds = None

              pop_s = first_group(
                  rf'<span[^>]*{class_attr("pop_rank")}[^>]*>\s*\(\s*([0-9]+)',
                  tr,
              )
              popularity = int(pop_s) if pop_s else None

              body_s = first_group(
                  rf'<div[^>]*{class_attr("weight")}[^>]*>\s*([0-9]+)\s*kg',
                  tr,
              )
              body_weight = int(body_s) if body_s else None

              diff_s = first_group(
                  rf'<span[^>]*{class_attr("transition")}[^>]*>\s*\(([-+]?\d+|-|初出走)\)',
                  tr,
              )
              if diff_s in ("", "-"):
                  body_weight_diff = None
              elif diff_s == "初出走":
                  body_weight_diff = None
              else:
                  body_weight_diff = int(diff_s)

              sex_age = first_group(
                  rf'<p[^>]*{class_attr("age")}[^>]*>\s*(.*?)\s*</p>', tr
              )
              carried_s = first_group(
                  rf'<p[^>]*{class_attr("weight")}[^>]*>\s*([0-9]+(?:\.[0-9]+)?)',
                  tr,
              )
              carried_weight = float(carried_s) if carried_s else None

              jockey = first_group(
                  rf'<p[^>]*{class_attr("jockey")}[^>]*>\s*(.*?)\s*</p>', tr
              )
              # Remove accidental leading marker symbols while preserving names.
              jockey = re.sub(r"\s+", " ", jockey).strip()

              return {
                  "number": number,
                  "name": name,
                  "odds": odds,
                  "popularity": popularity,
                  "body_weight": body_weight,
                  "body_weight_diff": body_weight_diff,
                  "sex_age": sex_age,
                  "carried_weight": carried_weight,
                  "jockey": jockey,
              }

          # ------------------------------------------------------------
          # Race metadata and horses
          # ------------------------------------------------------------
          venue_names = {
              "01": "札幌", "02": "函館", "03": "福島", "04": "新潟",
              "05": "東京", "06": "中山", "07": "中京", "08": "京都",
              "09": "阪神", "10": "小倉",
          }

          def parse_race(raw_html, token):
              # Primary parser: structured <tr>/<td> HTML.
              rows = []
              for tr in TR_RE.findall(raw_html):
                  h = parse_horse_row(tr)
                  if h:
                      rows.append(h)

              # De-duplicate by horse number.
              dedup = {}
              for h in rows:
                  dedup[h["number"]] = h
              horses = [dedup[k] for k in sorted(dedup)]

              # Metadata from text is secondary; horse parsing is strictly class-aware.
              p = TextParser()
              p.feed(raw_html)
              text = p.text()
              lines = [x.strip() for x in text.splitlines() if x.strip()]

              dm = re.search(r"(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日", text)
              tm = re.search(r"発走時刻：?\s*(\d{1,2})時\s*(\d{2})分", text)
              rm = re.search(r"(?:第\s*)?(\d{1,2})レース", text)
              # Race metadata must come from the actual race-result body, not
              # from navigation/hidden text elsewhere on the page.
              # The visible JRA layout is: weather -> track condition ->
              # race title -> race condition line containing distance/course.
              meet = re.search(r"(\d+)回([^\n|]+?)(\d+)日", text)

              # Use token for venue/race identity when text extraction is ambiguous.
              mm = TOKEN_EXACT.fullmatch(token)
              venue_code = mm.group("venue") if mm else ""
              race_no = int(mm.group("race")) if mm else 0

              meta = {
                  "date": (
                      f"{dm.group(1)}-{int(dm.group(2)):02d}-{int(dm.group(3)):02d}"
                      if dm else target_date_iso
                  ),
                  "venue_text": meet.group(2).strip() if meet else "",
                  "meet_day": int(meet.group(3)) if meet else None,
                  "no": int(rm.group(1)) if rm else race_no,
                  "time": f"{int(tm.group(1)):02d}:{tm.group(2)}" if tm else "",
                  "distance": None,
                  "surface": "",
                  "course": "",
                  "going": "",
              }

              # Parse the actual race-result body in order. This avoids
              # picking up the site's global "検索ウィンドウ" or other
              # hidden/navigation text.
              body_start = 0
              for idx, line in enumerate(lines):
                  if line == "ここから本文です":
                      body_start = idx
                      break

              body_lines = lines[body_start:] if body_start else lines
              weather_idx = next((i for i, line in enumerate(body_lines)
                                  if line.startswith("天候")), None)

              # Track condition: take the first 芝/ダート line immediately
              # after the weather line. The condition is the suffix.
              if weather_idx is not None:
                  for line in body_lines[weather_idx + 1:weather_idx + 5]:
                      m = re.search(r"^(?:芝|ダート).*?(不良|稍重|重|良)\s*$", line)
                      if m:
                          meta["going"] = m.group(1)
                          break

              # Race title: after the weather/track lines, the first meaningful
              # line before 本賞金 is the official race title.
              meta["name"] = "レース"
              title_start = weather_idx + 1 if weather_idx is not None else 0
              for line in body_lines[title_start:title_start + 20]:
                  if not line or line in ("レース映像", "検索ウィンドウ", "本文へ移動する"):
                      continue
                  if line.startswith(("天候", "本賞金", "コース：", "コース:")):
                      continue
                  if re.search(r"(?:\d+レース|Image:)", line):
                      continue
                  # The official title is a short standalone line here.
                  if len(line) <= 100:
                      meta["name"] = line
                      break

              # Distance / surface / course: use the course line belonging to
              # this race, not an unrelated distance string elsewhere.
              course_line = next((line for line in body_lines[title_start:title_start + 30]
                                  if re.search(r"コース[:：].*メートル（(?:芝|ダート)(?:→(?:芝|ダート))?(?:・[^）]+)?）", line)), None)
              if course_line:
                  # Normal races: 例「1,200メートル（芝・右）」
                  # Obstacle races: 例「2,880メートル（芝→ダート）」
                  dist = re.search(r"([\d,]+)メートル（([^）]+)）", course_line)
                  if dist:
                      meta["distance"] = int(dist.group(1).replace(",", ""))
                      course_spec = dist.group(2).strip()
                      if "→" in course_spec:
                          # JRA obstacle-course notation. Keep the official
                          # surface transition as-is; there is no single
                          # left/right course direction to store.
                          meta["surface"] = course_spec
                          meta["course"] = ""
                      elif "・" in course_spec:
                          surf, course = course_spec.split("・", 1)
                          meta["surface"] = surf.strip()
                          meta["course"] = course.strip()

              return meta, horses

          # ------------------------------------------------------------
          # Fetch all races
          # ------------------------------------------------------------
          races = []
          failures = []

          for (vcode, race_no), token in sorted(unique.items(), key=lambda x: (x[0][0], x[0][1])):
              url = f"{ACCESS}?CNAME={urllib.parse.quote(token, safe='')}"
              try:
                  raw_html = get_html(url, ACCESS)
                  meta, horses = parse_race(raw_html, token)

                  if not horses:
                      raise RuntimeError("馬データを1頭も抽出できませんでした")

                  # Strong quality checks: every row must have correct identity fields.
                  bad = []
                  for h in horses:
                      if not h["name"]:
                          bad.append(f"{h['number']}:empty-name")
                      # Odds may be temporarily unavailable (0 or null).
                      # Missing market odds must not invalidate the whole race.
                      if not h["sex_age"]:
                          bad.append(f"{h['number']}:missing-sex-age")
                      if not h["jockey"]:
                          bad.append(f"{h['number']}:missing-jockey")
                  if bad:
                      raise RuntimeError("品質チェックNG: " + ", ".join(bad[:8]))

                  races.append({
                      "venue": venue_names.get(vcode, vcode),
                      "venue_code": vcode,
                      "meet": meta["venue_text"],
                      "meet_day": meta["meet_day"],
                      "no": race_no,
                      "date": meta["date"],
                      "time": meta["time"],
                      "name": meta["name"],
                      "distance": meta["distance"],
                      "surface": meta["surface"],
                      "course": meta["course"],
                      "going": meta["going"],
                      "url": url,
                      "token": token,
                      "horses": horses,
                  })
                  print(
                      "OK",
                      venue_names.get(vcode, vcode),
                      f"{race_no}R",
                      "horses=",
                      len(horses),
                  )
              except Exception as e:
                  failures.append({
                      "venue_code": vcode,
                      "race": race_no,
                      "token": token,
                      "url": url,
                      "error": repr(e),
                  })
                  print("FAIL", vcode, race_no, repr(e))
              time.sleep(0.35)

          races.sort(key=lambda r: (r["venue_code"], r["no"]))

          # ------------------------------------------------------------
          # Final integrity checks
          # ------------------------------------------------------------
          expected = len(unique)
          print("EXPECTED RACES:", expected)
          print("SUCCESS RACES:", len(races))
          print("FAILURES:", len(failures))

          if failures:
              raise RuntimeError(
                  f"JRAレース取得失敗: {len(failures)}件。最初の失敗={failures[0]['error']}"
              )

          if len(races) != expected:
              raise RuntimeError(
                  f"取得レース数が一致しません: expected={expected}, actual={len(races)}"
              )

          # Normal JRA Sunday/Saturday pattern is usually 36 races, but do not
          # hard-code 36 because holidays/開催変更 can differ.
          for r in races:
              nums = [h["number"] for h in r["horses"]]
              if nums != sorted(set(nums)):
                  raise RuntimeError(f"馬番重複/順序異常: {r['venue']} {r['no']}R")

          venue_counts = {}
          for r in races:
              venue_counts[r["venue"]] = venue_counts.get(r["venue"], 0) + 1

          out = {
              "date": target_date_iso,
              "updated_at": now.isoformat(),
              "calendar_url": cal_url,
              "target_ymd": target_ymd,
              "official_race_links": [r["url"] for r in races],
              "races": races,
              "venue_counts": venue_counts,
              "source": "JRA公式 accessD",
              "parser_version": "12.0",
          }

          archive_path = Path(f"data/daily/{target_ymd}.json")
          archive_path.write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          # Keep the existing file for backward compatibility with the app.
          out_path = Path("data/jra_daily.json")
          out_path.write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("WROTE:", archive_path)
          print("WROTE:", out_path)

          # GitHub Actions Summary
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as sf:
                  sf.write("## JRA data sync\n\n")
                  sf.write(f"- 対象日: **{target_date_iso}**\n")
                  sf.write(f"- レース数: **{len(races)}**\n")
                  sf.write(f"- 取得失敗: **{len(failures)}**\n")
                  sf.write("\n| 競馬場 | レース数 |\n|---|---:|\n")
                  for venue, count in sorted(venue_counts.items()):
                      sf.write(f"| {venue} | {count} |\n")
                  sf.write("\n### Horse data sample\n")
                  if races:
                      r0 = races[0]
                      for h in r0["horses"][:5]:
                          sf.write(
                              f"- {h['number']} {h['name']} / {h['odds']} / "
                              f"{h['sex_age']} / {h['carried_weight']}kg / {h['jockey']}\n"
                          )

          print("VENUE COUNTS:", json.dumps(venue_counts, ensure_ascii=False))
          print("WROTE:", out_path)
          PY

      - name: Commit synced JRA data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra_daily.json data/jra_history.json data/daily data/history
          if git diff --cached --quiet; then
            echo "No JRA data changes to commit."
          else
            git commit -m "chore: sync JRA race data"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
