name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]
  schedule:
    # JST 08:00 every day. The script automatically selects the next JRA race day.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 (YYYYMMDD)。空欄なら次回JRA開催日。過去日も指定可能"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official race pages
        shell: bash
        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}
        run: |
          set -euo pipefail
          mkdir -p data

          python3 - <<'PY'
          import datetime
          import html as htmlmod
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os

          UA = "Mozilla/5.0 (compatible; keiba-simulator/jra-sync-13.0)"
          BASE = "https://www.jra.go.jp"
          ACCESS_D = BASE + "/JRADB/accessD.html"
          ACCESS_S = BASE + "/JRADB/accessS.html"
          cal_url = BASE + "/JRADB/"
          JST = ZoneInfo("Asia/Tokyo")

          # ------------------------------------------------------------
          # Date
          # ------------------------------------------------------------
          now = datetime.datetime.now(JST)
          requested = os.environ.get("RACE_DATE_INPUT", "").strip()
          auto_date = not bool(requested)

          if requested:
              if not re.fullmatch(r"\d{8}", requested):
                  raise RuntimeError("race_date は YYYYMMDD 形式で指定してください")
              target_ymd = requested
          else:
              target_ymd = now.strftime("%Y%m%d")

          target_date = datetime.datetime.strptime(target_ymd, "%Y%m%d").date()
          target_date_iso = target_date.isoformat()
          historical_mode = target_date < now.date()
          ACCESS = ACCESS_S if historical_mode else ACCESS_D

          # GitHub Actionsの手動指定がない場合は、今日が非開催日でも
          # 次回のJRA開催日を自動的に選ぶ。
          search_from_date = target_date
          search_to_date = target_date + datetime.timedelta(days=14)

          print("")
          print("=" * 70)
          print("DATE SELECTION")
          print("=" * 70)
          print("MODE:", "AUTO / NEXT JRA RACE DAY" if auto_date else "MANUAL")
          print("DATA ROUTE:", "HISTORICAL / accessS" if historical_mode else "CURRENT / accessD")
          print("START DATE:", target_date_iso)
          if auto_date:
              print("SEARCH RANGE:", search_from_date.isoformat(), "->", search_to_date.isoformat())
          print("=" * 70)

          # ------------------------------------------------------------
          # HTTP session
          # ------------------------------------------------------------
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def request_bytes(url, method="GET", data=None, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with opener.open(req, timeout=45) as r:
                  return r.read()

          def decode_jra(raw):
              # JRA accessD pages declare Shift_JIS. Do not use response.apparent_encoding.
              for enc in ("cp932", "shift_jis", "utf-8"):
                  try:
                      text = raw.decode(enc)
                      if "<html" in text.lower() or "JRADB" in text:
                          return text
                  except UnicodeDecodeError:
                      pass
              return raw.decode("cp932", "replace")

          def get_html(url, referer=None):
              return decode_jra(request_bytes(url, "GET", None, referer))

          def post_cname(token, referer=None):
              data = urllib.parse.urlencode({"cname": token}).encode("ascii")
              return decode_jra(request_bytes(ACCESS, "POST", data, referer))

          # ------------------------------------------------------------
          # Token discovery
          #
          # Current/future: accessD graph (entry -> venue/day -> races).
          # Historical: JRA's official past-results graph:
          #   accessS -> pw01skl10YYYYMM/CD -> pw01srl... -> pw01sde...
          # The month checksum is exposed by JRA itself in objParam.
          # ------------------------------------------------------------
          TOKEN_EXACT = re.compile(
              r"^pw01(?P<kind>[ds])de"
              r"(?P<prefix>[0-9A-Za-z]{2})"
              r"(?P<venue>[0-9]{2})"
              r"(?P<year>[0-9]{4})"
              r"(?P<month>[0-9]{2})"
              r"(?P<day>[0-9]{2})"
              r"(?P<race>[0-9]{2})"
              r"(?P<date>[0-9]{8})"
              r"/(?P<hex>[0-9A-Fa-f]{2})$",
              re.I,
          )

          def normalize_token(t):
              t = htmlmod.unescape(t).strip()
              t = urllib.parse.unquote(t)
              return t

          def find_all_cname_tokens(text):
              text = htmlmod.unescape(text)
              found = set()
              # Broad enough for both current (d*) and historical (s*) JRA DB links.
              for raw in re.findall(r"pw01[ds][a-z0-9]+(?:/|%2F)[0-9A-Fa-f]{2}", text, re.I):
                  found.add(normalize_token(raw))
              for raw in re.findall(r"CNAME\s*=\s*([^&\"'<>\s]+)", text, re.I):
                  raw = normalize_token(raw)
                  if raw.startswith("pw01") and "/" in raw:
                      found.add(raw)
              return found

          def find_race_tokens(text, historical=False):
              prefix = "pw01sde" if historical else "pw01dde"
              return {t for t in find_all_cname_tokens(text) if t.startswith(prefix)}

          def token_date(t):
              mm = TOKEN_EXACT.fullmatch(t)
              return mm.group("date") if mm else None

          def is_target_race_token(t):
              d = token_date(t)
              return d == target_ymd

          target_tokens = set()

          if historical_mode:
              print("")
              print("=" * 70)
              print("HISTORICAL JRA RESULT TOKEN DISCOVERY")
              print("=" * 70)
              print("TARGET DATE:", target_ymd)

              # JRA exposes the checksum table used by pw01skl10YYYYMM/CD.
              # This avoids guessing the checksum and supports arbitrary years
              # covered by JRA's official result archive.
              # JRA historical selector exposes objParam keys as YYMM.
              # Example: objParam["2609"] = "XX" for September 2026.
              # Keep YYYYMM as a fallback for page variants.
              def discover_month_checksum(yyyymm):
                  seed = "pw01skl00999999/B3"
                  page = post_cname(seed, BASE)
                  scripts = re.findall(r"<script[^>]*>.*?</script>", page, re.I | re.S)
                  sources = scripts + [page]
                  patterns = [
                      r'objParam\s*\[\s*["\']([0-9]{4})["\']\s*\]\s*=\s*["\']([0-9A-Fa-f]{2})["\']',
                      r'objParam\s*\[\s*["\']([0-9]{6})["\']\s*\]\s*=\s*["\']([0-9A-Fa-f]{2})["\']',
                  ]
                  for source in sources:
                      if "objParam" not in source:
                          continue
                      for pattern in patterns:
                          table = dict(re.findall(pattern, source, re.I))
                          cd = table.get(yyyymm[2:]) or table.get(yyyymm)
                          if cd:
                              return cd
                  return None

              yyyymm = target_ymd[:6]
              cd = discover_month_checksum(yyyymm)
              if not cd:
                  raise RuntimeError(f"JRA過去レース結果の月チェックデジットを取得できません: {yyyymm}")

              month_token = f"pw01skl10{yyyymm}/{cd}"

              # JRA historical month pages have used multiple selector variants.
              # Keep the known-good v19 discovery logic: try both pw01skl10 and
              # pw01skl00, and inspect both JavaScript doAction() links and
              # generic CNAME-like text.
              def clean_token(x):
                  x = htmlmod.unescape(x)
                  x = urllib.parse.unquote(x)
                  x = x.strip().rstrip(',;')
                  return x

              ACTION_TOKEN_RE = re.compile(
                  r"doAction\s*\(\s*['\"](?:/JRADB/)?accessS\.html['\"]\s*,\s*['\"]?(pw01(?:srl|sde)[^'\")\s<>&]+)['\"]?",
                  re.I,
              )
              GENERIC_TOKEN_RE = re.compile(
                  r"(pw01(?:srl|sde)[^\s'\"<>]+/[0-9A-Fa-f]{2})",
                  re.I,
              )

              def find_tokens(text, prefix):
                  text = htmlmod.unescape(text)
                  found = set()
                  for x in ACTION_TOKEN_RE.findall(text):
                      x = clean_token(x)
                      if x.lower().startswith(prefix.lower()):
                          found.add(x)
                  for x in GENERIC_TOKEN_RE.findall(text):
                      x = clean_token(x)
                      if x.lower().startswith(prefix.lower()):
                          found.add(x)
                  return found

              def find_srl_tokens(text):
                  return find_tokens(text, 'pw01srl')

              def find_sde_tokens(text):
                  return find_tokens(text, 'pw01sde')

              month_candidates = [
                  month_token,
                  f"pw01skl00{yyyymm}/{cd}",
              ]

              chosen_month_token = None
              month_page = ""
              srl_tokens = set()
              for candidate in month_candidates:
                  for mode in ("POST", "GET"):
                      try:
                          if mode == "POST":
                              page = post_cname(candidate, ACCESS_S)
                          else:
                              url = ACCESS_S + "?CNAME=" + urllib.parse.quote(candidate, safe="")
                              page = get_html(url, ACCESS_S)
                          found = find_srl_tokens(page)
                          title_m = re.search(r"<title[^>]*>(.*?)</title>", page, re.I | re.S)
                          title = (re.sub(r"\s+", " ", htmlmod.unescape(title_m.group(1))).strip()[:120]
                                   if title_m else "")
                          print(f"MONTH TRY: {candidate} {mode} len={len(page)} srl={len(found)} title={title}")
                          if found:
                              chosen_month_token = candidate
                              month_page = page
                              srl_tokens = found
                              break
                      except Exception as e:
                          print("MONTH TRY WARNING:", candidate, mode, repr(e))
                  if chosen_month_token:
                      break

              print("MONTH TOKEN USED:", chosen_month_token or month_token)
              print("MEETING/DAY TOKENS:", len(srl_tokens))
              for sample in sorted(srl_tokens)[:10]:
                  print("  SRL SAMPLE:", sample)

              if not srl_tokens:
                  print("MONTH PAGE CONTAINS pw01srl:", "pw01srl" in month_page.lower())
                  raise RuntimeError(f"JRA過去レース結果の開催日選択tokenを取得できません: {yyyymm}")

              # IMPORTANT: one month page contains multiple venue/day selector
              # tokens.  Each srl page can contain either the target date or
              # another date.  Scan ALL of them and collect ALL target sde
              # tokens.  POST is preferred; GET is a fallback when POST does
              # not expose result links.
              sde_tokens = set()
              rsl_target = []
              for i, srl in enumerate(sorted(srl_tokens), 1):
                  page = None
                  found = set()
                  try:
                      page = post_cname(srl, ACCESS_S)
                      found = find_sde_tokens(page)
                      title_m = re.search(r"<title[^>]*>(.*?)</title>", page, re.I | re.S)
                      title = (re.sub(r"\s+", " ", htmlmod.unescape(title_m.group(1))).strip()[:100]
                               if title_m else "")
                      print(f"HIST NAV {i:03d}/{len(srl_tokens):03d}: POST len={len(page)} sde={len(found)} title={title}")
                  except Exception as e:
                      print("HIST NAV POST WARNING:", srl, repr(e))

                  target_found = {x for x in found if target_ymd in x}

                  # If POST returned no result tokens, retry the exact same
                  # srl token via GET before giving up on that venue/day.
                  if not target_found:
                      try:
                          url = ACCESS_S + "?CNAME=" + urllib.parse.quote(srl, safe="")
                          page_get = get_html(url, ACCESS_S)
                          found_get = find_sde_tokens(page_get)
                          target_get = {x for x in found_get if target_ymd in x}
                          if found_get:
                              found = found_get
                          if target_get:
                              target_found = target_get
                              print(f"HIST NAV {i:03d}/{len(srl_tokens):03d}: GET len={len(page_get)} sde={len(found_get)} target={len(target_get)}")
                      except Exception as e:
                          print("HIST NAV GET WARNING:", srl, repr(e))

                  if target_found:
                      rsl_target.append(srl)
                      sde_tokens.update(target_found)
                  print(
                      f"HIST NAV RESULT {i:03d}/{len(srl_tokens):03d}: "
                      f"all_sde={len(found)} target={len(target_found)} "
                      f"total_target={len(sde_tokens)}"
                  )
                  time.sleep(0.20)

              print("TARGET RSL TOKENS:", len(rsl_target))
              print("HISTORICAL RACE TOKENS:", len(sde_tokens))
              if not rsl_target or not sde_tokens:
                  raise RuntimeError(
                      f"{target_ymd} の開催選択/レース結果token(pw01srl/pw01sde)を取得できませんでした。"
                  )

              unique = {}
              for token in sorted(sde_tokens):
                  token = clean_token(token)
                  mm = TOKEN_EXACT.fullmatch(token)
                  if mm and mm.group("date") == target_ymd:
                      unique[(mm.group("venue"), int(mm.group("race")))] = token

              print("TARGET HISTORICAL RACES:", len(unique))
              if not unique:
                  raise RuntimeError(f"指定日 {target_ymd} のJRA過去レース結果が0件です。")

          else:
              ENTRY_TOKEN = "pw01dli00/F3"
              RACE_TOKEN_RE = re.compile(
                  r"pw01dde[0-9A-Za-z]{22}(?:/|%2F)[0-9A-Fa-f]{2}", re.I
              )
              NAV_TOKEN_RE = re.compile(
                  r"pw01d(?:li|de)[0-9A-Za-z]+(?:/|%2F)[0-9A-Fa-f]{2}",
                  re.I,
              )

              print("")
              print("=" * 70)
              print("JRA TOKEN DISCOVERY")
              print("=" * 70)
              print("ENTRY TOKEN:", ENTRY_TOKEN)

              discovered = set()
              visited = set()
              queue = []
              target_tokens = set()

              try:
                  entry_page = post_cname(ENTRY_TOKEN, BASE)
              except Exception as e:
                  raise RuntimeError("JRA accessD入口の取得に失敗しました: " + repr(e))

              entry_all = find_all_cname_tokens(entry_page)
              discovered.update(entry_all)
              print("ENTRY ALL TOKENS:", len(entry_all))

              for t in sorted(entry_all):
                  if t.startswith("pw01dde") and is_target_race_token(t):
                      target_tokens.add(t)
                  elif t != ENTRY_TOKEN:
                      queue.append(t)

              max_pages = 250
              scanned_pages = 0

              while queue and scanned_pages < max_pages:
                  token = queue.pop(0)
                  if token in visited:
                      continue
                  visited.add(token)
                  if token.startswith("pw01dde"):
                      if is_target_race_token(token):
                          target_tokens.add(token)
                      continue
                  try:
                      page = post_cname(token, ACCESS_D)
                  except Exception as e:
                      print("navigation warning:", token, repr(e))
                      continue
                  scanned_pages += 1
                  found = find_all_cname_tokens(page)
                  for child in found:
                      discovered.add(child)
                      if child.startswith("pw01dde"):
                          if is_target_race_token(child):
                              target_tokens.add(child)
                      elif child not in visited:
                          queue.append(child)
                  print(f"NAV {scanned_pages:03d}: found={len(found):03d} target={len(target_tokens):02d}")
                  if (not auto_date) and len(target_tokens) >= 36:
                      break
                  time.sleep(0.25)

              if auto_date and target_tokens:
                  candidate_ymds = [token_date(t) for t in target_tokens if token_date(t)]
                  selected_ymd = min(candidate_ymds)
                  target_ymd = selected_ymd
                  target_date = datetime.datetime.strptime(target_ymd, "%Y%m%d").date()
                  target_date_iso = target_date.isoformat()
                  target_tokens = {t for t in target_tokens if token_date(t) == target_ymd}
                  print("")
                  print("=" * 70)
                  print("AUTO SELECTED NEXT JRA RACE DAY")
                  print("=" * 70)
                  print("SELECTED DATE:", target_ymd, target_date_iso)
                  print("TARGET TOKENS AFTER DATE FILTER:", len(target_tokens))
                  print("=" * 70)

              if auto_date and not target_tokens:
                  raise RuntimeError(
                      f"今日以降14日間にJRA開催日のtokenを発見できませんでした。開始日={search_from_date.isoformat()}"
                  )

              unique = {}
              for token in sorted(target_tokens):
                  mm = TOKEN_EXACT.fullmatch(token)
                  if not mm or mm.group("date") != target_ymd:
                      continue
                  unique[(mm.group("venue"), int(mm.group("race")))] = token

              print("")
              print("=" * 70)
              print("TARGET RACE TOKENS:", len(unique))
              print("=" * 70)
              if not unique:
                  raise RuntimeError(f"対象日 {target_ymd} のJRAレースtokenを1件も取得できませんでした。")

          # ------------------------------------------------------------
          # HTML helpers

          # ------------------------------------------------------------
          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.out = []

              def handle_starttag(self, tag, attrs):
                  if tag in ("tr", "p", "div", "li", "h1", "h2", "h3"):
                      self.out.append("\n")
                  elif tag in ("td", "th"):
                      self.out.append(" | ")

              def handle_endtag(self, tag):
                  if tag in ("tr", "p", "div", "li", "h1", "h2", "h3"):
                      self.out.append("\n")

              def handle_data(self, data):
                  self.out.append(data)

              def text(self):
                  s = htmlmod.unescape("".join(self.out))
                  lines = []
                  for raw_line in s.splitlines():
                      x = re.sub(r"\s+", " ", raw_line).strip(" |")
                      if x:
                          lines.append(x)
                  return "\n".join(lines)

          def class_attr(cls):
              # IMPORTANT: this must also match class="num" (single class).
              return rf'class\s*=\s*["\'][^"\']*\b{re.escape(cls)}\b[^"\']*["\']'

          TR_RE = re.compile(r"<tr\b[^>]*>.*?</tr>", re.I | re.S)

          def strip_tags(s):
              s = re.sub(r"<br\s*/?>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", "", s, flags=re.S)
              return re.sub(r"\s+", " ", htmlmod.unescape(s)).strip()

          def first_group(pattern, text, flags=re.I | re.S):
              mm = re.search(pattern, text, flags)
              return strip_tags(mm.group(1)) if mm else ""

          def parse_horse_row(tr):
              # A real horse row has both horse and jockey cells.
              if not re.search(class_attr("horse"), tr, re.I):
                  return None
              if not re.search(class_attr("jockey"), tr, re.I):
                  return None

              num_s = first_group(
                  rf'<td[^>]*{class_attr("num")}[^>]*>.*?([0-9]{{1,2}})', tr
              )
              if not num_s or not num_s.isdigit():
                  return None
              number = int(num_s)
              if not 1 <= number <= 18:
                  return None

              name = first_group(
                  rf'<div[^>]*{class_attr("name")}[^>]*>\s*(.*?)\s*</div>', tr
              )
              # The name div can contain an anchor; strip_tags handles it.
              name = re.sub(r"\s+", " ", name).strip()
              if not name:
                  return None

              odds_s = first_group(
                  rf'<div[^>]*{class_attr("odds")}[^>]*>.*?'
                  rf'<strong[^>]*>\s*([0-9]+(?:\.[0-9]+)?)\s*</strong>',
                  tr,
              )
              if not odds_s and historical_mode:
                  # Historical result rows may expose final odds in a td/div
                  # without the current entry-page odds wrapper.
                  m_od = re.search(r'(?:単勝|オッズ)[^0-9]{0,80}([0-9]+(?:\.[0-9]+)?)', strip_tags(tr))
                  if m_od:
                      odds_s = m_od.group(1)
              if not odds_s:
                  odds_s = "0"
              odds = float(odds_s)

              pop_s = first_group(
                  rf'<span[^>]*{class_attr("pop_rank")}[^>]*>\s*\(\s*([0-9]+)',
                  tr,
              )
              popularity = int(pop_s) if pop_s else None

              body_s = first_group(
                  rf'<div[^>]*{class_attr("weight")}[^>]*>\s*([0-9]+)\s*kg',
                  tr,
              )
              body_weight = int(body_s) if body_s else None

              diff_s = first_group(
                  rf'<span[^>]*{class_attr("transition")}[^>]*>\s*\(([-+]?\d+|-|初出走)\)',
                  tr,
              )
              if diff_s in ("", "-"):
                  body_weight_diff = None
              elif diff_s == "初出走":
                  body_weight_diff = None
              else:
                  body_weight_diff = int(diff_s)

              sex_age = first_group(
                  rf'<p[^>]*{class_attr("age")}[^>]*>\s*(.*?)\s*</p>', tr
              )
              carried_s = first_group(
                  rf'<p[^>]*{class_attr("weight")}[^>]*>\s*([0-9]+(?:\.[0-9]+)?)',
                  tr,
              )
              carried_weight = float(carried_s) if carried_s else None

              jockey = first_group(
                  rf'<p[^>]*{class_attr("jockey")}[^>]*>\s*(.*?)\s*</p>', tr
              )
              # Remove accidental leading marker symbols while preserving names.
              jockey = re.sub(r"\s+", " ", jockey).strip()

              # Historical result pages expose finish order in the first result cell.
              finish = None
              if historical_mode:
                  fm = re.search(r'<td[^>]*>\s*([0-9]{1,2})\s*</td>', tr, re.I | re.S)
                  if fm:
                      fval = int(fm.group(1))
                      if 1 <= fval <= 18:
                          finish = fval

              return {
                  "number": number,
                  "name": name,
                  "odds": odds,
                  "popularity": popularity,
                  "body_weight": body_weight,
                  "body_weight_diff": body_weight_diff,
                  "sex_age": sex_age,
                  "carried_weight": carried_weight,
                  "jockey": jockey,
                  "finish": finish,
              }

          # ------------------------------------------------------------
          # Race metadata and horses
          # ------------------------------------------------------------
          venue_names = {
              "01": "札幌", "02": "函館", "03": "福島", "04": "新潟",
              "05": "東京", "06": "中山", "07": "中京", "08": "京都",
              "09": "阪神", "10": "小倉",
          }


          # Historical-result rows need finish/frame information for downstream
          # backtesting and course-suitability calculations.  The current entry
          # parser intentionally does not expose those fields, so in historical
          # mode parse JRA's result table separately and merge by horse number.
          class ResultCellParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []; self.row = None; self.cell = None; self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif self.row is not None and tag in ("td", "th"):
                      self.cell = []; self.parts = []
                  elif self.cell is not None and tag == "img":
                      alt = dict(attrs).get("alt", "")
                      if alt:
                          self.parts.append(alt)
              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.row is not None and self.cell is not None:
                      txt = re.sub(r"\s+", " ", htmlmod.unescape("".join(self.parts))).strip()
                      self.row.append(txt); self.cell = None; self.parts = []
                  elif tag == "tr" and self.row is not None:
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None; self.cell = None; self.parts = []
              def handle_data(self, data):
                  if self.cell is not None:
                      self.parts.append(data)

          def parse_historical_result_fields(raw_html):
              cp = ResultCellParser(); cp.feed(raw_html)
              out = {}
              for cells in cp.rows:
                  if len(cells) < 14:
                      continue
                  fm = re.fullmatch(r"\d+", cells[0].strip())
                  fr = re.search(r"(\d+)", cells[1])
                  nm = re.fullmatch(r"\d+", cells[2].strip())
                  if not fm or not fr or not nm:
                      continue
                  finish = int(fm.group(0)); frame = int(fr.group(1)); no = int(nm.group(0))
                  if not (1 <= finish <= 18 and 1 <= frame <= 8 and 1 <= no <= 18):
                      continue
                  body_weight = None; body_diff = None
                  bw = re.search(r"(\d{3})\s*\(([-+]?\d+|-)\)", cells[11])
                  if bw:
                      body_weight = int(bw.group(1))
                      body_diff = None if bw.group(2) == "-" else int(bw.group(2))
                  pop = None
                  pm = re.search(r"(\d+)", cells[13])
                  if pm:
                      pop = int(pm.group(1))
                  corner4 = None
                  cm = re.search(r"(?:[0-9]+-)*([0-9]+)$", cells[9].strip())
                  if cm:
                      corner4 = int(cm.group(1))
                  out[no] = {
                      "finish": finish, "frame": frame,
                      "body_weight": body_weight, "body_weight_diff": body_diff,
                      "popularity": pop, "corner4": corner4
                  }
              return out

          def parse_race(raw_html, token):
              # Primary parser: structured <tr>/<td> HTML.
              rows = []
              for tr in TR_RE.findall(raw_html):
                  h = parse_horse_row(tr)
                  if h:
                      rows.append(h)

              # De-duplicate by horse number.
              dedup = {}
              for h in rows:
                  dedup[h["number"]] = h
              horses = [dedup[k] for k in sorted(dedup)]

              # Metadata from text is secondary; horse parsing is strictly class-aware.
              p = TextParser()
              p.feed(raw_html)
              text = p.text()
              lines = [x.strip() for x in text.splitlines() if x.strip()]

              dm = re.search(r"(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日", text)
              tm = re.search(r"発走時刻：?\s*(\d{1,2})時\s*(\d{2})分", text)
              rm = re.search(r"(?:第\s*)?(\d{1,2})レース", text)
              dist = re.search(r"([\d,]+)メートル（(芝|ダート)・([^）]+)）", text)
              meet = re.search(r"(\d+)回([^\n|]+?)(\d+)日", text)

              # Use token for venue/race identity when text extraction is ambiguous.
              mm = TOKEN_EXACT.fullmatch(token)
              venue_code = mm.group("venue") if mm else ""
              race_no = int(mm.group("race")) if mm else 0

              meta = {
                  "date": (
                      f"{dm.group(1)}-{int(dm.group(2)):02d}-{int(dm.group(3)):02d}"
                      if dm else target_date_iso
                  ),
                  "venue_text": meet.group(2).strip() if meet else "",
                  "meet_day": int(meet.group(3)) if meet else None,
                  "no": int(rm.group(1)) if rm else race_no,
                  "time": f"{int(tm.group(1)):02d}:{tm.group(2)}" if tm else "",
                  "distance": int(dist.group(1).replace(",", "")) if dist else None,
                  "surface": dist.group(2) if dist else "",
                  "course": dist.group(3) if dist else "",
                  "going": "",
              }

              # Try a few common going expressions.
              gm = re.search(r"(?:芝|ダート)[^\n|]{0,30}(良|稍重|重|不良)", text)
              if gm:
                  meta["going"] = gm.group(1)

              # Name: locate a likely race title line near the top.
              meta["name"] = "レース"
              for line in lines[:120]:
                  if "レース" in line and len(line) < 120:
                      meta["name"] = line
                      break

              return meta, horses

          # ------------------------------------------------------------
          # Historical result parser (table-cell based)
          # ------------------------------------------------------------
          # IMPORTANT: historical accessS result pages do not use the same
          # horse/jockey CSS wrappers as current accessD entry pages. The
          # class-based parse_horse_row() above is intentionally kept for
          # current pages, but must NOT be used as the primary parser for
          # historical result pages. JRA's result table is parsed by column
          # position, which is the format used by the previously verified
          # historical parser.
          class HistoricalCellParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows=[]; self.row=None; self.cell=None; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row=[]
                  elif self.row is not None and tag in ("td", "th"):
                      self.cell=[]; self.parts=[]
                  elif self.cell is not None and tag == "img":
                      alt=dict(attrs).get("alt", "")
                      if alt:
                          self.parts.append(alt)
              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.row is not None and self.cell is not None:
                      txt=re.sub(r"\s+", " ", htmlmod.unescape("".join(self.parts))).strip()
                      self.row.append(txt)
                      self.cell=None; self.parts=[]
                  elif tag == "tr" and self.row is not None:
                      if self.row:
                          self.rows.append(self.row)
                      self.row=None; self.cell=None; self.parts=[]
              def handle_data(self, data):
                  if self.cell is not None:
                      self.parts.append(data)

          def parse_historical_result_page(raw_html, token):
              cp=HistoricalCellParser(); cp.feed(raw_html)
              rows=[]
              for cells in cp.rows:
                  # JRA result table columns:
                  # finish, frame(image), horse no, horse, sex/age,
                  # carried weight, jockey, time, margin, corner order,
                  # last-3F, body weight, trainer, popularity.
                  if len(cells) < 14:
                      continue
                  finish_s=cells[0].strip()
                  frame_m=re.search(r"(\d+)", cells[1])
                  no_m=re.fullmatch(r"\d+", cells[2].strip())
                  if not re.fullmatch(r"\d+", finish_s) or not frame_m or not no_m:
                      continue
                  finish=int(finish_s); frame=int(frame_m.group(1)); no=int(cells[2])
                  if not (1 <= no <= 18 and 1 <= finish <= 18 and 1 <= frame <= 8):
                      continue
                  name=re.sub(r"\s+", " ", cells[3]).strip()
                  if not name:
                      continue
                  sex_age=cells[4].strip()
                  carried=None
                  cm=re.search(r"([0-9]+(?:\.[0-9]+)?)", cells[5])
                  if cm:
                      carried=float(cm.group(1))
                  jockey=re.sub(r"\s+", " ", cells[6]).strip()
                  if not jockey:
                      continue
                  body_weight=None; body_diff=None
                  bw=re.search(r"(\d{3})\s*\(([-+]?\d+|-)\)", cells[11])
                  if bw:
                      body_weight=int(bw.group(1))
                      body_diff=None if bw.group(2)=="-" else int(bw.group(2))
                  pop=None
                  pm=re.search(r"(\d+)", cells[13])
                  if pm:
                      pop=int(pm.group(1))
                  corner4=None
                  cm4=re.search(r"(?:[0-9]+-)*([0-9]+)$", cells[9].strip())
                  if cm4:
                      corner4=int(cm4.group(1))
                  rows.append({
                      "number":no, "name":name, "odds":0, "popularity":pop,
                      "body_weight":body_weight, "body_weight_diff":body_diff,
                      "sex_age":sex_age, "carried_weight":carried,
                      "jockey":jockey, "finish":finish, "frame":frame,
                      "corner4":corner4,
                  })
              ded={r["number"]:r for r in rows}

              # Reuse the existing metadata extraction; only horse rows differ.
              p=TextParser(); p.feed(raw_html); text=p.text()
              dm=re.search(r"(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日",text)
              tm=re.search(r"発走時刻：?\s*(\d{1,2})時\s*(\d{2})分",text)
              dist=re.search(r"([\d,]+)メートル（(芝|ダート)・([^）]+)）",text)
              meet=re.search(r"(\d+)回([^\n|]+?)(\d+)日",text)
              rn=re.search(r"(\d{1,2})レース",text)
              meta={
                  "date": f"{dm.group(1)}-{int(dm.group(2)):02d}-{int(dm.group(3)):02d}" if dm else target_date_iso,
                  "time": f"{int(tm.group(1)):02d}:{tm.group(2)}" if tm else "",
                  "distance": int(dist.group(1).replace(",","")) if dist else None,
                  "surface": dist.group(2) if dist else "",
                  "course": dist.group(3) if dist else "",
                  "venue_text": meet.group(2).strip() if meet else "",
                  "meet_day": int(meet.group(3)) if meet else None,
                  "no": int(rn.group(1)) if rn else 0,
                  "name": "レース",
                  "going": "",
              }
              gm=re.search(r"(?:芝|ダート)[^\n|]{0,30}(良|稍重|重|不良)",text)
              if gm:
                  meta["going"]=gm.group(1)
              return meta, sorted(ded.values(), key=lambda x:x["number"])

          # ------------------------------------------------------------
          # Fetch all races
          # ------------------------------------------------------------
          races = []
          failures = []

          for (vcode, race_no), token in sorted(unique.items(), key=lambda x: (x[0][0], x[0][1])):
              url = f"{ACCESS}?CNAME={urllib.parse.quote(token, safe='')}"
              try:
                  if historical_mode:
                      # Historical result tokens are most reliable through
                      # POST(cname=...), as used by the verified parser.
                      data = urllib.parse.urlencode({"cname": token}).encode("ascii")
                      raw_html = decode_jra(request_bytes(ACCESS_S, "POST", data, ACCESS_S))
                      title_m = re.search(r"<title[^>]*>(.*?)</title>", raw_html, re.I | re.S)
                      title = re.sub(r"\s+", " ", htmlmod.unescape(title_m.group(1))).strip()[:100] if title_m else ""
                      print("HIST FETCH", vcode, f"{race_no}R", "POST", "len=", len(raw_html), "title=", title)
                      if "パラメータエラー" in title or title.strip() == "エラー":
                          raw_html = get_html(url, ACCESS_S)
                          title_g = re.search(r"<title[^>]*>(.*?)</title>", raw_html, re.I | re.S)
                          title2 = re.sub(r"\s+", " ", htmlmod.unescape(title_g.group(1))).strip()[:100] if title_g else ""
                          print("HIST FETCH", vcode, f"{race_no}R", "GET", "len=", len(raw_html), "title=", title2)
                      meta, horses = parse_historical_result_page(raw_html, token)
                      if not horses:
                          # Diagnostic only: expose the actual table shape so a
                          # future JRA HTML change can be fixed from one run.
                          dbg = HistoricalCellParser(); dbg.feed(raw_html)
                          print("HIST PARSE DEBUG:", vcode, f"{race_no}R",
                                "tr_rows=", len(dbg.rows),
                                "rows_ge14=", sum(1 for rr in dbg.rows if len(rr) >= 14))
                          for rr in [x for x in dbg.rows if len(x) >= 3][:3]:
                              print("  CELLS SAMPLE:", [str(x)[:80] for x in rr[:14]])
                  else:
                      raw_html = get_html(url, ACCESS)
                      meta, horses = parse_race(raw_html, token)

                  if not horses:
                      raise RuntimeError("馬データを1頭も抽出できませんでした")

                  # Strong quality checks: every row must have correct identity fields.
                  bad = []
                  for h in horses:
                      if not h["name"]:
                          bad.append(f"{h['number']}:empty-name")
                      if not h["sex_age"]:
                          bad.append(f"{h['number']}:missing-sex-age")
                      if not h["jockey"]:
                          bad.append(f"{h['number']}:missing-jockey")
                      if not historical_mode and h["odds"] <= 0:
                          bad.append(f"{h['number']}:bad-odds")
                  if bad:
                      raise RuntimeError("品質チェックNG: " + ", ".join(bad[:8]))

                  races.append({
                      "venue": venue_names.get(vcode, vcode),
                      "venue_code": vcode,
                      "meet": meta["venue_text"],
                      "meet_day": meta["meet_day"],
                      "no": race_no,
                      "date": meta["date"],
                      "time": meta["time"],
                      "name": meta["name"],
                      "distance": meta["distance"],
                      "surface": meta["surface"],
                      "course": meta["course"],
                      "going": meta["going"],
                      "url": url,
                      "token": token,
                      "horses": horses,
                  })
                  print(
                      "OK",
                      venue_names.get(vcode, vcode),
                      f"{race_no}R",
                      "horses=",
                      len(horses),
                  )
              except Exception as e:
                  failures.append({
                      "venue_code": vcode,
                      "race": race_no,
                      "token": token,
                      "url": url,
                      "error": repr(e),
                  })
                  print("FAIL", vcode, race_no, repr(e))
              time.sleep(0.35)

          races.sort(key=lambda r: (r["venue_code"], r["no"]))

          # ------------------------------------------------------------
          # Final integrity checks
          # ------------------------------------------------------------
          expected = len(unique)
          print("EXPECTED RACES:", expected)
          print("SUCCESS RACES:", len(races))
          print("FAILURES:", len(failures))

          if failures:
              raise RuntimeError(
                  f"JRAレース取得失敗: {len(failures)}件。最初の失敗={failures[0]['error']}"
              )

          if len(races) != expected:
              raise RuntimeError(
                  f"取得レース数が一致しません: expected={expected}, actual={len(races)}"
              )

          # Normal JRA Sunday/Saturday pattern is usually 36 races, but do not
          # hard-code 36 because holidays/開催変更 can differ.
          for r in races:
              nums = [h["number"] for h in r["horses"]]
              if nums != sorted(set(nums)):
                  raise RuntimeError(f"馬番重複/順序異常: {r['venue']} {r['no']}R")

          venue_counts = {}
          for r in races:
              venue_counts[r["venue"]] = venue_counts.get(r["venue"], 0) + 1

          out = {
              "date": target_date_iso,
              "updated_at": now.isoformat(),
              "calendar_url": cal_url,
              "target_ymd": target_ymd,
              "official_race_links": [r["url"] for r in races],
              "races": races,
              "venue_counts": venue_counts,
              "source": "JRA公式 " + ("accessS (historical result)" if historical_mode else "accessD (entry)") ,
              "data_mode": "historical_result" if historical_mode else "entry",
              "parser_version": "13.0",
          }

          out_path = Path("data/jra_daily.json")
          out_path.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")

          # Historical data is cumulative. Keep jra_daily.json as the latest
          # fetched day, while merging historical result races into
          # jra_history.json. A race is uniquely identified by date, venue,
          # and race number, so re-running the same date is idempotent.
          if historical_mode:
              history_path = Path("data/jra_history.json")
              history = {}
              if history_path.exists():
                  try:
                      existing = json.loads(history_path.read_text(encoding="utf-8"))
                      for r in existing.get("races", []):
                          key = (r.get("date"), r.get("venue_code"), int(r.get("no", 0)))
                          if key[0] and key[1] and key[2]:
                              history[key] = r
                  except Exception as e:
                      raise RuntimeError(f"既存jra_history.jsonの読み込みに失敗しました: {e!r}")

              for r in races:
                  key = (r.get("date"), r.get("venue_code"), int(r.get("no", 0)))
                  history[key] = r

              merged_races = sorted(
                  history.values(),
                  key=lambda r: (r.get("date", ""), r.get("venue_code", ""), int(r.get("no", 0)))
              )
              history_out = {
                  "date": target_date_iso,
                  "updated_at": now.isoformat(),
                  "target_ymd": target_ymd,
                  "source": "JRA公式 accessS 過去レース結果（累積）",
                  "mode": "historical_result",
                  "races": merged_races,
                  "race_count": len(merged_races),
                  "parser_version": "13.5-cumulative-historical-v19-parser",
              }
              history_path.write_text(
                  json.dumps(history_out, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
              print("UPDATED:", history_path, "RACES:", len(merged_races))

          # GitHub Actions Summary
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as sf:
                  sf.write("## JRA data sync\n\n")
                  sf.write(f"- 対象日: **{target_date_iso}**\n")
                  sf.write(f"- レース数: **{len(races)}**\n")
                  sf.write(f"- 取得失敗: **{len(failures)}**\n")
                  sf.write("\n| 競馬場 | レース数 |\n|---|---:|\n")
                  for venue, count in sorted(venue_counts.items()):
                      sf.write(f"| {venue} | {count} |\n")
                  sf.write("\n### Horse data sample\n")
                  if races:
                      r0 = races[0]
                      for h in r0["horses"][:5]:
                          sf.write(
                              f"- {h['number']} {h['name']} / {h['odds']} / "
                              f"{h['sex_age']} / {h['carried_weight']}kg / {h['jockey']}\n"
                          )

          print("VENUE COUNTS:", json.dumps(venue_counts, ensure_ascii=False))
          print("WROTE:", out_path)
          PY

      - name: Commit synced JRA data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra_daily.json data/jra_history.json
          if git diff --cached --quiet; then
            echo "No JRA data changes to commit."
          else
            git commit -m "chore: sync JRA race data"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
