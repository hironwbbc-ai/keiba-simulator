name: JRA data sync and Pages deploy

on:
  push:
    branches:
      - main

  schedule:
    # JST 土曜・日曜 08:00
    - cron: "0 23 * * 5,6"

  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 YYYYMMDD（例：20260906）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # JRA data sync
      # ------------------------------------------------------------
      - name: Sync JRA official race pages
        shell: bash
        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}

        run: |

          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'

          import datetime
          import html
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar

          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo


          # ============================================================
          # 基本設定
          # ============================================================

          BASE = "https://www.jra.go.jp"
          ACCESS = BASE + "/JRADB/accessD.html"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(compatible; keiba-simulator-jra-sync/10.0)"
          )

          JST = ZoneInfo("Asia/Tokyo")


          # ============================================================
          # 対象日
          # ============================================================

          now = datetime.datetime.now(JST)

          requested_date = os.environ.get(
              "RACE_DATE_INPUT",
              ""
          ).strip()

          if requested_date:

              if not re.fullmatch(
                  r"\d{8}",
                  requested_date
              ):
                  raise RuntimeError(
                      "race_date は YYYYMMDD 形式で指定してください"
                  )

              target_ymd = requested_date

          else:

              target_ymd = now.strftime("%Y%m%d")


          target_date = datetime.datetime.strptime(
              target_ymd,
              "%Y%m%d"
          ).date()

          target_iso = target_date.isoformat()

          print("")
          print("=" * 70)
          print("JRA DATA SYNC")
          print("=" * 70)
          print("TARGET DATE:", target_ymd)
          print("TARGET ISO :", target_iso)
          print("=" * 70)
          print("")


          # ============================================================
          # HTTPセッション
          # ============================================================

          cookie_jar = http.cookiejar.CookieJar()

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar)
          )


          def request_bytes(
              url,
              method="GET",
              data=None,
              referer=None
          ):

              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept-Language": "ja,en;q=0.8",
                  "Accept": (
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8"
                  ),
              }

              if referer:
                  headers["Referer"] = referer

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              with opener.open(
                  req,
                  timeout=60
              ) as response:

                  return response.read()


          # ============================================================
          # JRAの文字コード処理
          #
          # JRAページはShift_JIS系。
          # response.apparent_encodingは使用しない。
          # ============================================================

          def decode_jra(raw):

              for encoding in (
                  "cp932",
                  "shift_jis",
                  "utf-8"
              ):

                  try:

                      text = raw.decode(encoding)

                      if (
                          "<html" in text.lower()
                          or "JRADB" in text
                      ):
                          return text

                  except UnicodeDecodeError:
                      continue

              return raw.decode(
                  "cp932",
                  errors="replace"
              )


          def get_html(
              url,
              referer=None
          ):

              raw = request_bytes(
                  url,
                  method="GET",
                  referer=referer
              )

              return decode_jra(raw)


          def post_cname(
              token,
              referer=None
          ):

              body = urllib.parse.urlencode({
                  "cname": token
              }).encode("ascii")

              raw = request_bytes(
                  ACCESS,
                  method="POST",
                  data=body,
                  referer=referer
              )

              return decode_jra(raw)


          # ============================================================
          # JRA race token
          #
          # 例：
          #
          # pw01dde0101202602060120260906/6A
          #
          # pw01dde
          # + 22文字
          # + /XX
          # ============================================================

          TOKEN_SCAN = re.compile(
              r"pw01dde"
              r"[0-9A-Za-z]{22}"
              r"(?:/|%2F)"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          TOKEN_EXACT = re.compile(
              r"^pw01dde"
              r"(?P<prefix>[0-9A-Za-z]{2})"
              r"(?P<venue>[0-9]{2})"
              r"(?P<year>[0-9]{4})"
              r"(?P<meetday>[0-9]{4})"
              r"(?P<race>[0-9]{2})"
              r"(?P<date>[0-9]{8})"
              r"/"
              r"(?P<hex>[0-9A-Fa-f]{2})"
              r"$",
              re.I
          )


          def normalize_token(token):

              token = html.unescape(
                  token
              ).strip()

              token = urllib.parse.unquote(
                  token
              )

              return token


          def find_tokens(text):

              text = html.unescape(text)

              results = []

              for token in TOKEN_SCAN.findall(text):

                  token = normalize_token(
                      token
                  )

                  if token not in results:

                      results.append(token)

              return results


          def is_target_token(token):

              match = TOKEN_EXACT.fullmatch(
                  token
              )

              if not match:
                  return False

              return (
                  match.group("date")
                  == target_ymd
              )


          # ============================================================
          # カレンダー
          # ============================================================

          year = target_date.year
          month = target_date.month
          day = target_date.day

          calendar_url = (
              f"{BASE}/keiba/calendar"
              f"{year}/{year}/{month}/{month:02d}{day:02d}.html"
          )

          print("CALENDAR URL:")
          print(calendar_url)
          print("")


          # ============================================================
          # カレンダー取得
          # ============================================================

          try:

              calendar_html = get_html(
                  calendar_url
              )

          except Exception as e:

              raise RuntimeError(
                  f"JRAカレンダー取得失敗: {e}"
              )


          calendar_tokens = find_tokens(
              calendar_html
          )

          print(
              "CALENDAR TOKENS:",
              len(calendar_tokens)
          )


          # ============================================================
          # 対象レーストークン探索
          #
          # カレンダー → accessD → race page
          #
          # という順番で広く探索する。
          # ============================================================

          target_tokens = set()
          visited_tokens = set()


          def collect_target_tokens(
              text,
              source
          ):

              found = find_tokens(
                  text
              )

              before = len(
                  target_tokens
              )

              for token in found:

                  if is_target_token(
                      token
                  ):
                      target_tokens.add(
                          token
                      )

              after = len(
                  target_tokens
              )

              print(
                  f"{source}: "
                  f"found={len(found)} "
                  f"target_total={after}"
              )


          # カレンダー自身
          collect_target_tokens(
              calendar_html,
              "CALENDAR"
          )


          # ------------------------------------------------------------
          # カレンダーから見つかったtokenを探索
          # ------------------------------------------------------------

          candidates = list(
              calendar_tokens
          )

          candidates.sort(
              key=lambda x: (
                  is_target_token(x),
                  x
              )
          )


          # 最大50ページまで探索
          for token in candidates[:50]:

              if token in visited_tokens:
                  continue

              visited_tokens.add(
                  token
              )

              try:

                  page = post_cname(
                      token,
                      calendar_url
                  )

                  collect_target_tokens(
                      page,
                      f"POST {token}"
                  )

                  time.sleep(
                      0.4
                  )

              except Exception as e:

                  print(
                      "NAVIGATION WARNING:",
                      token,
                      repr(e)
                  )


              if len(target_tokens) >= 36:
                  break


          # ============================================================
          # それでも足りない場合
          #
          # 見つかったレースページからさらに探索
          # ============================================================

          second_level = list(
              target_tokens
          )

          for token in second_level:

              if len(target_tokens) >= 36:
                  break

              try:

                  url = (
                      ACCESS
                      + "?CNAME="
                      + urllib.parse.quote(
                          token,
                          safe=""
                      )
                  )

                  page = get_html(
                      url,
                      ACCESS
                  )

                  collect_target_tokens(
                      page,
                      f"GET {token}"
                  )

                  time.sleep(
                      0.3
                  )

              except Exception as e:

                  print(
                      "SECOND LEVEL WARNING:",
                      token,
                      repr(e)
                  )


          # ============================================================
          # tokenを構造解析
          # ============================================================

          races_by_key = {}


          for token in target_tokens:

              match = TOKEN_EXACT.fullmatch(
                  token
              )

              if not match:
                  continue

              if (
                  match.group("date")
                  != target_ymd
              ):
                  continue

              venue_code = match.group(
                  "venue"
              )

              race_number = int(
                  match.group("race")
              )

              key = (
                  venue_code,
                  race_number
              )

              races_by_key[key] = token


          print("")
          print("=" * 70)
          print(
              "TARGET RACE TOKENS:",
              len(races_by_key)
          )
          print("=" * 70)


          for key, token in sorted(
              races_by_key.items()
          ):

              print(
                  key,
                  token
              )


          print("")


          if not races_by_key:

              raise RuntimeError(
                  f"{target_ymd} のJRAレースURLを"
                  "1件も発見できませんでした。"
              )


          # ============================================================
          # HTML class判定
          #
          # 重要：
          # 以前のclass regexでは
          #
          # class="num"
          #
          # を正しく拾えないケースがあったため、
          # \b を使ったclass判定にする。
          # ============================================================

          def class_attr(class_name):

              return (
                  r'class\s*=\s*["\'][^"\']*'
                  r'\b'
                  + re.escape(class_name)
                  + r'\b'
                  r'[^"\']*["\']'
              )


          TR_RE = re.compile(
              r"<tr\b[^>]*>.*?</tr>",
              re.I | re.S
          )


          def clean_text(value):

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = html.unescape(
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def first_match(
              pattern,
              text
          ):

              match = re.search(
                  pattern,
                  text,
                  re.I | re.S
              )

              if not match:
                  return None

              return match.group(1).strip()


          # ============================================================
          # 1頭分のHTML rowを解析
          # ============================================================

          def parse_horse_row(
              row_html
          ):

              # --------------------------------------------------------
              # 馬番
              # --------------------------------------------------------

              number_raw = first_match(
                  rf"<td[^>]*"
                  rf"{class_attr('num')}"
                  rf"[^>]*>"
                  rf"\s*(\d{{1,2}})",
                  row_html
              )

              if not number_raw:
                  return None

              number = int(
                  number_raw
              )


              if not (
                  1 <= number <= 18
              ):
                  return None


              # --------------------------------------------------------
              # 馬名
              # --------------------------------------------------------

              name = first_match(
                  rf"<div[^>]*"
                  rf"{class_attr('name')}"
                  rf"[^>]*>"
                  rf"\s*(?:<a[^>]*>)?"
                  rf"(.*?)"
                  rf"(?:</a>)?"
                  rf"\s*</div>",
                  row_html
              )


              if not name:
                  return None


              name = clean_text(
                  name
              )


              # --------------------------------------------------------
              # オッズ
              # --------------------------------------------------------

              odds_raw = first_match(
                  rf"{class_attr('odds')}"
                  rf"[^>]*>.*?"
                  rf"<strong[^>]*>"
                  rf"\s*"
                  rf"([0-9]+(?:\.[0-9]+)?)"
                  rf"\s*</strong>",
                  row_html
              )


              if not odds_raw:

                  odds_raw = first_match(
                      r"<strong[^>]*>"
                      r"\s*"
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"\s*</strong>",
                      row_html
                  )


              if not odds_raw:
                  return None


              odds = float(
                  odds_raw
              )


              # --------------------------------------------------------
              # 人気
              # --------------------------------------------------------

              popularity_raw = first_match(
                  r"\("
                  r"\s*(\d+)"
                  r"\s*<span[^>]*>"
                  r"\s*番人気"
                  r"\s*</span>"
                  r"\s*\)",
                  row_html
              )


              popularity = (
                  int(popularity_raw)
                  if popularity_raw
                  else None
              )


              # --------------------------------------------------------
              # 馬体重
              # --------------------------------------------------------

              weight_raw = first_match(
                  rf"{class_attr('weight')}"
                  rf"[^>]*>"
                  rf"\s*(\d{{3}})\s*kg",
                  row_html
              )


              if not weight_raw:
                  return None


              body_weight = int(
                  weight_raw
              )


              # --------------------------------------------------------
              # 馬体重増減
              # --------------------------------------------------------

              weight_diff_raw = first_match(
                  rf"{class_attr('weight')}"
                  rf"[^>]*>.*?"
                  rf"{class_attr('transition')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"([+-]?\d+)"
                  rf"\s*"
                  rf"</span>",
                  row_html
              )


              if weight_diff_raw:

                  body_weight_diff = int(
                      weight_diff_raw
                  )

              else:

                  body_weight_diff = None


              # --------------------------------------------------------
              # 性齢
              # --------------------------------------------------------

              sex_age = first_match(
                  rf"<p[^>]*"
                  rf"{class_attr('age')}"
                  rf"[^>]*>"
                  rf"(.*?)"
                  rf"</p>",
                  row_html
              )


              sex_age = (
                  clean_text(sex_age)
                  if sex_age
                  else ""
              )


              # --------------------------------------------------------
              # 負担重量
              # --------------------------------------------------------

              carried_raw = first_match(
                  rf"<p[^>]*"
                  rf"{class_attr('weight')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"([0-9]+(?:\.[0-9]+)?)"
                  rf"\s*"
                  rf"<span[^>]*>\s*kg"
                  rf"\s*</span>"
                  rf"\s*</p>",
                  row_html
              )


              if carried_raw:

                  carried_weight = float(
                      carried_raw
                  )

              else:

                  carried_weight = None


              # --------------------------------------------------------
              # 騎手
              # --------------------------------------------------------

              jockey = first_match(
                  rf"<p[^>]*"
                  rf"{class_attr('jockey')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"(?:<a[^>]*>)?"
                  rf"(.*?)"
                  rf"(?:</a>)?"
                  rf"\s*</p>",
                  row_html
              )


              jockey = (
                  clean_text(jockey)
                  if jockey
                  else ""
              )


              # --------------------------------------------------------
              # データ
              # --------------------------------------------------------

              return {

                  "number":
                      number,

                  "name":
                      name,

                  "odds":
                      odds,

                  "popularity":
                      popularity,

                  "body_weight":
                      body_weight,

                  "body_weight_diff":
                      body_weight_diff,

                  "sex_age":
                      sex_age,

                  "carried_weight":
                      carried_weight,

                  "jockey":
                      jockey,
              }


          # ============================================================
          # テキスト抽出
          # ============================================================

          class TextParser(
              HTMLParser
          ):

              def __init__(self):

                  super().__init__(
                      convert_charrefs=True
                  )

                  self.parts = []


              def handle_data(
                  self,
                  data
              ):

                  text = data.strip()

                  if text:
                      self.parts.append(
                          text
                      )


              def get_text(
                  self
              ):

                  return "\n".join(
                      self.parts
                  )


          # ============================================================
          # 競馬場コード
          # ============================================================

          VENUES = {

              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉",

          }


          # ============================================================
          # レース解析
          # ============================================================

          def parse_race(
              raw_html,
              token
          ):

              horses = []


              # --------------------------------------------------------
              # <tr>単位で馬を抽出
              # --------------------------------------------------------

              for row in TR_RE.findall(
                  raw_html
              ):

                  horse = parse_horse_row(
                      row
                  )

                  if horse:

                      horses.append(
                          horse
                      )


              # --------------------------------------------------------
              # 馬番で重複除去
              # --------------------------------------------------------

              unique_horses = {}


              for horse in horses:

                  unique_horses[
                      horse["number"]
                  ] = horse


              horses = [
                  unique_horses[number]
                  for number in sorted(
                      unique_horses
                  )
              ]


              # --------------------------------------------------------
              # テキストからレース情報
              # --------------------------------------------------------

              parser = TextParser()

              parser.feed(
                  raw_html
              )

              text = parser.get_text()


              # 日付
              date_match = re.search(
                  r"(\d{4})年\s*"
                  r"(\d{1,2})月\s*"
                  r"(\d{1,2})日",
                  text
              )


              # 発走時刻
              time_match = re.search(
                  r"発走時刻[:：]?\s*"
                  r"(\d{1,2})時\s*"
                  r"(\d{2})分",
                  text
              )


              # 距離・芝ダート
              distance_match = re.search(
                  r"([\d,]+)"
                  r"メートル"
                  r"（"
                  r"(芝|ダート)"
                  r"・"
                  r"([^）]+)"
                  r"）",
                  text
              )


              # レース名
              race_name = "レース"


              for line in text.splitlines():

                  line = line.strip()

                  if (
                      "レース" in line
                      and len(line) < 120
                  ):

                      race_name = line
                      break


              # token解析
              token_match = TOKEN_EXACT.fullmatch(
                  token
              )


              venue_code = (
                  token_match.group("venue")
                  if token_match
                  else ""
              )


              race_number = int(
                  token_match.group("race")
              )


              # --------------------------------------------------------
              # メタデータ
              # --------------------------------------------------------

              race_date = target_iso


              if date_match:

                  race_date = (
                      f"{date_match.group(1)}-"
                      f"{int(date_match.group(2)):02d}-"
                      f"{int(date_match.group(3)):02d}"
                  )


              race_time = ""


              if time_match:

                  race_time = (
                      f"{int(time_match.group(1)):02d}:"
                      f"{time_match.group(2)}"
                  )


              distance = None
              surface = ""
              course = ""


              if distance_match:

                  distance = int(
                      distance_match.group(1)
                      .replace(",", "")
                  )

                  surface = (
                      distance_match.group(2)
                  )

                  course = (
                      distance_match.group(3)
                  )


              # 馬がいない場合はエラー
              if not horses:

                  raise RuntimeError(
                      "馬データを1頭も抽出できませんでした"
                  )


              return {

                  "venue":
                      VENUES.get(
                          venue_code,
                          venue_code
                      ),

                  "venue_code":
                      venue_code,

                  "no":
                      race_number,

                  "date":
                      race_date,

                  "time":
                      race_time,

                  "name":
                      race_name,

                  "distance":
                      distance,

                  "surface":
                      surface,

                  "course":
                      course,

                  "horses":
                      horses,

              }


          # ============================================================
          # 全レース取得
          # ============================================================

          races = []
          failures = []


          sorted_races = sorted(
              races_by_key.items(),
              key=lambda item: (
                  item[0][0],
                  item[0][1]
              )
          )


          print("")
          print("=" * 70)
          print("START FETCH RACES")
          print("=" * 70)
          print("")


          for (
              (venue_code, race_number),
              token
          ) in sorted_races:

              url = (
                  ACCESS
                  + "?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )


              print(
                  f"FETCH "
                  f"{VENUES.get(venue_code, venue_code)} "
                  f"{race_number}R"
              )


              try:

                  raw_html = get_html(
                      url,
                      ACCESS
                  )


                  race = parse_race(
                      raw_html,
                      token
                  )


                  horses = race["horses"]


                  # ----------------------------------------------------
                  # 品質チェック
                  # ----------------------------------------------------

                  quality_errors = []


                  for horse in horses:

                      if not horse["name"]:
                          quality_errors.append(
                              f'{horse["number"]}:馬名なし'
                          )

                      if (
                          horse["odds"] is None
                          or horse["odds"] <= 0
                      ):
                          quality_errors.append(
                              f'{horse["number"]}:オッズ異常'
                          )

                      if not horse["sex_age"]:
                          quality_errors.append(
                              f'{horse["number"]}:性齢なし'
                          )

                      if (
                          horse["carried_weight"]
                          is None
                      ):
                          quality_errors.append(
                              f'{horse["number"]}:斤量なし'
                          )

                      if not horse["jockey"]:
                          quality_errors.append(
                              f'{horse["number"]}:騎手なし'
                          )


                  if quality_errors:

                      raise RuntimeError(
                          "品質チェックNG: "
                          + ", ".join(
                              quality_errors[:10]
                          )
                      )


                  # ----------------------------------------------------
                  # race data
                  # ----------------------------------------------------

                  races.append({

                      "venue":
                          race["venue"],

                      "venue_code":
                          race["venue_code"],

                      "no":
                          race["no"],

                      "date":
                          race["date"],

                      "time":
                          race["time"],

                      "name":
                          race["name"],

                      "distance":
                          race["distance"],

                      "surface":
                          race["surface"],

                      "course":
                          race["course"],

                      "going":
                          "",

                      "url":
                          url,

                      "token":
                          token,

                      "horses":
                          horses,

                  })


                  print(
                      "  OK",
                      race["venue"],
                      f"{race_number}R",
                      f"horses={len(horses)}"
                  )


              except Exception as e:

                  failures.append({

                      "venue_code":
                          venue_code,

                      "venue":
                          VENUES.get(
                              venue_code,
                              venue_code
                          ),

                      "race":
                          race_number,

                      "token":
                          token,

                      "url":
                          url,

                      "error":
                          repr(e),

                  })


                  print(
                      "  FAIL",
                      VENUES.get(
                          venue_code,
                          venue_code
                      ),
                      f"{race_number}R",
                      repr(e)
                  )


              time.sleep(
                  0.4
              )


          # ============================================================
          # 最終チェック
          # ============================================================

          races.sort(
              key=lambda race: (
                  race["venue_code"],
                  race["no"]
              )
          )


          print("")
          print("=" * 70)
          print("FINAL RESULT")
          print("=" * 70)

          print(
              "EXPECTED:",
              len(races_by_key)
          )

          print(
              "SUCCESS:",
              len(races)
          )

          print(
              "FAILURES:",
              len(failures)
          )


          if failures:

              print("")
              print("FAILURE DETAILS")

              for failure in failures:

                  print(
                      failure["venue"],
                      f'{failure["race"]}R',
                      failure["error"]
                  )

              raise RuntimeError(
                  f"JRAレース取得失敗: "
                  f"{len(failures)}件"
              )


          if len(races) != len(
              races_by_key
          ):

              raise RuntimeError(
                  "取得レース数と発見レース数が一致しません"
              )


          # ============================================================
          # 馬番チェック
          # ============================================================

          for race in races:

              numbers = [
                  horse["number"]
                  for horse in race["horses"]
              ]


              if numbers != sorted(
                  set(numbers)
              ):

                  raise RuntimeError(
                      "馬番重複/順序異常: "
                      f'{race["venue"]} '
                      f'{race["no"]}R'
                  )


          # ============================================================
          # 競馬場別集計
          # ============================================================

          venue_counts = {}


          for race in races:

              venue = race["venue"]

              venue_counts[venue] = (
                  venue_counts.get(
                      venue,
                      0
                  ) + 1
              )


          # ============================================================
          # JSON保存
          # ============================================================

          output = {

              "date":
                  target_iso,

              "target_ymd":
                  target_ymd,

              "updated_at":
                  now.isoformat(),

              "calendar_url":
                  calendar_url,

              "source":
                  "JRA公式 accessD",

              "parser_version":
                  "10.0",

              "race_count":
                  len(races),

              "venue_counts":
                  venue_counts,

              "official_race_links":
                  [
                      race["url"]
                      for race in races
                  ],

              "races":
                  races,

          }


          output_path = Path(
              "data/jra_daily.json"
          )


          output_path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ============================================================
          # GitHub Actions Summary
          # ============================================================

          summary_path = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )


          if summary_path:

              with open(
                  summary_path,
                  "a",
                  encoding="utf-8"
              ) as summary:

                  summary.write(
                      "## JRA DATA SYNC\n\n"
                  )

                  summary.write(
                      f"- 対象日: **{target_iso}**\n"
                  )

                  summary.write(
                      f"- レース数: **{len(races)}**\n"
                  )

                  summary.write(
                      f"- 失敗: **{len(failures)}**\n\n"
                  )


                  summary.write(
                      "| 競馬場 | レース数 |\n"
                  )

                  summary.write(
                      "|---|---:|\n"
                  )


                  for venue, count in sorted(
                      venue_counts.items()
                  ):

                      summary.write(
                          f"| {venue} | {count} |\n"
                      )


                  summary.write(
                      "\n### 馬データ確認\n\n"
                  )


                  if races:

                      sample_race = races[0]

                      for horse in sample_race[
                          "horses"
                      ][:5]:

                          summary.write(
                              f"- "
                              f"{horse['number']} "
                              f"{horse['name']} / "
                              f"odds={horse['odds']} / "
                              f"{horse['sex_age']} / "
                              f"{horse['carried_weight']}kg / "
                              f"{horse['jockey']}\n"
                          )


          # ============================================================
          # 最終表示
          # ============================================================

          print("")
          print("=" * 70)
          print("SUCCESS")
          print("=" * 70)

          print(
              "DATE:",
              target_iso
          )

          print(
              "RACES:",
              len(races)
          )

          print(
              "VENUES:",
              json.dumps(
                  venue_counts,
                  ensure_ascii=False
              )
          )

          print(
              "OUTPUT:",
              output_path
          )

          print("")


          PY


      # ------------------------------------------------------------
      # JSONをcommit
      # ------------------------------------------------------------

      - name: Commit synced JRA data
        shell: bash

        run: |

          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jra_daily.json

          if git diff --cached --quiet; then

            echo "No JRA data changes."

          else

            git commit \
              -m "chore: sync JRA race data"

            git push

          fi


      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: "."


      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4
