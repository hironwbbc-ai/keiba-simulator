name: JRA connection diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. GitHub Actions が起動するか
      # ==========================================

      - name: STEP 1 - Basic test
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "STEP 1 - BASIC TEST"
          echo "======================================"

          echo "Runner:"
          uname -a

          echo "Python:"
          python3 --version

          echo "Working directory:"
          pwd

          echo "Files:"
          ls -la

          echo "STEP 1 SUCCESS"


      # ==========================================
      # 2. Pythonが正常に動くか
      # ==========================================

      - name: STEP 2 - Python test
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "STEP 2 - PYTHON TEST"
          echo "======================================"

          python3 - <<'PY'

          print("Python execution started")

          import sys
          import urllib.request
          import urllib.parse
          import re
          import json
          import datetime

          print("Python version:")
          print(sys.version)

          print("Required modules imported successfully")

          PY

          echo "STEP 2 SUCCESS"


      # ==========================================
      # 3. JRAのトップページに接続
      # ==========================================

      - name: STEP 3 - JRA connection test
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "STEP 3 - JRA CONNECTION TEST"
          echo "======================================"

          python3 - <<'PY'

          import urllib.request

          url = "https://www.jra.go.jp/"

          print("Target URL:")
          print(url)

          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
          }

          print("Creating request...")

          req = urllib.request.Request(
              url,
              headers=headers,
              method="GET"
          )

          print("Sending request...")

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  raw = response.read()

                  print("HTTP STATUS:")
                  print(response.status)

                  print("CONTENT LENGTH:")
                  print(len(raw))

                  print("CONTENT TYPE:")
                  print(
                      response.headers.get(
                          "Content-Type"
                      )
                  )

                  print("JRA CONNECTION SUCCESS")

          except Exception as e:

              print()
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print("JRA CONNECTION FAILED")
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print(
                  type(e).__name__
              )
              print(
                  repr(e)
              )

              raise

          PY

          echo "STEP 3 SUCCESS"


      # ==========================================
      # 4. JRAカレンダーに接続
      # ==========================================

      - name: STEP 4 - JRA calendar test
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "STEP 4 - JRA CALENDAR TEST"
          echo "======================================"

          python3 - <<'PY'

          import urllib.request
          import datetime

          from zoneinfo import ZoneInfo


          now = datetime.datetime.now(
              ZoneInfo("Asia/Tokyo")
          )

          year = now.strftime("%Y")
          month = int(
              now.strftime("%m")
          )
          day = now.strftime("%d")

          url = (
              f"https://www.jra.go.jp/"
              f"keiba/calendar{year}/"
              f"{year}/{month}/"
              f"{month:02d}{day}.html"
          )

          print("Current JST:")
          print(now)

          print()
          print("Calendar URL:")
          print(url)

          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36",
              "Accept-Language":
                  "ja,en;q=0.8",
          }

          req = urllib.request.Request(
              url,
              headers=headers,
              method="GET"
          )

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  raw = response.read()

                  print()
                  print("HTTP STATUS:")
                  print(response.status)

                  print()
                  print("CONTENT LENGTH:")
                  print(len(raw))

                  print()
                  print("CONTENT TYPE:")
                  print(
                      response.headers.get(
                          "Content-Type"
                      )
                  )

                  # UTF-8 / CP932を試す
                  text = None

                  for encoding in (
                      "utf-8",
                      "cp932",
                      "shift_jis"
                  ):

                      try:

                          candidate = raw.decode(
                              encoding
                          )

                          if (
                              "競馬" in candidate
                              or "JRA" in candidate
                              or "出馬表" in candidate
                          ):

                              text = candidate
                              print(
                                  "DECODE:",
                                  encoding
                              )
                              break

                      except Exception:
                          pass

                  if text is None:

                      text = raw.decode(
                          "utf-8",
                          "ignore"
                      )

                  print()
                  print("TEXT LENGTH:")
                  print(len(text))

                  print()
                  print("JRA KEYWORDS:")

                  for keyword in (
                      "出馬表",
                      "競馬",
                      "中山",
                      "阪神",
                      "札幌",
                      "JRA",
                      "race",
                  ):

                      print(
                          keyword,
                          ":",
                          keyword in text
                      )

                  print()
                  print("FIRST 3000 CHARACTERS")
                  print("--------------------------------------")

                  print(
                      text[:3000]
                  )

                  print("--------------------------------------")

                  print()
                  print(
                      "STEP 4 JRA CALENDAR SUCCESS"
                  )

          except Exception as e:

              print()
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print("JRA CALENDAR FAILED")
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")

              print(
                  type(e).__name__
              )

              print(
                  repr(e)
              )

              raise

          PY

          echo "STEP 4 SUCCESS"


      # ==========================================
      # 5. JRA accessD POST テスト
      # ==========================================

      - name: STEP 5 - JRA accessD POST test
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo "STEP 5 - JRA ACCESSD POST TEST"
          echo "======================================"

          python3 - <<'PY'

          import urllib.request
          import urllib.parse
          import http.cookiejar


          BASE = (
              "https://www.jra.go.jp"
          )

          ACCESS = (
              BASE +
              "/JRADB/accessD.html"
          )

          TOKEN = (
              "pw01dli00/F3"
          )


          print("ACCESS URL:")
          print(ACCESS)

          print()
          print("TOKEN:")
          print(TOKEN)


          cookie_jar = (
              http.cookiejar.CookieJar()
          )

          opener = (
              urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(
                      cookie_jar
                  )
              )
          )


          data = urllib.parse.urlencode({
              "cname": TOKEN
          }).encode()


          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36",

              "Accept-Language":
                  "ja,en;q=0.8",

              "Accept":
                  "text/html,"
                  "application/xhtml+xml,"
                  "application/xml;q=0.9,"
                  "*/*;q=0.8",

              "Content-Type":
                  "application/x-www-form-urlencoded",
          }


          req = urllib.request.Request(
              ACCESS,
              data=data,
              headers=headers,
              method="POST"
          )


          try:

              print()
              print("Sending POST...")

              with opener.open(
                  req,
                  timeout=40
              ) as response:

                  raw = response.read()

                  print()
                  print("HTTP STATUS:")
                  print(response.status)

                  print()
                  print("CONTENT LENGTH:")
                  print(len(raw))

                  print()
                  print("CONTENT TYPE:")
                  print(
                      response.headers.get(
                          "Content-Type"
                      )
                  )


                  text = None

                  for encoding in (
                      "utf-8",
                      "cp932",
                      "shift_jis"
                  ):

                      try:

                          candidate = raw.decode(
                              encoding
                          )

                          if (
                              "出馬表" in candidate
                              or "競馬" in candidate
                              or "JRA" in candidate
                          ):

                              text = candidate

                              print(
                                  "DECODE:",
                                  encoding
                              )

                              break

                      except Exception:
                          pass


                  if text is None:

                      text = raw.decode(
                          "utf-8",
                          "ignore"
                      )


                  print()
                  print("TEXT LENGTH:")
                  print(len(text))


                  print()
                  print("IMPORTANT KEYWORDS:")

                  for keyword in (
                      "出馬表",
                      "札幌",
                      "中山",
                      "阪神",
                      "1R",
                      "2R",
                      "3R",
                      "馬名",
                      "騎手",
                      "オッズ",
                      "doAction",
                      "accessD",
                  ):

                      print(
                          keyword,
                          ":",
                          keyword in text
                      )


                  print()
                  print(
                      "ACCESSD RESPONSE "
                      "FIRST 5000 CHARACTERS"
                  )

                  print(
                      "--------------------------------------"
                  )

                  print(
                      text[:5000]
                  )

                  print(
                      "--------------------------------------"
                  )


                  print()
                  print(
                      "STEP 5 ACCESSD POST SUCCESS"
                  )


          except Exception as e:

              print()
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
              print("ACCESSD POST FAILED")
              print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")

              print(
                  type(e).__name__
              )

              print(
                  repr(e)
              )

              raise

          PY

          echo "STEP 5 SUCCESS"


      # ==========================================
      # 終了
      # ==========================================

      - name: Diagnostic completed
        shell: bash
        run: |

          echo "======================================"
          echo "ALL DIAGNOSTIC STEPS SUCCESS"
          echo "======================================"
