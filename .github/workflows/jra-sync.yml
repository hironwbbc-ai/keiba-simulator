name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/15 0-8 * * 6,0"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  sync-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Setup Pages
      # ==========================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ==========================================================
      # JRA DATA SYNC
      # ==========================================================

      - name: Sync JRA official race data
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'

          import datetime
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar

          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo


          # ==========================================================
          # SETTINGS
          # ==========================================================

          JRA_BASE = "https://www.jra.go.jp"

          JRA_ACCESS = (
              JRA_BASE +
              "/JRADB/accessD.html"
          )

          APP_BASE = "https://app.jra.jp"

          USER_AGENT = (
              "Mozilla/5.0 "
              "(X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/140.0 Safari/537.36"
          )


          # ==========================================================
          # HTTP
          # ==========================================================

          cookie_jar = (
              http.cookiejar.CookieJar()
          )

          opener = (
              urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(
                      cookie_jar
                  )
              )
          )


          def decode_response(raw):

              for enc in (
                  "utf-8",
                  "cp932",
                  "shift_jis"
              ):

                  try:

                      text = raw.decode(enc)

                      if (
                          "出馬表" in text
                          or "馬名" in text
                          or "競馬" in text
                          or "JRA" in text
                      ):

                          return text

                  except Exception:
                      pass

              return raw.decode(
                  "utf-8",
                  "ignore"
              )


          def http_get(
              url,
              referer=None
          ):

              headers = {

                  "User-Agent":
                      USER_AGENT,

                  "Accept-Language":
                      "ja,en;q=0.8",

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8",

              }

              if referer:

                  headers["Referer"] = (
                      referer
                  )

              request = (
                  urllib.request.Request(
                      url,
                      headers=headers,
                      method="GET"
                  )
              )

              with opener.open(
                  request,
                  timeout=40
              ) as response:

                  raw = response.read()

                  return decode_response(
                      raw
                  )


          def http_post(
              token,
              referer=None
          ):

              data = (
                  urllib.parse.urlencode(
                      {
                          "cname": token
                      }
                  ).encode()
              )

              headers = {

                  "User-Agent":
                      USER_AGENT,

                  "Accept-Language":
                      "ja,en;q=0.8",

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8",

                  "Content-Type":
                      "application/x-www-form-urlencoded",

              }

              if referer:

                  headers["Referer"] = (
                      referer
                  )

              request = (
                  urllib.request.Request(
                      JRA_ACCESS,
                      data=data,
                      headers=headers,
                      method="POST"
                  )
              )

              with opener.open(
                  request,
                  timeout=40
              ) as response:

                  raw = response.read()

                  return decode_response(
                      raw
                  )


          # ==========================================================
          # DATE
          # ==========================================================

          now = datetime.datetime.now(
              ZoneInfo("Asia/Tokyo")
          )

          date = now.strftime(
              "%Y-%m-%d"
          )

          ymd = now.strftime(
              "%Y%m%d"
          )

          year = now.strftime(
              "%Y"
          )

          month = int(
              now.strftime("%m")
          )

          day = now.strftime(
              "%d"
          )


          print()
          print(
              "======================================"
          )
          print(
              "JRA SYNC START"
          )
          print(
              "DATE:",
              date
          )
          print(
              "======================================"
          )


          # ==========================================================
          # CALENDAR
          # ==========================================================

          calendar_url = (
              f"{JRA_BASE}/keiba/calendar{year}/"
              f"{year}/{month}/{month:02d}{day}.html"
          )

          print(
              "Calendar:",
              calendar_url
          )

          calendar_html = http_get(
              calendar_url
          )

          print(
              "Calendar HTML:",
              len(calendar_html)
          )


          # ==========================================================
          # TOKEN REGEX
          # ==========================================================

          PW_RACE_RE = re.compile(
              r"pw01dde"
              r"(?P<prefix>\d{2})"
              r"(?P<venue>\d{2})"
              r"(?P<year>\d{4})"
              r"(?P<meet>\d{4})"
              r"(?P<race>\d{2})"
              r"(?P<date>\d{8})"
              r"/(?P<hex>[0-9A-Fa-f]{2})",
              re.I
          )


          SW_RE = re.compile(
              r"sw01d[a-z0-9]+/"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          ACTION_RE = re.compile(
              r"doAction\s*\("
              r"\s*['\"]([^'\"]*accessD\.html)"
              r"['\"]\s*,\s*"
              r"['\"]([^'\"]+)['\"]",
              re.I
          )


          # ==========================================================
          # EXTRACT PW TOKENS
          # ==========================================================

          def extract_pw_tokens(
              html
          ):

              result = []

              for match in (
                  PW_RACE_RE.finditer(
                      html
                  )
              ):

                  token = (
                      match.group(0)
                  )

                  if token not in result:

                      result.append(
                          token
                      )

              return result


          def extract_navigation_tokens(
              html
          ):

              result = []

              for match in ACTION_RE.finditer(
                  html
              ):

                  token = (
                      match.group(2)
                      .strip()
                  )

                  if token not in result:

                      result.append(
                          token
                      )

              return result


          # ==========================================================
          # DISCOVER 36 PW RACE TOKENS
          # ==========================================================

          ENTRY_TOKEN = (
              "pw01dli00/F3"
          )

          queue = [
              ENTRY_TOKEN
          ]

          visited = set()

          race_tokens = []

          MAX_PAGES = 100


          while (
              queue
              and
              len(visited) < MAX_PAGES
          ):

              token = queue.pop(0)

              if token in visited:
                  continue

              visited.add(
                  token
              )

              print(
                  f"[DISCOVER {len(visited)}]",
                  token
              )

              try:

                  html = http_post(
                      token,
                      calendar_url
                  )

              except Exception as e:

                  print(
                      "DISCOVER ERROR:",
                      repr(e)
                  )

                  continue


              for race_token in (
                  extract_pw_tokens(
                      html
                  )
              ):

                  match = (
                      PW_RACE_RE.fullmatch(
                          race_token
                      )
                  )

                  if not match:
                      continue

                  if (
                      match.group("date")
                      != ymd
                  ):
                      continue

                  if race_token not in race_tokens:

                      race_tokens.append(
                          race_token
                      )


              for next_token in (
                  extract_navigation_tokens(
                      html
                  )
              ):

                  if (
                      next_token
                      in visited
                  ):
                      continue

                  if next_token.startswith(
                      "pw01d"
                  ):

                      queue.append(
                          next_token
                      )

              print(
                  "race tokens:",
                  len(race_tokens)
              )

              if len(race_tokens) >= 36:
                  break

              time.sleep(
                  0.25
              )


          race_tokens = list(
              dict.fromkeys(
                  race_tokens
              )
          )


          def race_sort_key(
              token
          ):

              m = (
                  PW_RACE_RE.fullmatch(
                      token
                  )
              )

              return (
                  m.group("venue"),
                  int(
                      m.group("race")
                  )
              )


          race_tokens.sort(
              key=race_sort_key
          )


          print()
          print(
              "======================================"
          )
          print(
              "PW RACE TOKENS:",
              len(race_tokens)
          )
          print(
              "======================================"
          )


          if len(race_tokens) != 36:

              raise RuntimeError(
                  "36レースを発見できませんでした: "
                  + str(
                      len(race_tokens)
                  )
              )


          # ==========================================================
          # VENUES
          # ==========================================================

          venue_names = {

              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉",

          }


          # ==========================================================
          # PW URL
          # ==========================================================

          def pw_url(
              token
          ):

              return (
                  JRA_ACCESS
                  + "?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )


          # ==========================================================
          # HTML LINK EXTRACTION
          # ==========================================================

          class LinkParser(
              HTMLParser
          ):

              def __init__(self):

                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(
                      attrs
                  )

                  href = attrs.get(
                      "href"
                  )

                  if href:

                      self.links.append(
                          href
                      )


          def find_sw_links(
              html
          ):

              result = []

              # ----------------------------------------------
              # Direct HTML text
              # ----------------------------------------------

              for match in SW_RE.finditer(
                  html
              ):

                  token = (
                      match.group(0)
                  )

                  if token not in result:

                      result.append(
                          token
                      )


              # ----------------------------------------------
              # href
              # ----------------------------------------------

              parser = LinkParser()

              try:

                  parser.feed(
                      html
                  )

              except Exception:
                  pass


              for href in (
                  parser.links
              ):

                  decoded = (
                      urllib.parse.unquote(
                          href
                      )
                  )

                  for match in (
                      SW_RE.finditer(
                          decoded
                      )
                  ):

                      token = (
                          match.group(0)
                      )

                      if token not in result:

                          result.append(
                              token
                          )


              return result


          # ==========================================================
          # SMARTPHONE URL
          # ==========================================================

          def sw_url(
              token
          ):

              return (
                  APP_BASE
                  + "/JRADB/accessD.html"
                  + "?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )


          # ==========================================================
          # EXTRACT SMARTPHONE TOKEN
          # ==========================================================

          def discover_sw_token(
              pw_token,
              pw_html
          ):

              sw_tokens = (
                  find_sw_links(
                      pw_html
                  )
              )

              if sw_tokens:

                  # 同じ日付・開催・レースに
                  # 近いものを優先
                  pw_match = (
                      PW_RACE_RE.fullmatch(
                          pw_token
                      )
                  )

                  if pw_match:

                      race_no = (
                          pw_match.group(
                              "race"
                          )
                      )

                      date_code = (
                          pw_match.group(
                              "date"
                          )
                      )

                      for sw_token in (
                          sw_tokens
                      ):

                          if (
                              race_no
                              in sw_token
                              and
                              date_code
                              in sw_token
                          ):

                              return sw_token

                  return sw_tokens[0]


              return None


          # ==========================================================
          # TEXT NORMALIZATION
          # ==========================================================

          class TextParser(
              HTMLParser
          ):

              def __init__(self):

                  super().__init__(
                      convert_charrefs=True
                  )

                  self.parts = []

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() in (
                      "br",
                      "tr",
                      "p",
                      "li",
                      "div",
                      "section",
                      "article",
                  ):

                      self.parts.append(
                          "\n"
                      )

              def handle_endtag(
                  self,
                  tag
              ):

                  if tag.lower() in (
                      "tr",
                      "p",
                      "li",
                      "div",
                      "section",
                      "article",
                  ):

                      self.parts.append(
                          "\n"
                      )

              def handle_data(
                  self,
                  data
              ):

                  self.parts.append(
                      data
                  )

              def text(
                  self
              ):

                  return "".join(
                      self.parts
                  )


          def html_text(
              html
          ):

              parser = TextParser()

              parser.feed(
                  html
              )

              text = parser.text()

              text = (
                  text
                  .replace(
                      "\r\n",
                      "\n"
                  )
                  .replace(
                      "\r",
                      "\n"
                  )
                  .replace(
                      "\u3000",
                      " "
                  )
                  .replace(
                      "\xa0",
                      " "
                  )
              )

              text = re.sub(
                  r"[ \t]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  text
              )

              return text.strip()


          # ==========================================================
          # HORSE PARSER
          # ==========================================================

          def parse_mobile_horses(
              html
          ):

              text = html_text(
                  html
              )

              horses = []

              seen = set()


              # ------------------------------------------------------
              # Primary pattern
              #
              # 1 Image: ... 馬名 | 騎手 57.0 18.4
              # ------------------------------------------------------

              pattern = re.compile(
                  r"(?m)"
                  r"^\s*"
                  r"(?P<no>1[0-8]|[1-9])"
                  r"(?:\s+|$)"
                  r"(?:Image:[^\n]*\s+)?"
                  r"(?P<name>[^|\n]{2,40}?)"
                  r"\s*\|\s*"
                  r"(?P<jockey>[^0-9\n|]{2,20}?)"
                  r"\s*"
                  r"(?P<weight>"
                  r"(?:\d{2}(?:\.\d+)?|"
                  r"[★☆▲△◇\s]*\d{2}(?:\.\d+)?)"
                  r")"
                  r"(?:\s+"
                  r"(?P<odds>\d+(?:\.\d+)?))?"
                  r"\s*$"
              )


              for match in pattern.finditer(
                  text
              ):

                  no = int(
                      match.group(
                          "no"
                      )
                  )

                  if no in seen:
                      continue

                  name = (
                      match.group(
                          "name"
                      )
                      .strip()
                  )

                  name = re.sub(
                      r"^Image:\s*",
                      "",
                      name
                  )

                  name = re.sub(
                      r"\s+",
                      "",
                      name
                  )

                  if not name:
                      continue

                  jockey = (
                      match.group(
                          "jockey"
                      )
                      .strip()
                  )

                  weight_raw = (
                      match.group(
                          "weight"
                      )
                  )

                  odds_raw = (
                      match.group(
                          "odds"
                      )
                  )


                  # --------------------------------------------------
                  # Weight
                  # --------------------------------------------------

                  weight_match = re.search(
                      r"(\d{2}(?:\.\d+)?)",
                      weight_raw
                  )

                  weight = None

                  if weight_match:

                      weight = float(
                          weight_match.group(
                              1
                          )
                      )


                  # --------------------------------------------------
                  # Odds
                  # --------------------------------------------------

                  odds = None

                  if odds_raw:

                      try:

                          odds = float(
                              odds_raw
                          )

                      except Exception:

                          odds = None


                  seen.add(
                      no
                  )

                  horses.append({

                      "number":
                          no,

                      "name":
                          name,

                      "jockey":
                          jockey,

                      "weight":
                          weight,

                      "odds":
                          odds,

                  })


              # ------------------------------------------------------
              # Secondary pattern
              #
              # Some JRA responses use:
              #
              # 1 馬名 | 騎手 57.0
              #
              # without the odds.
              # ------------------------------------------------------

              if not horses:

                  pattern2 = re.compile(
                      r"(?m)"
                      r"^\s*"
                      r"(?P<no>1[0-8]|[1-9])"
                      r"\s+"
                      r"(?P<name>[^|\n]{2,40})"
                      r"\s*\|\s*"
                      r"(?P<jockey>[^0-9\n|]{2,20})"
                      r"\s*"
                      r"(?P<weight>\d{2}(?:\.\d+)?)"
                  )


                  for match in (
                      pattern2.finditer(
                          text
                      )
                  ):

                      no = int(
                          match.group(
                              "no"
                          )
                      )

                      if no in seen:
                          continue

                      name = re.sub(
                          r"\s+",
                          "",
                          match.group(
                              "name"
                          )
                      )

                      if not name:
                          continue

                      jockey = (
                          match.group(
                              "jockey"
                          ).strip()
                      )

                      weight = float(
                          match.group(
                              "weight"
                          )
                      )

                      seen.add(
                          no
                      )

                      horses.append({

                          "number":
                              no,

                          "name":
                              name,

                          "jockey":
                              jockey,

                          "weight":
                              weight,

                          "odds":
                              None,

                      })


              horses.sort(
                  key=lambda x:
                  x["number"]
              )


              return horses, text


          # ==========================================================
          # RACE INFO
          # ==========================================================

          def parse_race_info(
              text
          ):

              start_time = None

              m = re.search(
                  r"発走時刻\s*[:：]?\s*"
                  r"(\d{1,2})時(\d{1,2})分",
                  text
              )

              if m:

                  start_time = (
                      f"{int(m.group(1)):02d}:"
                      f"{int(m.group(2)):02d}"
                  )


              surface = None
              distance = None

              m = re.search(
                  r"コース\s*[:：]?\s*"
                  r"([\d,]+)\s*メートル"
                  r"\s*[（(]"
                  r"(芝|ダート|障害)",
                  text
              )

              if m:

                  distance = int(
                      m.group(1)
                      .replace(
                          ",",
                          ""
                      )
                  )

                  surface = (
                      m.group(2)
                  )


              going = None

              m = re.search(
                  r"(?:芝|ダート)\s*[：:]?"
                  r"\s*(良|稍重|重|不良)",
                  text
              )

              if m:

                  going = (
                      m.group(1)
                  )


              return {

                  "start_time":
                      start_time,

                  "surface":
                      surface,

                  "distance":
                      distance,

                  "going":
                      going,

              }


          # ==========================================================
          # RACE LOOP
          # ==========================================================

          races = []


          for index, pw_token in enumerate(
              race_tokens,
              start=1
          ):

              match = (
                  PW_RACE_RE.fullmatch(
                      pw_token
                  )
              )

              venue_code = (
                  match.group(
                      "venue"
                  )
              )

              race_no = int(
                  match.group(
                      "race"
                  )
              )

              venue = (
                  venue_names.get(
                      venue_code,
                      venue_code
                  )
              )


              print()
              print(
                  "======================================"
              )

              print(
                  f"[{index}/36] "
                  f"{venue}{race_no}R"
              )

              print(
                  "PW:",
                  pw_token
              )


              # ------------------------------------------------------
              # Fetch PW page
              # ------------------------------------------------------

              pw_page_url = pw_url(
                  pw_token
              )

              try:

                  pw_html = http_get(
                      pw_page_url,
                      JRA_ACCESS
                  )

              except Exception as e:

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      f"PC版取得失敗: {e}"
                  )


              print(
                  "PW HTML:",
                  len(pw_html)
              )


              # ------------------------------------------------------
              # Find SW token
              # ------------------------------------------------------

              sw_token = (
                  discover_sw_token(
                      pw_token,
                      pw_html
                  )
              )


              print(
                  "SW TOKEN:",
                  sw_token
              )


              # ------------------------------------------------------
              # If SW link cannot be found,
              # try extracting from navigation pages
              # ------------------------------------------------------

              if not sw_token:

                  print(
                      "SW token not found "
                      "in race page."
                  )

                  print(
                      "Trying navigation links..."
                  )

                  navigation_tokens = (
                      extract_navigation_tokens(
                          pw_html
                      )
                  )


                  for nav_token in (
                      navigation_tokens
                  ):

                      if not nav_token.startswith(
                          "pw01d"
                      ):
                          continue

                      try:

                          nav_html = http_post(
                              nav_token,
                              pw_page_url
                          )

                          sw_token = (
                              discover_sw_token(
                                  pw_token,
                                  nav_html
                              )
                          )

                          if sw_token:

                              break

                      except Exception:

                          continue


              if not sw_token:

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      "のスマートフォン版URLを"
                      "発見できませんでした。"
                  )


              # ------------------------------------------------------
              # Fetch SW page
              # ------------------------------------------------------

              mobile_url = sw_url(
                  sw_token
              )

              print(
                  "SW URL:",
                  mobile_url
              )


              try:

                  mobile_html = http_get(
                      mobile_url,
                      pw_page_url
                  )

              except Exception as e:

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      f"スマホ版取得失敗: {e}"
                  )


              print(
                  "SW HTML:",
                  len(mobile_html)
              )


              # ------------------------------------------------------
              # Parse
              # ------------------------------------------------------

              horses, mobile_text = (
                  parse_mobile_horses(
                      mobile_html
                  )
              )


              print(
                  "HORSE COUNT:",
                  len(horses)
              )


              # ------------------------------------------------------
              # HARD VALIDATION
              # ------------------------------------------------------

              if len(horses) == 0:

                  print()
                  print(
                      "========== PARSER DIAGNOSTIC =========="
                  )

                  print(
                      "Venue:",
                      venue
                  )

                  print(
                      "Race:",
                      race_no
                  )

                  print(
                      "Mobile HTML:",
                      len(mobile_html)
                  )

                  print(
                      "Mobile TEXT:",
                      len(mobile_text)
                  )

                  print()
                  print(
                      mobile_text[:6000]
                  )

                  print(
                      "========================================"
                  )

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      "の馬データを取得できませんでした。"
                  )


              # ------------------------------------------------------
              # Validate horse numbers
              # ------------------------------------------------------

              numbers = [
                  h["number"]
                  for h in horses
              ]

              if (
                  len(numbers)
                  != len(set(numbers))
              ):

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      "で馬番が重複しています。"
                  )


              if not all(
                  1 <= n <= 18
                  for n in numbers
              ):

                  raise RuntimeError(
                      f"{venue}{race_no}R "
                      "に不正な馬番があります。"
                  )


              # ------------------------------------------------------
              # Race information
              # ------------------------------------------------------

              info = parse_race_info(
                  mobile_text
              )


              race = {

                  "date":
                      date,

                  "venue":
                      venue,

                  "venue_code":
                      venue_code,

                  "race_number":
                      race_no,

                  "start_time":
                      info[
                          "start_time"
                      ],

                  "surface":
                      info[
                          "surface"
                      ],

                  "distance":
                      info[
                          "distance"
                      ],

                  "going":
                      info[
                          "going"
                      ],

                  "horses":
                      horses,

                  "official_url":
                      pw_page_url,

                  "mobile_url":
                      mobile_url,

                  "official_token":
                      pw_token,

                  "mobile_token":
                      sw_token,

              }


              races.append(
                  race
              )


              print(
                  "SUCCESS:",
                  venue,
                  race_no,
                  "R",
                  len(horses),
                  "horses"
              )


              time.sleep(
                  0.4
              )


          # ==========================================================
          # FINAL VALIDATION
          # ==========================================================

          print()
          print(
              "======================================"
          )
          print(
              "FINAL VALIDATION"
          )
          print(
              "======================================"
          )


          if len(races) != 36:

              raise RuntimeError(
                  "取得レース数が36ではありません: "
                  + str(
                      len(races)
                  )
              )


          for race in races:

              if not race[
                  "horses"
              ]:

                  raise RuntimeError(
                      f"{race['venue']}"
                      f"{race['race_number']}R "
                      "の馬データが0件です。"
                  )


          # ==========================================================
          # SUMMARY
          # ==========================================================

          for race in races:

              print(
                  f"{race['venue']}"
                  f"{race['race_number']}R "
                  f": "
                  f"{len(race['horses'])}頭"
              )


          # ==========================================================
          # JSON
          # ==========================================================

          output = {

              "generated_at":
                  datetime.datetime.now(
                      ZoneInfo(
                          "Asia/Tokyo"
                      )
                  ).isoformat(),

              "date":
                  date,

              "source":
                  "JRA公式出馬表",

              "race_count":
                  36,

              "official_race_links":
                  [
                      race[
                          "official_url"
                      ]
                      for race
                      in races
                  ],

              "races":
                  races,

          }


          output_path = (
              "data/jra_daily.json"
          )


          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "======================================"
          )
          print(
              "JRA SYNC SUCCESS"
          )
          print(
              "======================================"
          )

          print(
              "Date:",
              date
          )

          print(
              "Races:",
              len(races)
          )

          print(
              "Output:",
              output_path
          )

          print(
              "======================================"
          )

          PY


      # ==========================================================
      # VERIFY JSON
      # ==========================================================

      - name: Verify JRA JSON
        shell: bash
        run: |

          set -euo pipefail

          python3 - <<'PY'

          import json

          path = (
              "data/jra_daily.json"
          )

          with open(
              path,
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          if data.get(
              "race_count"
          ) != 36:

              raise SystemExit(
                  "race_count != 36"
              )


          races = data.get(
              "races",
              []
          )


          if len(races) != 36:

              raise SystemExit(
                  "races != 36"
              )


          for race in races:

              horses = race.get(
                  "horses",
                  []
              )

              if not horses:

                  raise SystemExit(
                      "horse count = 0: "
                      + race["venue"]
                      + str(
                          race[
                              "race_number"
                          ]
                      )
                      + "R"
                  )


          print(
              "JSON VALIDATION SUCCESS"
          )

          PY


      # ==========================================================
      # Commit
      # ==========================================================

      - name: Commit JRA data
        shell: bash
        run: |

          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/jra_daily.json


          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "Update JRA daily race data"

            git push

          fi


      # ==========================================================
      # Pages
      # ==========================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
