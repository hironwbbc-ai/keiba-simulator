name: JRA Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: JRA connection diagnostic
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import requests
          import re
          from html import unescape
          from urllib.parse import urljoin

          print("=" * 70)
          print("JRA CONNECTION / HTML DIAGNOSTIC")
          print("=" * 70)

          s = requests.Session()

          s.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1",
              "Accept":
                  "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ja-JP,ja;q=0.9"
          })

          def decode_response(r):
              enc = r.apparent_encoding or "utf-8"
              try:
                  return r.content.decode(enc, errors="replace")
              except:
                  return r.text

          def clean_html(html):
              text = re.sub(
                  r'(?is)<script.*?</script>',
                  ' ',
                  html
              )

              text = re.sub(
                  r'(?is)<style.*?</style>',
                  ' ',
                  text
              )

              text = re.sub(
                  r'(?is)<[^>]+>',
                  ' ',
                  text
              )

              text = unescape(text)

              text = re.sub(
                  r'\s+',
                  ' ',
                  text
              )

              return text.strip()

          def show_result(name, r, html):
              print()
              print("=" * 70)
              print(name)
              print("=" * 70)

              print("STATUS       :", r.status_code)
              print("FINAL URL    :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))
              print("CHARACTERS   :", len(html))

              print()
              print("KEYWORDS")

              words = [
                  "出馬表",
                  "馬名",
                  "騎手",
                  "オッズ",
                  "馬体重",
                  "札幌",
                  "中山",
                  "阪神",
                  "1R",
                  "2R"
              ]

              for word in words:
                  print(
                      f"{word:<10}:",
                      "YES" if word in html else "NO"
                  )

              print()
              print("TITLE")

              m = re.search(
                  r'(?is)<title[^>]*>(.*?)</title>',
                  html
              )

              if m:
                  title = clean_html(m.group(1))
                  print(title[:500])
              else:
                  print("(NO TITLE)")

              print()
              print("ACCESSD LINKS")
              print("-" * 70)

              links = re.findall(
                  r'(?is)<a\b[^>]*href\s*=\s*["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                  html
              )

              access_count = 0

              for href, label in links:
                  href = unescape(href)
                  label = clean_html(label)

                  if "accessD" in href:
                      print("TEXT:", label[:150])
                      print("HREF:", href[:500])
                      print()

                      access_count += 1

                      if access_count >= 30:
                          break

              print(
                  "ACCESSD LINK COUNT:",
                  access_count
              )

              print()
              print("PAGE TEXT PREVIEW")
              print("-" * 70)

              text = clean_html(html)

              print(text[:5000])

          # ============================================================
          # STEP 1
          # ============================================================

          print()
          print("STEP 1 : JRA TOP")

          try:
              r = s.get(
                  "https://www.jra.go.jp/",
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 1 RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          # ============================================================
          # STEP 2
          # ============================================================

          print()
          print("STEP 2 : JRA CALENDAR")

          calendar_url = (
              "https://www.jra.go.jp/keiba/calendar2026/"
              "2026/9/0906.html"
          )

          try:
              r = s.get(
                  calendar_url,
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 2 RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          # ============================================================
          # STEP 3
          # 既知の札幌1R
          # ============================================================

          print()
          print("STEP 3 : SAPPORO 1R")

          race_token = (
              "pw01dde0101202602060120260906/6A"
          )

          race_url = (
              "https://www.jra.go.jp/JRADB/accessD.html?"
              "CNAME=" + race_token
          )

          print("REQUEST URL:")
          print(race_url)

          try:
              r = s.get(
                  race_url,
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 3 GET RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          # ============================================================
          # STEP 4
          # 同じ札幌1RをPOST
          # ============================================================

          print()
          print("STEP 4 : SAPPORO 1R POST")

          try:
              r = s.post(
                  "https://www.jra.go.jp/JRADB/accessD.html",
                  data={
                      "cname": race_token
                  },
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 4 POST RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          # ============================================================
          # STEP 5
          # app.jra.jp
          # ============================================================

          print()
          print("STEP 5 : APP.JRA.JP")

          try:
              r = s.get(
                  "https://app.jra.jp/",
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 5 RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          # ============================================================
          # STEP 6
          # sp.jra.jp
          # ============================================================

          print()
          print("STEP 6 : SP.JRA.JP")

          try:
              r = s.get(
                  "https://sp.jra.jp/",
                  timeout=30,
                  allow_redirects=True
              )

              html = decode_response(r)

              show_result(
                  "STEP 6 RESULT",
                  r,
                  html
              )

          except Exception as e:
              print("ERROR:", repr(e))

          print()
          print("=" * 70)
          print("DIAGNOSTIC FINISHED")
          print("=" * 70)

          PY
