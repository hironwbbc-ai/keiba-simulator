name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 0-8 * * 6,0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official race pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          python3 - <<'PY'
          import datetime, json, re, time, html as htmlmod
          import urllib.request, urllib.parse, http.cookiejar
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          UA = "Mozilla/5.0 (compatible; keiba-simulator/8.2)"
          BASE = "https://www.jra.go.jp"
          ACCESS = BASE + "/JRADB/accessD.html"

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.out=[]

              def handle_starttag(self, tag, attrs):
                  if tag in ("tr","p","div","li","br","h1","h2","h3"):
                      self.out.append("\n")
                  elif tag in ("td","th"):
                      self.out.append(" | ")

              def handle_endtag(self, tag):
                  if tag in ("tr","p","div","li","h1","h2","h3"):
                      self.out.append("\n")

              def handle_data(self, data):
                  self.out.append(data)

              def text(self):
                  s=htmlmod.unescape("".join(self.out))
                  lines=[]
                  for raw in s.splitlines():
                      x=re.sub(r"\s+"," ",raw).strip(" |")
                      if x:
                          lines.append(x)
                  return "\n".join(lines)

          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cj)
          )
          opener.addheaders=[
              ("User-Agent",UA),
              ("Accept-Language","ja,en;q=0.8")
          ]

          def get(url, referer=None):
              headers={
                  "User-Agent":UA,
                  "Accept-Language":"ja,en;q=0.8"
              }

              if referer:
                  headers["Referer"]=referer

              req=urllib.request.Request(url,headers=headers)

              with opener.open(req,timeout=40) as r:
                  return r.read().decode("utf-8","ignore")

          def post_cname(token, referer=None):
              data=urllib.parse.urlencode({
                  "cname":token
              }).encode()

              headers={
                  "User-Agent":UA,
                  "Accept-Language":"ja,en;q=0.8",
                  "Content-Type":"application/x-www-form-urlencoded"
              }

              if referer:
                  headers["Referer"]=referer

              req=urllib.request.Request(
                  ACCESS,
                  data=data,
                  headers=headers,
                  method="POST"
              )

              with opener.open(req,timeout=40) as r:
                  return r.read().decode("utf-8","ignore")

          def tokens(text):
              pat=re.compile(
                  r"doAction(?:N)?\s*\(\s*"
                  r"['\"](?:/JRADB/accessD\.html|https?://www\.jra\.go\.jp/JRADB/accessD\.html)"
                  r"['\"]\s*,\s*['\"]([^'\"]+)['\"]\s*\)",
                  re.I
              )

              out=[]

              for t in pat.findall(text):
                  if t not in out:
                      out.append(t)

              pat2=re.compile(
                  r"/JRADB/accessD\.html\?CNAME=([^&\"'\s<>]+)",
                  re.I
              )

              for t in pat2.findall(text):
                  t=htmlmod.unescape(t)

                  if t not in out:
                      out.append(t)

              return out

          now=datetime.datetime.now(ZoneInfo("Asia/Tokyo"))

          ymd=now.strftime("%Y%m%d")
          date=now.strftime("%Y-%m-%d")

          month=int(now.strftime("%m"))
          day=now.strftime("%d")

          cal=(
              f"{BASE}/keiba/calendar{now:%Y}/"
              f"{now:%Y}/{month}/{month:02d}{day}.html"
          )

          calendar=get(cal)

          top_tokens=tokens(calendar)

          top=[
              t for t in top_tokens
              if "pw01d" in t.lower() and ymd not in t
          ]

          if not top:
              raise RuntimeError(
                  "JRA開催日程から出馬表への入口トークンを取得できませんでした"
              )

          top_token=top[0]

          print("accessD entry token:",top_token)

          first=post_cname(top_token,cal)

          time.sleep(0.5)

          queue=[]
          seen=set()

          for t in tokens(first):
              if ymd in t and t not in seen:
                  seen.add(t)
                  queue.append(t)

          all_race_tokens=[]

          for t in queue:
              try:
                  page=post_cname(t,ACCESS)

                  time.sleep(0.35)

                  for t2 in tokens(page):
                      if ymd in t2 and t2 not in seen:
                          seen.add(t2)
                          all_race_tokens.append(t2)

                  if re.search(
                      r"pw01dde\d{2}\d{4}\d{2}\d{8}/[0-9A-F]{2}",
                      t
                  ):
                      all_race_tokens.append(t)

              except Exception as e:
                  print(
                      "navigation warning:",
                      t,
                      e
                  )

          all_race_tokens.extend([
              t for t in queue
              if re.search(
                  r"pw01dde\d{2}\d{4}\d{2}\d{8}/[0-9A-F]{2}",
                  t
              )
          ])

          race_re=re.compile(
              r"pw01dde"
              r"(?P<venue>\d{2})"
              r"(?P<meet>\d{4})"
              r"(?P<race>\d{2})"
              r"(?P<date>\d{8})"
              r"/(?P<hex>[0-9A-F]{2})",
              re.I
          )

          unique={}

          for t in all_race_tokens:
              m=race_re.fullmatch(t.strip())

              if m and m.group("date")==ymd:
                  unique[
                      (
                          m.group("venue"),
                          m.group("race")
                      )
                  ]=t

          print(
              "race token count:",
              len(unique)
          )

          venue_names={
              "01":"札幌",
              "02":"函館",
              "03":"福島",
              "04":"新潟",
              "05":"東京",
              "06":"中山",
              "07":"中京",
              "08":"京都",
              "09":"阪神",
              "10":"小倉"
          }

          races=[]

          def meta_and_horses(raw):
              p=TextParser()
              p.feed(raw)

              text=p.text()

              dm=re.search(
                  r"(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  text
              )

              mm=re.search(
                  r"(\d+)回([^\n|]+?)(\d+)日",
                  text
              )

              rm=re.search(
                  r"(\d{1,2})レース",
                  text
              )

              tm=re.search(
                  r"発走時刻：(\d{1,2})時(\d{2})分",
                  text
              )

              nm=re.search(
                  r"\n(?:第\d+回)?([^\n|]+)",
                  text
              )

              dist=re.search(
                  r"([\d,]+)メートル（(芝|ダート)・([^）]+)）",
                  text
              )

              going=re.search(
                  r"(?:芝|ダート)[^ \n|]*\s*(良|稍重|重|不良)",
                  text
              )

              meta={
                  "date":
                      f"{dm.group(1)}-"
                      f"{int(dm.group(2)):02d}-"
                      f"{int(dm.group(3)):02d}"
                      if dm else date,

                  "venue":
                      mm.group(2).strip()
                      if mm else "",

                  "no":
                      int(rm.group(1))
                      if rm else 0,

                  "time":
                      f"{int(tm.group(1)):02d}:{tm.group(2)}"
                      if tm else "",

                  "name":
                      nm.group(1).strip()
                      if nm else "レース",

                  "distance":
                      int(
                          dist.group(1).replace(",","")
                      )
                      if dist else None,

                  "surface":
                      dist.group(2)
                      if dist else "",

                  "course":
                      dist.group(3)
                      if dist else "",

                  "going":
                      going.group(1)
                      if going else ""
              }

              lines=[
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              horses=[]

              for i,line in enumerate(lines):

                  m=re.search(
                      r"(?:^|\|)\s*"
                      r"(\d{1,2})\s*\|\s*"
                      r"([^|]*?)"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*\((\d+)番人気\)",
                      line
                  )

                  if not m:
                      m=re.match(
                          r"^\s*(\d{1,2})\s+"
                          r"(.+?)"
                          r"(\d+(?:\.\d+)?)"
                          r"\s*\((\d+)番人気\)",
                          line
                      )

                  if not m:
                      continue

                  no=int(m.group(1))

                  name=re.sub(
                      r"\s+",
                      " ",
                      m.group(2)
                  ).strip(" |")

                  odds=float(m.group(3))

                  if not (1<=no<=18) or not name:
                      continue

                  weight=None
                  jockey=""
                  past=[]

                  for ln in lines[i+1:i+16]:

                      if re.search(
                          r"(?:^|\|)\s*(\d{1,2})\s*\|",
                          ln
                      ) and "番人気" in ln:
                          break

                      w=re.search(
                          r"(\d+(?:\.\d+)?)\s*kg",
                          ln
                      )

                      if w and weight is None:
                          weight=float(w.group(1))

                      if w and not jockey:
                          aft=ln.split(
                              "kg",
                              1
                          )[1]

                          jm=re.match(
                              r"\s*([^|]+)",
                              aft
                          )

                          if jm:
                              jockey=jm.group(1).strip()

                      if "年" in ln:
                          past.append(ln)

                  nums=[]

                  for s in past:
                      ns=[
                          int(x)
                          for x in re.findall(
                              r"\b\d{1,2}\b",
                              s
                          )
                          if 1<=int(x)<=18
                      ]

                      if len(ns)>=4:
                          nums.append(ns[0])

                  avg=(
                      sum(nums)/len(nums)
                      if nums
                      else 99
                  )

                  if not nums:
                      style="不明"
                  elif avg<=3:
                      style="逃げ・先行"
                  elif avg<=7:
                      style="先行・好位"
                  elif avg<=11:
                      style="差し"
                  else:
                      style="追込"

                  horses.append({
                      "no":no,
                      "name":name,
                      "odds":odds,
                      "weight":weight,
                      "jockey":jockey,
                      "style":style
                  })

              seen_h=set()

              horses=[
                  h
                  for h in sorted(
                      horses,
                      key=lambda x:x["no"]
                  )
                  if not (
                      h["no"] in seen_h
                      or seen_h.add(h["no"])
                  )
              ]

              return meta,horses,text

          for (vcode,rno),token in sorted(unique.items()):

              url=(
                  f"{ACCESS}?CNAME="
                  f"{urllib.parse.quote(token,safe='')}"
              )

              try:

                  raw=get(
                      url,
                      ACCESS
                  )

                  meta,horses,_=meta_and_horses(raw)

                  if not horses:
                      print(
                          "parse warning: no horses",
                          url
                      )

                  races.append({
                      "venue":
                          venue_names.get(
                              vcode,
                              vcode
                          ),

                      "venue_code":
                          vcode,

                      "meet":
                          meta.get(
                              "venue",
                              ""
                          ),

                      "no":
                          int(rno),

                      "date":
                          date,

                      "time":
                          meta.get(
                              "time",
                              ""
                          ),

                      "name":
                          meta.get(
                              "name",
                              "レース"
                          ),

                      "distance":
                          meta.get(
                              "distance"
                          ),

                      "surface":
                          meta.get(
                              "surface",
                              ""
                          ),

                      "course":
                          meta.get(
                              "course",
                              ""
                          ),

                      "going":
                          meta.get(
                              "going",
                              ""
                          ),

                      "url":
                          url,

                      "horses":
                          horses
                  })

                  print(
                      "race",
                      venue_names.get(
                          vcode,
                          vcode
                      ),
                      rno,
                      "horses",
                      len(horses)
                  )

              except Exception as e:
                  print(
                      "race fetch warning:",
                      url,
                      e
                  )

              time.sleep(0.35)

          races.sort(
              key=lambda r:(
                  r["venue_code"],
                  r["no"]
              )
          )

          obj={
              "date":date,
              "updated_at":now.isoformat(),
              "calendar_url":cal,
              "official_race_links":[
                  r["url"]
                  for r in races
              ],
              "races":races,
              "source":"JRA公式 accessD"
          }

          with open(
              "data/jra_daily.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  obj,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL_RACES",
              len(races)
          )

          print(
              json.dumps(
                  {
                      "date":date,
                      "links":
                          len(
                              obj[
                                  "official_race_links"
                              ]
                          ),
                      "races":
                          len(races)
                  },
                  ensure_ascii=False
              )
          )

          if len(races)==0:
              raise RuntimeError(
                  "JRAのレースURLを1件も取得できませんでした"
              )

          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
