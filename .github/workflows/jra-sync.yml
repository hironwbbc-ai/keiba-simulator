name: JRA Daily Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 5"
    - cron: "0 23 * * 6"

permissions:
  contents: write

jobs:
  jra-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and parse JRA
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import html as htmlmod
          from html.parser import HTMLParser
          from urllib.parse import quote
          from datetime import datetime, timezone, timedelta

          BASE = "https://www.jra.go.jp"
          ENTRY_TOKEN = "pw01dli00/F3"
          ACCESSD = BASE + "/JRADB/accessD.html"

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          target_date = now.strftime("%Y%m%d")

          print("=" * 70)
          print("JRA DAILY SYNC")
          print("=" * 70)
          print("JST:", now.strftime("%Y-%m-%d %H:%M:%S"))
          print("TARGET DATE:", target_date)

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1",
              "Accept":
                  "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language":
                  "ja-JP,ja;q=0.9"
          })

          # ============================================================
          # 共通
          # ============================================================

          def decode_response(r):
              enc = r.apparent_encoding or "utf-8"

              try:
                  return r.content.decode(
                      enc,
                      errors="replace"
                  )
              except Exception:
                  return r.text


          def clean_text(s):
              s = htmlmod.unescape(s or "")
              s = re.sub(r"\s+", " ", s)
              return s.strip()


          def to_float(s):
              if s is None:
                  return None

              try:
                  return float(
                      str(s)
                      .replace(",", "")
                      .replace("−", "-")
                  )
              except Exception:
                  return None


          def to_int(s):
              if s is None:
                  return None

              try:
                  return int(
                      str(s)
                      .replace(",", "")
                      .replace("−", "-")
                  )
              except Exception:
                  return None


          # ============================================================
          # HTML TABLE PARSER
          #
          # BeautifulSoup不要。
          # Python標準ライブラリだけでJRAのtable/tr/tdを解析する。
          # ============================================================

          class TableParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.rows = []
                  self.current_row = None
                  self.current_cell = None

                  self.links = []

                  self.in_table = False
                  self.in_row = False
                  self.in_cell = False
                  self.in_link = False

                  self.current_href = None
                  self.current_link_text = []


              def handle_starttag(self, tag, attrs):

                  tag = tag.lower()

                  attrs_dict = dict(attrs)

                  if tag == "table":
                      self.in_table = True

                  elif tag == "tr" and self.in_table:

                      self.in_row = True
                      self.current_row = []


                  elif tag in ("td", "th") and self.in_row:

                      self.in_cell = True
                      self.current_cell = []


                  elif tag == "a":

                      self.in_link = True
                      self.current_href = attrs_dict.get("href")
                      self.current_link_text = []


              def handle_data(self, data):

                  if self.in_cell:

                      self.current_cell.append(data)

                  if self.in_link:

                      self.current_link_text.append(data)


              def handle_endtag(self, tag):

                  tag = tag.lower()

                  if tag == "a":

                      if self.in_link:

                          text = clean_text(
                              "".join(
                                  self.current_link_text
                              )
                          )

                          if text:
                              self.links.append({
                                  "text": text,
                                  "href": self.current_href
                              })

                      self.in_link = False
                      self.current_href = None
                      self.current_link_text = []


                  elif tag in ("td", "th"):

                      if self.in_cell:

                          value = clean_text(
                              "".join(
                                  self.current_cell
                              )
                          )

                          self.current_row.append(value)

                      self.current_cell = None
                      self.in_cell = False


                  elif tag == "tr":

                      if self.in_row:

                          if self.current_row:

                              self.rows.append(
                                  self.current_row
                              )

                      self.current_row = None
                      self.in_row = False


                  elif tag == "table":

                      self.in_table = False


          # ============================================================
          # JRA ENTRY
          # ============================================================

          print()
          print("[1] JRA ENTRY")

          r = session.post(
              ACCESSD,
              data={
                  "cname": ENTRY_TOKEN
              },
              timeout=30,
              allow_redirects=True
          )

          entry_html = decode_response(r)

          print("STATUS:", r.status_code)
          print("URL:", r.url)
          print("BYTES:", len(r.content))

          # ============================================================
          # RACE TOKEN DISCOVERY
          # ============================================================

          race_pattern = re.compile(
              r'/JRADB/accessD\.html\?CNAME='
              r'(pw01dde[0-9A-Za-z]+/[0-9A-Fa-f]{2})'
          )

          race_tokens = set(
              race_pattern.findall(
                  entry_html
              )
          )

          print()
          print(
              "[2] INITIAL TOKENS:",
              len(race_tokens)
          )

          queue = list(race_tokens)
          visited = set()

          while queue and len(visited) < 100:

              token = queue.pop(0)

              if token in visited:
                  continue

              visited.add(token)

              try:

                  url = (
                      ACCESSD
                      + "?CNAME="
                      + quote(
                          token,
                          safe=""
                      )
                  )

                  rr = session.get(
                      url,
                      timeout=30,
                      allow_redirects=True
                  )

                  hh = decode_response(rr)

                  found = race_pattern.findall(
                      hh
                  )

                  for x in found:

                      if x not in race_tokens:

                          race_tokens.add(x)
                          queue.append(x)

              except Exception as e:

                  print(
                      "DISCOVERY WARNING:",
                      token,
                      repr(e)
                  )


          print(
              "TOTAL DISCOVERED:",
              len(race_tokens)
          )

          # ============================================================
          # TOKEN PARSER
          # ============================================================

          race_info_pattern = re.compile(
              r'^pw01dde'
              r'(?P<prefix>[0-9A-Za-z]{2})'
              r'(?P<venue>[0-9]{2})'
              r'(?P<year>[0-9]{4})'
              r'(?P<meeting>[0-9]{4})'
              r'(?P<race>[0-9]{2})'
              r'(?P<date>[0-9]{8})'
          )

          venue_names = {
              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉"
          }


          def parse_token(token):

              m = race_info_pattern.search(
                  token
              )

              if not m:
                  return None

              d = m.groupdict()

              return {
                  "venue_code":
                      d["venue"],

                  "venue":
                      venue_names.get(
                          d["venue"],
                          d["venue"]
                      ),

                  "year":
                      int(d["year"]),

                  "meeting":
                      d["meeting"],

                  "race_number":
                      int(d["race"]),

                  "date":
                      d["date"],

                  "token":
                      token
              }


          target_tokens = [
              token
              for token in sorted(
                  race_tokens
              )
              if target_date in token
          ]

          print()
          print(
              "TARGET RACES:",
              len(target_tokens)
          )

          # ============================================================
          # 馬名・オッズ解析
          # ============================================================

          horse_market_pattern = re.compile(
              r'^(.+?)'
              r'\s+'
              r'([0-9]+(?:\.[0-9]+)?)'
              r'\s*'
              r'\('
              r'\s*'
              r'([0-9]+)'
              r'\s*番人気'
              r'\s*\)'
          )


          horse_weight_pattern = re.compile(
              r'([0-9]{3})kg'
              r'\s*'
              r'\('
              r'\s*'
              r'([+-]?[0-9]+|初出走)'
              r'\s*'
              r'\)'
          )


          sex_age_pattern = re.compile(
              r'([牡牝セ騙])([0-9]+)'
          )


          carried_pattern = re.compile(
              r'([0-9]{2}(?:\.[0-9])?)\s*kg'
          )


          # ============================================================
          # 馬データ解析
          # ============================================================

          def parse_horses(page_html):

              parser = TableParser()

              parser.feed(
                  page_html
              )

              horses = []

              for row in parser.rows:

                  if not row:
                      continue

                  # 行全体
                  joined = " ".join(
                      row
                  )

                  joined = clean_text(
                      joined
                  )

                  # ----------------------------------------------------
                  # 馬番
                  # ----------------------------------------------------

                  number = None

                  for cell in row[:3]:

                      m = re.fullmatch(
                          r'(?:Image:\s*)?'
                          r'([1-9]|1[0-8])',
                          clean_text(cell)
                      )

                      if m:

                          number = int(
                              m.group(1)
                          )

                          break

                  if number is None:
                      continue

                  # ----------------------------------------------------
                  # 馬名 + オッズ + 人気
                  #
                  # JRAの表では同じセルに
                  #
                  # 馬名 3.2(1番人気) 446kg(-8)
                  #
                  # が入っている。
                  # ----------------------------------------------------

                  market_match = None
                  market_cell_index = None

                  for idx, cell in enumerate(row):

                      m = horse_market_pattern.search(
                          clean_text(cell)
                      )

                      if m:

                          market_match = m
                          market_cell_index = idx
                          break

                  if not market_match:
                      continue

                  name = clean_text(
                      market_match.group(1)
                  )

                  odds = to_float(
                      market_match.group(2)
                  )

                  popularity = int(
                      market_match.group(3)
                  )

                  # ----------------------------------------------------
                  # 馬名の安全チェック
                  # ----------------------------------------------------

                  if not name:
                      continue

                  # 馬名に明らかな過去走情報が入っていたら除外
                  bad_name_patterns = [
                      r'\d{4}年',
                      r'着\s*\d+',
                      r'頭\s*\d+',
                      r'3F',
                      r'前走',
                      r'前々走',
                      r'父：',
                      r'母：'
                  ]

                  if any(
                      re.search(
                          p,
                          name
                      )
                      for p in bad_name_patterns
                  ):
                      continue

                  # ----------------------------------------------------
                  # 馬体重
                  # ----------------------------------------------------

                  body_weight = None
                  body_weight_diff = None

                  for cell in row:

                      wm = horse_weight_pattern.search(
                          clean_text(cell)
                      )

                      if wm:

                          body_weight = int(
                              wm.group(1)
                          )

                          diff = wm.group(2)

                          if diff != "初出走":

                              body_weight_diff = to_int(
                                  diff
                              )

                          break

                  # ----------------------------------------------------
                  # 性齢・斤量・騎手
                  #
                  # 通常は4番目付近のセル。
                  # ----------------------------------------------------

                  sex_age = None
                  carried_weight = None
                  jockey = None

                  for cell in row:

                      cell = clean_text(
                          cell
                      )

                      sm = sex_age_pattern.search(
                          cell
                      )

                      if sm and sex_age is None:

                          sex_age = (
                              sm.group(1)
                              + sm.group(2)
                          )

                          # 同じセルから斤量を取得
                          cm = carried_pattern.search(
                              cell
                          )

                          if cm:

                              carried_weight = to_float(
                                  cm.group(1)
                              )

                              # 斤量の後ろに騎手名
                              after = cell[
                                  cm.end():
                              ]

                              after = re.sub(
                                  r'^[★▲△◇☆\s]+',
                                  '',
                                  after
                              )

                              # 余計な記号等を除去
                              after = re.sub(
                                  r'\s+',
                                  ' ',
                                  after
                              ).strip()

                              if after:

                                  # 過去走が同じセルに入る場合は
                                  # 最初の区切りまで
                                  after = re.split(
                                      r'\s+\d{4}年',
                                      after
                                  )[0].strip()

                                  if after:
                                      jockey = after

                  # ----------------------------------------------------
                  # 騎手名の最終クリーニング
                  # ----------------------------------------------------

                  if jockey:

                      jockey = re.sub(
                          r'^[★▲△◇☆]+',
                          '',
                          jockey
                      ).strip()

                      jockey = re.sub(
                          r'\s*\|\s*',
                          ' ',
                          jockey
                      ).strip()

                  horses.append({

                      "number":
                          number,

                      "name":
                          name,

                      "odds":
                          odds,

                      "popularity":
                          popularity,

                      "body_weight":
                          body_weight,

                      "body_weight_diff":
                          body_weight_diff,

                      "sex_age":
                          sex_age,

                      "carried_weight":
                          carried_weight,

                      "jockey":
                          jockey
                  })


              # --------------------------------------------------------
              # 重複除去
              # --------------------------------------------------------

              unique = {}

              for horse in horses:

                  number = horse[
                      "number"
                  ]

                  if number not in unique:

                      unique[number] = horse


              horses = [
                  unique[n]
                  for n in sorted(
                      unique
                  )
              ]

              return horses


          # ============================================================
          # レース取得
          # ============================================================

          races = []
          failures = []
          quality_warnings = []

          venue_count = {}

          sorted_tokens = sorted(
              target_tokens,
              key=lambda x: (
                  parse_token(x)["venue_code"],
                  parse_token(x)["race_number"]
              )
          )


          for index, token in enumerate(
              sorted_tokens,
              1
          ):

              info = parse_token(
                  token
              )

              if info is None:
                  continue

              venue = info[
                  "venue"
              ]

              race_no = info[
                  "race_number"
              ]

              print()
              print(
                  f"[{index}/{len(sorted_tokens)}] "
                  f"{venue}{race_no}R"
              )

              url = (
                  ACCESSD
                  + "?CNAME="
                  + quote(
                      token,
                      safe=""
                  )
              )

              try:

                  rr = session.get(
                      url,
                      timeout=30,
                      allow_redirects=True
                  )

                  page_html = decode_response(
                      rr
                  )

                  print(
                      "HTTP:",
                      rr.status_code,
                      "BYTES:",
                      len(rr.content)
                  )

                  horses = parse_horses(
                      page_html
                  )

                  print(
                      "HORSES:",
                      len(horses)
                  )

                  # ----------------------------------------------------
                  # 0頭
                  # ----------------------------------------------------

                  if not horses:

                      failures.append({
                          "venue":
                              venue,

                          "race_number":
                              race_no,

                          "url":
                              url,

                          "reason":
                              "horse parser returned 0"
                      })

                      continue

                  # ----------------------------------------------------
                  # 品質チェック
                  # ----------------------------------------------------

                  for horse in horses:

                      warning = []

                      if not horse["name"]:
                          warning.append(
                              "name missing"
                          )

                      if horse["odds"] is None:
                          warning.append(
                              "odds missing"
                          )

                      if horse["popularity"] is None:
                          warning.append(
                              "popularity missing"
                          )

                      if horse["body_weight"] is None:
                          warning.append(
                              "body weight missing"
                          )

                      if (
                          re.search(
                              r'\d{4}年|着\s*\d+|3F|前走',
                              horse["name"]
                          )
                      ):
                          warning.append(
                              "name looks corrupted"
                          )

                      if warning:

                          quality_warnings.append({
                              "venue":
                                  venue,

                              "race_number":
                                  race_no,

                              "horse_number":
                                  horse["number"],

                              "name":
                                  horse["name"],

                              "warnings":
                                  warning
                          })


                  venue_count[
                      venue
                  ] = (
                      venue_count.get(
                          venue,
                          0
                      ) + 1
                  )


                  races.append({

                      "date":
                          info["date"],

                      "venue":
                          venue,

                      "venue_code":
                          info["venue_code"],

                      "race_number":
                          race_no,

                      "token":
                          token,

                      "official_url":
                          url,

                      "horses":
                          horses
                  })


              except Exception as e:

                  print(
                      "ERROR:",
                      repr(e)
                  )

                  failures.append({

                      "venue":
                          venue,

                      "race_number":
                          race_no,

                      "url":
                          url,

                      "reason":
                          repr(e)
                  })


          # ============================================================
          # 結果
          # ============================================================

          print()
          print("=" * 70)
          print("RESULT")
          print("=" * 70)

          print(
              "TOTAL RACES:",
              len(races)
          )

          print(
              "FAILURES:",
              len(failures)
          )

          print(
              "QUALITY WARNINGS:",
              len(quality_warnings)
          )


          for venue in [
              "札幌",
              "中山",
              "阪神"
          ]:

              print(
                  venue,
                  ":",
                  venue_count.get(
                      venue,
                      0
                  ),
                  "/12"
              )


          # ------------------------------------------------------------
          # 馬名サンプル
          # ------------------------------------------------------------

          print()
          print("HORSE NAME CHECK")

          for race in races[:3]:

              print(
                  race["venue"],
                  race["race_number"],
                  "R"
              )

              for horse in race["horses"][:5]:

                  print(
                      " ",
                      horse["number"],
                      horse["name"],
                      "| odds=",
                      horse["odds"],
                      "| pop=",
                      horse["popularity"],
                      "| weight=",
                      horse["body_weight"],
                      "| diff=",
                      horse["body_weight_diff"],
                      "| carried=",
                      horse["carried_weight"],
                      "| jockey=",
                      horse["jockey"]
                  )


          # ============================================================
          # JSON
          # ============================================================

          output = {

              "updated_at":
                  now.isoformat(),

              "date":
                  target_date,

              "source":
                  "JRA official",

              "race_count":
                  len(races),

              "venue_count":
                  venue_count,

              "races":
                  races,

              "failures":
                  failures,

              "quality_warnings":
                  quality_warnings
          }


          import os

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/jra_daily.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # Actions Summary
          # ============================================================

          summary = []

          summary.append(
              "# JRA Daily Sync Result"
          )

          summary.append("")

          summary.append(
              f"- date: `{target_date}`"
          )

          summary.append(
              f"- races: `{len(races)}`"
          )

          summary.append(
              f"- failures: `{len(failures)}`"
          )

          summary.append(
              f"- quality warnings: `{len(quality_warnings)}`"
          )

          summary.append("")

          summary.append(
              "## Venue"
          )

          for venue in [
              "札幌",
              "中山",
              "阪神"
          ]:

              summary.append(
                  f"- {venue}: "
                  f"{venue_count.get(venue, 0)}/12"
              )


          summary.append("")

          summary.append(
              "## Race horse counts"
          )

          for race in sorted(
              races,
              key=lambda x: (
                  x["venue_code"],
                  x["race_number"]
              )
          ):

              summary.append(
                  f"- {race['venue']}"
                  f"{race['race_number']}R: "
                  f"{len(race['horses'])}頭"
              )


          if quality_warnings:

              summary.append("")

              summary.append(
                  "## Quality warnings"
              )

              for warning in quality_warnings[:50]:

                  summary.append(
                      f"- {warning['venue']}"
                      f"{warning['race_number']}R "
                      f"{warning['horse_number']}番 "
                      f"{warning['name']}: "
                      f"{', '.join(warning['warnings'])}"
                  )


          if failures:

              summary.append("")

              summary.append(
                  "## Failures"
              )

              for failure in failures:

                  summary.append(
                      f"- {failure['venue']}"
                      f"{failure['race_number']}R: "
                      f"{failure['reason']}"
                  )


          with open(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ],
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(summary)
              )


          # ============================================================
          # 最終判定
          # ============================================================

          # 36レースを想定。
          # 1レースでも取得できなければ失敗。
          if len(races) == 0:

              raise RuntimeError(
                  "JRAのレースデータを1件も取得できませんでした。"
              )


          if failures:

              raise RuntimeError(
                  f"JRAレース取得失敗: "
                  f"{len(failures)}件"
              )


          # 馬名破損は重大なので失敗扱い。
          corrupted = [
              w
              for w in quality_warnings
              if "name looks corrupted"
              in w["warnings"]
          ]

          if corrupted:

              raise RuntimeError(
                  "馬名データに破損の可能性があります: "
                  + str(len(corrupted))
                  + "件"
              )


          print()
          print("=" * 70)
          print("JRA SYNC FINISHED SUCCESSFULLY")
          print("=" * 70)

          PY


      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jra_daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update JRA daily race data"
            git push
          fi
