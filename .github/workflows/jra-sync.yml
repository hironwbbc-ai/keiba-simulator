name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/15 0-8 * * 6,0"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official race pages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'
          import datetime
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          BASE = "https://www.jra.go.jp"
          ACCESS = BASE + "/JRADB/accessD.html"
          UA = "Mozilla/5.0 (compatible; keiba-simulator/8.2)"

          # ------------------------------------------------------------
          # HTTP session
          # ------------------------------------------------------------

          cookie_jar = http.cookiejar.CookieJar()

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar)
          )

          opener.addheaders = [
              ("User-Agent", UA),
              ("Accept-Language", "ja,en;q=0.8"),
          ]

          def get(url, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
              }

              if referer:
                  headers["Referer"] = referer

              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              with opener.open(req, timeout=40) as response:
                  return response.read().decode(
                      "utf-8",
                      "ignore"
                  )

          def post_cname(cname, referer=None):
              data = urllib.parse.urlencode({
                  "cname": cname
              }).encode()

              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  "Content-Type":
                      "application/x-www-form-urlencoded",
              }

              if referer:
                  headers["Referer"] = referer

              req = urllib.request.Request(
                  ACCESS,
                  data=data,
                  headers=headers,
                  method="POST"
              )

              with opener.open(req, timeout=40) as response:
                  return response.read().decode(
                      "utf-8",
                      "ignore"
                  )

          # ------------------------------------------------------------
          # HTML -> text
          # ------------------------------------------------------------

          class TextParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )
                  self.out = []

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):
                  if tag in (
                      "tr",
                      "p",
                      "div",
                      "li",
                      "br",
                      "h1",
                      "h2",
                      "h3"
                  ):
                      self.out.append("\n")

                  elif tag in ("td", "th"):
                      self.out.append(" | ")

              def handle_endtag(self, tag):
                  if tag in (
                      "tr",
                      "p",
                      "div",
                      "li",
                      "h1",
                      "h2",
                      "h3"
                  ):
                      self.out.append("\n")

              def handle_data(self, data):
                  self.out.append(data)

              def text(self):
                  text = "".join(self.out)

                  lines = []

                  for line in text.splitlines():
                      line = re.sub(
                          r"\s+",
                          " ",
                          line
                      ).strip(" |")

                      if line:
                          lines.append(line)

                  return "\n".join(lines)

          # ------------------------------------------------------------
          # Date
          # ------------------------------------------------------------

          now = datetime.datetime.now(
              ZoneInfo("Asia/Tokyo")
          )

          date = now.strftime("%Y-%m-%d")
          ymd = now.strftime("%Y%m%d")
          year = now.strftime("%Y")
          month = int(now.strftime("%m"))
          day = now.strftime("%d")

          calendar_url = (
              f"{BASE}/keiba/calendar{year}/"
              f"{year}/{month}/{month:02d}{day}.html"
          )

          print("Calendar:")
          print(calendar_url)
          print()

          calendar_html = get(calendar_url)

          # ------------------------------------------------------------
          # Race token
          #
          # pw01dde
          # + prefix 2
          # + venue 2
          # + year 4
          # + meet/day 4
          # + race 2
          # + date 8
          # + check 2
          # ------------------------------------------------------------

          RACE_TOKEN_RE = re.compile(
              r"pw01dde"
              r"(?P<prefix>\d{2})"
              r"(?P<venue>\d{2})"
              r"(?P<year>\d{4})"
              r"(?P<meet>\d{4})"
              r"(?P<race>\d{2})"
              r"(?P<date>\d{8})"
              r"/(?P<hex>[0-9A-Fa-f]{2})",
              re.I
          )

          # Mobile version of JRA uses sw01ddd.
          SW_RACE_TOKEN_RE = re.compile(
              r"sw01ddd"
              r"(?P<prefix>\d{2})"
              r"(?P<venue>\d{2})"
              r"(?P<year>\d{4})"
              r"(?P<meet>\d{4})"
              r"(?P<race>\d{2})"
              r"(?P<date>\d{8})"
              r"/(?P<hex>[0-9A-Fa-f]{2})",
              re.I
          )

          # ------------------------------------------------------------
          # Extract every accessD/doAction CNAME
          # ------------------------------------------------------------

          ACTION_RE = re.compile(
              r"doAction\s*\(\s*"
              r"['\"]([^'\"]*accessD\.html)['\"]"
              r"\s*,\s*"
              r"['\"]([^'\"]+)['\"]",
              re.I
          )

          CNAME_RE = re.compile(
              r"(?:CNAME=|cname['\"]?\s*value\s*=\s*['\"]?)"
              r"(pw01d[0-9A-Za-z]+/[0-9A-Fa-f]{2})",
              re.I
          )

          def extract_access_tokens(html):

              found = []

              # doAction(...)
              for m in ACTION_RE.finditer(html):
                  cname = m.group(2).strip()

                  if cname not in found:
                      found.append(cname)

              # CNAME=...
              for m in CNAME_RE.finditer(html):
                  cname = m.group(1).strip()

                  if cname not in found:
                      found.append(cname)

              return found

          def extract_race_tokens(html):

              found = []

              for regex in (
                  RACE_TOKEN_RE,
                  SW_RACE_TOKEN_RE
              ):
                  for m in regex.finditer(html):

                      token = m.group(0)

                      if token not in found:
                          found.append(token)

              return found

          # ------------------------------------------------------------
          # Start from official entry
          # ------------------------------------------------------------

          ENTRY_TOKEN = "pw01dli00/F3"

          print("Entry token:")
          print(ENTRY_TOKEN)
          print()

          # ------------------------------------------------------------
          # Crawl JRA accessD pages
          #
          # JRA's current site is hierarchical:
          #
          # 出馬表入口
          #     ↓
          # 開催選択
          #     ↓
          # レース選択
          #     ↓
          # 各レース
          #
          # Therefore we follow accessD CNAMEs instead of assuming
          # that all race links exist on one page.
          # ------------------------------------------------------------

          queue = [ENTRY_TOKEN]

          visited = set()
          race_tokens = []

          MAX_PAGES = 80

          while queue and len(visited) < MAX_PAGES:

              token = queue.pop(0)

              if token in visited:
                  continue

              visited.add(token)

              print(
                  f"[{len(visited)}] Access:",
                  token
              )

              try:
                  html = post_cname(
                      token,
                      calendar_url
                  )
              except Exception as e:
                  print(
                      "  access warning:",
                      e
                  )
                  continue

              # Race links
              races_here = extract_race_tokens(
                  html
              )

              if races_here:
                  print(
                      "  race tokens:",
                      len(races_here)
                  )

              for race_token in races_here:

                  # Only today's races
                  m = (
                      RACE_TOKEN_RE.fullmatch(
                          race_token
                      )
                      or
                      SW_RACE_TOKEN_RE.fullmatch(
                          race_token
                      )
                  )

                  if not m:
                      continue

                  if m.group("date") != ymd:
                      continue

                  if race_token not in race_tokens:
                      race_tokens.append(
                          race_token
                      )

              # Navigation links
              next_tokens = extract_access_tokens(
                  html
              )

              print(
                  "  navigation tokens:",
                  len(next_tokens)
              )

              for next_token in next_tokens:

                  if next_token in visited:
                      continue

                  # Don't wander into unrelated pages.
                  if (
                      "pw01d" not in next_token
                      and
                      "sw01d" not in next_token
                  ):
                      continue

                  queue.append(next_token)

              # Stop early once all 36 are found.
              if len(race_tokens) >= 36:
                  break

              time.sleep(0.25)

          # ------------------------------------------------------------
          # Remove duplicates
          # ------------------------------------------------------------

          race_tokens = list(
              dict.fromkeys(race_tokens)
          )

          # Sort
          def race_sort_key(token):

              m = (
                  RACE_TOKEN_RE.fullmatch(token)
                  or
                  SW_RACE_TOKEN_RE.fullmatch(token)
              )

              return (
                  m.group("venue"),
                  int(m.group("race"))
              )

          race_tokens.sort(
              key=race_sort_key
          )

          print()
          print("======================================")
          print(
              "DISCOVERED RACE TOKENS:",
              len(race_tokens)
          )
          print("======================================")

          for token in race_tokens:
              m = (
                  RACE_TOKEN_RE.fullmatch(token)
                  or
                  SW_RACE_TOKEN_RE.fullmatch(token)
              )

              print(
                  m.group("venue"),
                  m.group("race"),
                  token
              )

          # ------------------------------------------------------------
          # Venue names
          # ------------------------------------------------------------

          venue_names = {
              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉",
          }

          # ------------------------------------------------------------
          # URL
          # ------------------------------------------------------------

          def token_to_url(token):

              if token.startswith("sw01ddd"):
                  host = "https://app.jra.jp"
              else:
                  host = BASE

              return (
                  host
                  + "/JRADB/accessD.html?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )

          # ------------------------------------------------------------
          # Parse race
          # ------------------------------------------------------------

          def parse_race(
              raw,
              token
          ):

              parser = TextParser()
              parser.feed(raw)

              text = parser.text()

              m = (
                  RACE_TOKEN_RE.fullmatch(token)
                  or
                  SW_RACE_TOKEN_RE.fullmatch(token)
              )

              if not m:
                  return None

              venue_code = m.group("venue")
              race_no = int(
                  m.group("race")
              )

              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              # -------------------------
              # Start time
              # -------------------------

              start_time = ""

              time_match = re.search(
                  r"発走時刻：\s*"
                  r"(\d{1,2})時(\d{2})分",
                  text
              )

              if time_match:

                  start_time = (
                      f"{int(time_match.group(1)):02d}:"
                      f"{time_match.group(2)}"
                  )

              # -------------------------
              # Race name
              # -------------------------

              race_name = ""

              for i, line in enumerate(lines):

                  if "コース：" in line:

                      for candidate in lines[
                          max(0, i - 6):i
                      ]:

                          if (
                              candidate
                              and "本賞金"
                              not in candidate
                              and "発走"
                              not in candidate
                              and "2026年"
                              not in candidate
                              and "出馬表"
                              not in candidate
                          ):

                              race_name = candidate

                      break

              if not race_name:
                  race_name = "レース"

              # -------------------------
              # Course
              # -------------------------

              distance = None
              surface = ""
              course = ""

              distance_match = re.search(
                  r"コース：\s*"
                  r"([\d,]+)メートル"
                  r"（([^）]+)）",
                  text
              )

              if distance_match:

                  distance = int(
                      distance_match.group(1)
                      .replace(",", "")
                  )

                  course_info = (
                      distance_match.group(2)
                  )

                  if "芝" in course_info:
                      surface = "芝"

                  elif "ダート" in course_info:
                      surface = "ダート"

                  course = course_info

              # -------------------------
              # Going
              # -------------------------

              going = ""

              for value in (
                  "良",
                  "稍重",
                  "重",
                  "不良"
              ):

                  if re.search(
                      rf"(芝|ダート)[^|。\n]*{value}",
                      text
                  ):

                      going = value
                      break

              # -------------------------
              # Horses
              # -------------------------

              horses = []

              # Main desktop format:
              #
              # | 1 | horse name | 12.2(6番人気)
              #
              horse_patterns = [

                  re.compile(
                      r"(?:^|\|)\s*"
                      r"(\d{1,2})\s*\|\s*"
                      r"(.+?)"
                      r"\s+"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*\("
                      r"(\d+)番人気"
                      r"\)"
                  ),

                  re.compile(
                      r"^\s*"
                      r"(\d{1,2})\s+"
                      r"(.+?)"
                      r"\s+"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*\("
                      r"(\d+)番人気"
                      r"\)"
                  )
              ]

              for i, line in enumerate(lines):

                  match = None

                  for pattern in horse_patterns:

                      match = pattern.search(
                          line
                      )

                      if match:
                          break

                  if not match:
                      continue

                  horse_no = int(
                      match.group(1)
                  )

                  if not (
                      1 <= horse_no <= 18
                  ):
                      continue

                  horse_name = (
                      match.group(2)
                      .strip()
                  )

                  odds = float(
                      match.group(3)
                  )

                  popularity = int(
                      match.group(4)
                  )

                  weight = None
                  jockey = ""

                  # Search following lines
                  for next_line in lines[
                      i + 1:i + 15
                  ]:

                      kg_match = re.search(
                          r"(\d+(?:\.\d+)?)"
                          r"\s*kg\s*"
                          r"([^|]+)",
                          next_line
                      )

                      if kg_match:

                          if weight is None:
                              weight = float(
                                  kg_match.group(1)
                              )

                          if not jockey:
                              jockey = (
                                  kg_match.group(2)
                                  .strip()
                              )

                          break

                  horse_name = re.sub(
                      r"\s+",
                      " ",
                      horse_name
                  ).strip()

                  horses.append({
                      "no": horse_no,
                      "name": horse_name,
                      "odds": odds,
                      "popularity":
                          popularity,
                      "weight": weight,
                      "jockey": jockey,
                  })

              # Unique by horse number
              unique_horses = {}

              for horse in horses:
                  unique_horses[
                      horse["no"]
                  ] = horse

              horses = sorted(
                  unique_horses.values(),
                  key=lambda x: x["no"]
              )

              return {
                  "venue":
                      venue_names.get(
                          venue_code,
                          venue_code
                      ),

                  "venue_code":
                      venue_code,

                  "race_no":
                      race_no,

                  "date":
                      date,

                  "time":
                      start_time,

                  "name":
                      race_name,

                  "distance":
                      distance,

                  "surface":
                      surface,

                  "course":
                      course,

                  "going":
                      going,

                  "url":
                      token_to_url(token),

                  "horses":
                      horses,
              }

          # ------------------------------------------------------------
          # Fetch every race
          # ------------------------------------------------------------

          races = []

          for token in race_tokens:

              m = (
                  RACE_TOKEN_RE.fullmatch(token)
                  or
                  SW_RACE_TOKEN_RE.fullmatch(token)
              )

              venue_code = m.group(
                  "venue"
              )

              race_no = int(
                  m.group("race")
              )

              url = token_to_url(token)

              print()
              print(
                  "Fetching:",
                  venue_names.get(
                      venue_code,
                      venue_code
                  ),
                  race_no
              )

              print(url)

              try:

                  raw = get(
                      url,
                      ACCESS
                  )

                  race = parse_race(
                      raw,
                      token
                  )

                  if race:

                      races.append(race)

                      print(
                          "  horses:",
                          len(
                              race["horses"]
                          )
                      )

                  else:

                      print(
                          "  parse failed"
                      )

              except Exception as e:

                  print(
                      "  race fetch warning:",
                      e
                  )

              time.sleep(0.35)

          # ------------------------------------------------------------
          # Sort
          # ------------------------------------------------------------

          races.sort(
              key=lambda r: (
                  r["venue_code"],
                  r["race_no"]
              )
          )

          # ------------------------------------------------------------
          # Validation
          # ------------------------------------------------------------

          venue_counts = {}

          for race in races:

              venue = race[
                  "venue"
              ]

              venue_counts[
                  venue
              ] = venue_counts.get(
                  venue,
                  0
              ) + 1

          print()
          print("======================================")
          print("VENUE COUNTS")
          print("======================================")

          for venue, count in sorted(
              venue_counts.items()
          ):

              print(
                  venue,
                  count
              )

          print()
          print("======================================")
          print(
              "FINAL_RACES:",
              len(races)
          )
          print(
              "OFFICIAL_LINKS:",
              len(races)
          )
          print("======================================")

          # ------------------------------------------------------------
          # Important:
          #
          # Do NOT deploy a partial dataset.
          #
          # Today is expected to have:
          # 中山 12
          # 阪神 12
          # 札幌 12
          # total 36
          # ------------------------------------------------------------

          expected_venues = {
              "中山": 12,
              "阪神": 12,
              "札幌": 12,
          }

          if len(races) != 36:

              raise RuntimeError(
                  "JRAレース取得数が36件ではありません: "
                  + str(len(races))
              )

          for venue, expected in (
              expected_venues.items()
          ):

              actual = venue_counts.get(
                  venue,
                  0
              )

              if actual != expected:

                  raise RuntimeError(
                      f"{venue}の取得数が"
                      f"{expected}件ではありません: "
                      f"{actual}件"
                  )

          # ------------------------------------------------------------
          # Check horses
          # ------------------------------------------------------------

          empty_horse_races = [
              r for r in races
              if len(r["horses"]) == 0
          ]

          if empty_horse_races:

              names = [
                  f'{r["venue"]}{r["race_no"]}R'
                  for r in empty_horse_races
              ]

              raise RuntimeError(
                  "馬データを取得できないレースがあります: "
                  + ", ".join(names)
              )

          # ------------------------------------------------------------
          # Save JSON
          # ------------------------------------------------------------

          result = {
              "date": date,

              "updated_at":
                  now.isoformat(),

              "calendar_url":
                  calendar_url,

              "official_race_links": [
                  race["url"]
                  for race in races
              ],

              "races":
                  races,

              "source":
                  "JRA公式 accessD",

              "race_count":
                  len(races),

              "venue_counts":
                  venue_counts,
          }

          with open(
              "data/jra_daily.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "JRA sync completed successfully."
          )

          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
