name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]

  schedule:
    # JST Saturday/Sunday 08:00
    - cron: "0 23 * * 5,6"

  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 (YYYYMMDD)。空欄なら今日(JST)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official race pages
        shell: bash

        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}

        run: |

          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'

          import datetime
          import html
          import http.cookiejar
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          from pathlib import Path
          from zoneinfo import ZoneInfo


          # ============================================================
          # SETTINGS
          # ============================================================

          BASE = "https://www.jra.go.jp"
          ACCESS = BASE + "/JRADB/accessD.html"

          ENTRY_TOKEN = "pw01dli00/F3"

          JST = ZoneInfo("Asia/Tokyo")

          UA = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/140.0 Safari/537.36"
          )


          # ============================================================
          # DATE
          # ============================================================

          now = datetime.datetime.now(JST)

          requested = os.environ.get(
              "RACE_DATE_INPUT",
              ""
          ).strip()

          if requested:

              if not re.fullmatch(r"\d{8}", requested):
                  raise RuntimeError(
                      "race_date は YYYYMMDD 形式で指定してください"
                  )

              target_ymd = requested

          else:

              target_ymd = now.strftime("%Y%m%d")


          target_date = datetime.datetime.strptime(
              target_ymd,
              "%Y%m%d"
          ).date()

          target_iso = target_date.isoformat()

          print("")
          print("=" * 70)
          print("JRA SYNC")
          print("=" * 70)
          print("TARGET DATE :", target_ymd)
          print("TARGET ISO  :", target_iso)
          print("=" * 70)
          print("")


          # ============================================================
          # HTTP SESSION
          # ============================================================

          cookie_jar = http.cookiejar.CookieJar()

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar)
          )


          def request_bytes(
              url,
              method="GET",
              data=None,
              referer=None
          ):

              headers = {
                  "User-Agent": UA,

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8",

                  "Accept-Language":
                      "ja,en-US;q=0.9,en;q=0.8",

                  "Cache-Control": "no-cache",

                  "Pragma": "no-cache",
              }

              if referer:
                  headers["Referer"] = referer

              if method == "POST":

                  headers["Content-Type"] = (
                      "application/x-www-form-urlencoded"
                  )

                  headers["Origin"] = BASE

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              with opener.open(
                  request,
                  timeout=45
              ) as response:

                  return response.read()


          def decode_jra(raw):

              for encoding in (
                  "cp932",
                  "shift_jis",
                  "utf-8"
              ):

                  try:

                      text = raw.decode(encoding)

                      if (
                          "<html" in text.lower()
                          or "JRADB" in text
                          or "accessD" in text
                      ):
                          return text

                  except UnicodeDecodeError:

                      pass

              return raw.decode(
                  "cp932",
                  "replace"
              )


          def get_html(
              url,
              referer=None
          ):

              raw = request_bytes(
                  url,
                  "GET",
                  None,
                  referer
              )

              return decode_jra(raw)


          def post_cname(
              token,
              referer=None
          ):

              body = urllib.parse.urlencode(
                  {
                      "cname": token
                  }
              ).encode("ascii")

              raw = request_bytes(
                  ACCESS,
                  "POST",
                  body,
                  referer
              )

              return decode_jra(raw)


          # ============================================================
          # TOKEN DISCOVERY
          # ============================================================

          # JRA race token:
          #
          # pw01dde + 22 characters + /XX
          #
          # Example:
          #
          # pw01dde1006202604021120260906/A3
          #

          RACE_TOKEN_RE = re.compile(
              r"pw01dde"
              r"[0-9A-Za-z]{22}"
              r"(?:/|%2F)"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          # Generic JRA access token.
          #
          # This is intentionally broad because JRA uses several
          # different token prefixes for navigation pages.

          GENERIC_TOKEN_RE = re.compile(
              r"pw01d"
              r"[0-9A-Za-z]+"
              r"(?:/|%2F)"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          def normalize_token(token):

              token = html.unescape(token)

              token = urllib.parse.unquote(token)

              token = token.strip()

              return token


          def is_target_race(token):

              token = normalize_token(token)

              # The most reliable condition:
              #
              # 1. It must be a JRA race token.
              # 2. The 8-digit target date must appear in the token.
              #
              # Example:
              # pw01dde1006202604021120260906/A3
              #

              if not RACE_TOKEN_RE.fullmatch(token):
                  return False

              return target_ymd in token


          def extract_tokens(text):

              text = html.unescape(text)

              found = set()

              # --------------------------------------------------------
              # Direct race tokens
              # --------------------------------------------------------

              for match in RACE_TOKEN_RE.finditer(text):

                  found.add(
                      normalize_token(match.group(0))
                  )


              # --------------------------------------------------------
              # Generic navigation tokens
              # --------------------------------------------------------

              for match in GENERIC_TOKEN_RE.finditer(text):

                  found.add(
                      normalize_token(match.group(0))
                  )


              return found


          def classify_tokens(tokens):

              races = set()
              navigation = set()

              for token in tokens:

                  token = normalize_token(token)

                  if is_target_race(token):

                      races.add(token)

                  else:

                      navigation.add(token)

              return races, navigation


          # ============================================================
          # STEP 1
          # ============================================================

          print("STEP 1: ENTRY GET")

          entry_html = get_html(
              ACCESS
          )

          print(
              "ENTRY GET HTML:",
              len(entry_html)
          )


          # ============================================================
          # STEP 2
          # ============================================================

          print("")
          print("STEP 2: ENTRY POST")

          entry_html = post_cname(
              ENTRY_TOKEN,
              ACCESS
          )

          print(
              "ENTRY POST HTML:",
              len(entry_html)
          )


          initial_tokens = extract_tokens(
              entry_html
          )

          initial_races, initial_navigation = classify_tokens(
              initial_tokens
          )

          print(
              "INITIAL ACCESS TOKENS:",
              len(initial_tokens)
          )

          print(
              "INITIAL TARGET RACES:",
              len(initial_races)
          )


          # ============================================================
          # DISCOVERY
          # ============================================================

          race_tokens = set(
              initial_races
          )

          queue = []

          seen = set()

          for token in sorted(initial_navigation):

              if token not in seen:

                  seen.add(token)

                  queue.append(token)


          print("")
          print("=" * 70)
          print("TARGET RACE DISCOVERY")
          print("=" * 70)


          MAX_NAV_PAGES = 120

          index = 0


          while (
              queue
              and index < MAX_NAV_PAGES
              and len(race_tokens) < 36
          ):

              token = queue.pop(0)

              index += 1

              print(
                  f"NAV {index}/{MAX_NAV_PAGES}: {token}"
              )

              try:

                  page = post_cname(
                      token,
                      ACCESS
                  )

              except Exception as exc:

                  print(
                      "  POST ERROR:",
                      str(exc)
                  )

                  continue


              tokens = extract_tokens(
                  page
              )

              races, navigation = classify_tokens(
                  tokens
              )

              before = len(race_tokens)

              race_tokens.update(
                  races
              )

              new_races = (
                  len(race_tokens)
                  - before
              )


              print(
                  "  tokens:",
                  len(tokens)
              )

              print(
                  "  new races:",
                  new_races
              )

              print(
                  "  total target races:",
                  len(race_tokens)
              )


              # --------------------------------------------------------
              # Important:
              #
              # If this page contains target races, do not waste time
              # exploring unrelated navigation pages unnecessarily.
              # --------------------------------------------------------

              if len(race_tokens) >= 36:

                  print("")
                  print(
                      "36 target races found. "
                      "Stopping navigation."
                  )

                  break


              for next_token in sorted(navigation):

                  if next_token in seen:
                      continue

                  # Never queue a race token as navigation.
                  if is_target_race(next_token):
                      continue

                  seen.add(
                      next_token
                  )

                  queue.append(
                      next_token
                  )


              # Be polite to JRA.
              time.sleep(0.15)


          # ============================================================
          # DISCOVERY RESULT
          # ============================================================

          print("")
          print("=" * 70)
          print("DISCOVERY RESULT")
          print("=" * 70)

          print(
              "NAV PAGES VISITED:",
              index
          )

          print(
              "TARGET RACE TOKENS:",
              len(race_tokens)
          )

          print("=" * 70)


          # ============================================================
          # VALIDATION
          # ============================================================

          if len(race_tokens) == 0:

              raise RuntimeError(
                  "対象日のJRAレースを発見できませんでした。"
              )


          # Weekend JRA normally has 36 races.
          #
          # For Saturday/Sunday manual tests, make sure we did not
          # accidentally publish incomplete data.

          weekday = target_date.weekday()

          if weekday in (5, 6):

              if len(race_tokens) < 36:

                  print("")
                  print(
                      "WARNING:"
                  )

                  print(
                      "週末ですが36レース未満です。"
                  )

                  print(
                      "発見できたレース:"
                      ,
                      len(race_tokens)
                  )

                  print(
                      "今回は安全のため処理を停止します。"
                  )

                  raise RuntimeError(
                      "対象日のレース数が不足しています。"
                  )


          # ============================================================
          # SORT RACE TOKENS
          # ============================================================

          # Token structure:
          #
          # pw01dde
          # XX
          # venue
          # YYYY
          # meeting/day
          # race
          # YYYYMMDD
          # /XX
          #

          def race_sort_key(token):

              token = normalize_token(token)

              body = token[len("pw01dde"):]

              prefix = body[0:2]
              venue = body[2:4]
              year = body[4:8]
              meeting = body[8:12]
              race_no = body[12:14]
              date = body[14:22]

              return (
                  date,
                  venue,
                  meeting,
                  int(race_no),
                  token
              )


          race_tokens = sorted(
              race_tokens,
              key=race_sort_key
          )


          print("")
          print("SORTED TARGET RACES")

          for token in race_tokens:

              print(
                  " ",
                  token
              )


          # ============================================================
          # HTML HELPERS
          # ============================================================

          def clean_text(value):

              if value is None:
                  return ""

              value = re.sub(
                  r"<[^>]+>",
                  "",
                  value
              )

              value = html.unescape(
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def first_match(
              pattern,
              text,
              flags=re.S
          ):

              match = re.search(
                  pattern,
                  text,
                  flags
              )

              if not match:
                  return ""

              return clean_text(
                  match.group(1)
              )


          # ============================================================
          # HORSE PARSER
          # ============================================================

          def parse_horses(page):

              horses = []

              # JRA race tables contain one <tr> per horse.
              rows = re.findall(
                  r"<tr\b[^>]*>.*?</tr>",
                  page,
                  re.I | re.S
              )


              for row in rows:

                  # ----------------------------------------------------
                  # Horse number
                  # ----------------------------------------------------

                  number_match = re.search(
                      r"<td\b[^>]*class=['\"][^'\"]*\bnum\b[^'\"]*['\"][^>]*>"
                      r"\s*(\d{1,2})",
                      row,
                      re.I | re.S
                  )

                  if not number_match:
                      continue


                  horse_no = int(
                      number_match.group(1)
                  )


                  # ----------------------------------------------------
                  # Horse name
                  # ----------------------------------------------------

                  horse_name = first_match(
                      r"<div\b[^>]*class=['\"][^'\"]*\bname\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</div>",
                      row
                  )


                  if not horse_name:

                      horse_name = first_match(
                          r"<p\b[^>]*class=['\"][^'\"]*\bname\b[^'\"]*['\"][^>]*>"
                          r"(.*?)"
                          r"</p>",
                          row
                      )


                  # ----------------------------------------------------
                  # Odds
                  # ----------------------------------------------------

                  odds = first_match(
                      r"<div\b[^>]*class=['\"][^'\"]*\bodds\b[^'\"]*['\"][^>]*>"
                      r".*?"
                      r"<strong\b[^>]*>"
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"</strong>",
                      row
                  )


                  # ----------------------------------------------------
                  # Popularity
                  # ----------------------------------------------------

                  popularity_text = first_match(
                      r"<span\b[^>]*class=['\"][^'\"]*\bpop_rank\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</span>",
                      row
                  )


                  popularity_match = re.search(
                      r"(\d+)",
                      popularity_text
                  )

                  popularity = (
                      int(popularity_match.group(1))
                      if popularity_match
                      else None
                  )


                  # ----------------------------------------------------
                  # Body weight
                  # ----------------------------------------------------

                  body_weight_text = first_match(
                      r"<div\b[^>]*class=['\"][^'\"]*\bcell\b[^'\"]*\bweight\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</div>",
                      row
                  )


                  body_weight_match = re.search(
                      r"(\d{3})kg",
                      body_weight_text
                  )

                  body_weight = (
                      int(body_weight_match.group(1))
                      if body_weight_match
                      else None
                  )


                  body_diff_match = re.search(
                      r"\(([+-]?\d+)\)",
                      body_weight_text
                  )

                  body_weight_diff = (
                      int(body_diff_match.group(1))
                      if body_diff_match
                      else None
                  )


                  # ----------------------------------------------------
                  # Sex / age
                  # ----------------------------------------------------

                  sex_age = first_match(
                      r"<p\b[^>]*class=['\"][^'\"]*\bage\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</p>",
                      row
                  )


                  # ----------------------------------------------------
                  # Carried weight
                  # ----------------------------------------------------

                  carried_weight = first_match(
                      r"<p\b[^>]*class=['\"][^'\"]*\bweight\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</p>",
                      row
                  )

                  carried_weight_match = re.search(
                      r"(\d+(?:\.\d+)?)",
                      carried_weight
                  )

                  carried_weight_value = (
                      float(
                          carried_weight_match.group(1)
                      )
                      if carried_weight_match
                      else None
                  )


                  # ----------------------------------------------------
                  # Jockey
                  # ----------------------------------------------------

                  jockey = first_match(
                      r"<p\b[^>]*class=['\"][^'\"]*\bjockey\b[^'\"]*['\"][^>]*>"
                      r"(.*?)"
                      r"</p>",
                      row
                  )


                  # ----------------------------------------------------
                  # Ignore non-horse rows
                  # ----------------------------------------------------

                  if not horse_name:
                      continue


                  horses.append(
                      {
                          "number": horse_no,
                          "name": horse_name,
                          "odds": (
                              float(odds)
                              if odds
                              else None
                          ),
                          "popularity": popularity,
                          "body_weight": body_weight,
                          "body_weight_diff": body_weight_diff,
                          "sex_age": sex_age,
                          "carried_weight": carried_weight_value,
                          "jockey": jockey,
                      }
                  )


              # Remove accidental duplicates.
              unique = {}

              for horse in horses:

                  unique[
                      horse["number"]
                  ] = horse


              return [
                  unique[number]
                  for number in sorted(unique)
              ]


          # ============================================================
          # RACE PAGE PARSER
          # ============================================================

          def parse_race(
              token,
              page
          ):

              # --------------------------------------------------------
              # Race title
              # --------------------------------------------------------

              title = first_match(
                  r"<h1\b[^>]*>"
                  r"(.*?)"
                  r"</h1>",
                  page
              )


              if not title:

                  title = first_match(
                      r"<title\b[^>]*>"
                      r"(.*?)"
                      r"</title>",
                      page
                  )


              # --------------------------------------------------------
              # Race number
              # --------------------------------------------------------

              race_no_match = re.search(
                  r"(\d{1,2})R",
                  page
              )

              race_no = (
                  int(race_no_match.group(1))
                  if race_no_match
                  else None
              )


              # --------------------------------------------------------
              # Distance
              # --------------------------------------------------------

              distance_match = re.search(
                  r"(芝|ダート|ダ|障害)[^\d]{0,20}"
                  r"(\d{3,4})m",
                  page,
                  re.I | re.S
              )

              distance_surface = (
                  distance_match.group(1)
                  if distance_match
                  else ""
              )

              distance = (
                  int(distance_match.group(2))
                  if distance_match
                  else None
              )


              horses = parse_horses(
                  page
              )


              return {
                  "token": token,

                  "url":
                      ACCESS
                      + "?CNAME="
                      + urllib.parse.quote(
                          token,
                          safe=""
                      ),

                  "race_number": race_no,

                  "title": title,

                  "surface":
                      distance_surface,

                  "distance":
                      distance,

                  "horses":
                      horses,
              }


          # ============================================================
          # FETCH RACE PAGES
          # ============================================================

          print("")
          print("=" * 70)
          print("FETCH TARGET RACE PAGES")
          print("=" * 70)


          races = []

          failures = []


          for index, token in enumerate(
              race_tokens,
              start=1
          ):

              print("")
              print(
                  f"RACE {index}/{len(race_tokens)}"
              )

              print(
                  token
              )


              url = (
                  ACCESS
                  + "?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )


              try:

                  page = get_html(
                      url,
                      ACCESS
                  )

                  print(
                      "  HTML:",
                      len(page)
                  )


                  race = parse_race(
                      token,
                      page
                  )


                  print(
                      "  HORSES:",
                      len(race["horses"])
                  )


                  if len(race["horses"]) == 0:

                      print(
                          "  WARNING: 馬データ0件"
                      )


                  races.append(
                      race
                  )


              except Exception as exc:

                  print(
                      "  ERROR:",
                      str(exc)
                  )

                  failures.append(
                      {
                          "token": token,
                          "error": str(exc)
                      }
                  )


              # Be polite to JRA.
              time.sleep(0.2)


          # ============================================================
          # VALIDATE FETCH RESULT
          # ============================================================

          print("")
          print("=" * 70)
          print("FETCH RESULT")
          print("=" * 70)

          print(
              "RACE TOKENS:",
              len(race_tokens)
          )

          print(
              "RACES FETCHED:",
              len(races)
          )

          print(
              "FAILURES:",
              len(failures)
          )


          if len(races) == 0:

              raise RuntimeError(
                  "JRAレースページを1件も取得できませんでした。"
              )


          # On a normal weekend, do not publish a partial dataset.

          if weekday in (5, 6):

              if len(races) < 36:

                  raise RuntimeError(
                      "週末の取得レース数が36未満です。"
                      f"取得={len(races)}"
                  )


          # ============================================================
          # VENUE COUNTS
          # ============================================================

          venue_counts = {}

          for token in race_tokens:

              body = token[
                  len("pw01dde"):
              ]

              venue = body[2:4]

              venue_counts[venue] = (
                  venue_counts.get(
                      venue,
                      0
                  ) + 1
              )


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {

              "date":
                  target_iso,

              "target_ymd":
                  target_ymd,

              "updated_at":
                  now.isoformat(),

              "source":
                  "JRA公式 accessD",

              "parser_version":
                  "11.0",

              "race_count":
                  len(races),

              "venue_counts":
                  venue_counts,

              "official_race_links":
                  [
                      race["url"]
                      for race in races
                  ],

              "races":
                  races,

              "failures":
                  failures,
          }


          output_path = Path(
              "data/jra_daily.json"
          )


          output_path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          print("")
          print("=" * 70)
          print("JRA JSON GENERATED")
          print("=" * 70)

          print(
              "FILE:",
              output_path
          )

          print(
              "SIZE:",
              output_path.stat().st_size
          )

          print(
              "RACES:",
              len(races)
          )

          print("=" * 70)


          # ============================================================
          # FINAL SAMPLE
          # ============================================================

          print("")
          print("SAMPLE:")

          for race in races[:3]:

              print(
                  race["race_number"],
                  race["title"],
                  "horses=",
                  len(race["horses"])
              )

          print("")


          PY


      # ============================================================
      # VALIDATE JSON
      # ============================================================

      - name: Validate generated JRA JSON
        shell: bash
        run: |

          set -euo pipefail

          test -f data/jra_daily.json

          python3 - <<'PY'

          import json
          from pathlib import Path

          path = Path("data/jra_daily.json")

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          races = data.get(
              "races",
              []
          )

          print(
              "JSON OK"
          )

          print(
              "Date:",
              data.get("date")
          )

          print(
              "Race count:",
              len(races)
          )

          if not races:
              raise SystemExit(
                  "races が空です"
              )

          horse_count = sum(
              len(
                  race.get(
                      "horses",
                      []
                  )
              )
              for race in races
          )

          print(
              "Horse records:",
              horse_count
          )

          PY


      # ============================================================
      # COMMIT JRA DATA
      # ============================================================

      - name: Commit JRA data
        shell: bash
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jra_daily.json

          if git diff --cached --quiet; then

            echo "No JRA data changes."

          else

            git commit -m "Update JRA race data"

            git push

          fi


      # ============================================================
      # UPLOAD PAGES ARTIFACT
      # ============================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # POST CHECKOUT
      # ============================================================

      - name: Post Checkout
        if: always()
        uses: actions/checkout@v4
