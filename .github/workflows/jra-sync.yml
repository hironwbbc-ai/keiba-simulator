name: JRA Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jra-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JRA diagnostic data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import requests
          import re
          import html
          import os
          from urllib.parse import quote
          from datetime import datetime, timezone, timedelta

          # ============================================================
          # 基本設定
          # ============================================================

          BASE = "https://www.jra.go.jp"
          ACCESSD = BASE + "/JRADB/accessD.html"
          ENTRY_TOKEN = "pw01dli00/F3"

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          print("=" * 80)
          print("JRA DIAGNOSTIC")
          print("=" * 80)
          print("JST:", now.strftime("%Y-%m-%d %H:%M:%S"))

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",

              "Accept-Language":
                  "ja,en-US;q=0.9,en;q=0.8",

              "Connection":
                  "keep-alive"
          })


          # ============================================================
          # レスポンスを文字列へ
          # ============================================================

          def decode_response(response):

              enc = response.encoding

              if not enc:
                  enc = response.apparent_encoding

              if not enc:
                  enc = "utf-8"

              try:
                  return response.content.decode(
                      enc,
                      errors="replace"
                  )
              except Exception:
                  return response.text


          # ============================================================
          # HTML → テキスト
          #
          # 診断用なので、
          # 「元HTML」と「タグを除去したテキスト」の両方を保存する。
          # ============================================================

          def html_to_text(page_html):

              text = page_html

              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<br\s*/?>",
                  "\n",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"</(?:p|div|li|tr|h[1-6]|dt|dd)>",
                  "\n",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(text)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"[ \t]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\n\s*\n+",
                  "\n",
                  text
              )

              return text.strip()


          # ============================================================
          # HTML → セル構造をなるべく残したテキスト
          #
          # ここが今回の重要な診断ポイント。
          #
          # td / th の終了位置を | にすることで、
          # JRAの表の「セル境界」を残す。
          # ============================================================

          def html_to_cells(page_html):

              text = page_html

              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<br\s*/?>",
                  " ",
                  text,
                  flags=re.I
              )

              # セル終了
              text = re.sub(
                  r"</(?:td|th)>",
                  " | ",
                  text,
                  flags=re.I
              )

              # 行終了
              text = re.sub(
                  r"</tr>",
                  "\n",
                  text,
                  flags=re.I
              )

              # その他タグ
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(text)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"[ \t]+",
                  " ",
                  text
              )

              lines = []

              for line in text.splitlines():

                  line = line.strip()

                  if line:
                      lines.append(line)

              return lines


          # ============================================================
          # JRA入口
          # ============================================================

          print()
          print("[1] ACCESS JRA")

          response = session.post(
              ACCESSD,
              data={
                  "cname": ENTRY_TOKEN
              },
              timeout=30,
              allow_redirects=True
          )

          entry_html = decode_response(
              response
          )

          print(
              "HTTP:",
              response.status_code
          )

          print(
              "URL:",
              response.url
          )

          print(
              "HTML LENGTH:",
              len(entry_html)
          )


          # ============================================================
          # レースtoken発見
          # ============================================================

          race_pattern = re.compile(
              r"/JRADB/accessD\.html\?CNAME="
              r"(pw01dde[0-9A-Za-z]+/[0-9A-Fa-f]{2})"
          )

          tokens = set(
              race_pattern.findall(
                  entry_html
              )
          )

          print(
              "INITIAL TOKENS:",
              len(tokens)
          )


          # ============================================================
          # 再帰探索
          # ============================================================

          queue = list(tokens)
          visited = set()

          while queue and len(visited) < 100:

              token = queue.pop(0)

              if token in visited:
                  continue

              visited.add(token)

              try:

                  url = (
                      ACCESSD
                      + "?CNAME="
                      + quote(
                          token,
                          safe=""
                      )
                  )

                  r = session.get(
                      url,
                      timeout=30,
                      allow_redirects=True
                  )

                  page = decode_response(
                      r
                  )

                  new_tokens = race_pattern.findall(
                      page
                  )

                  for new_token in new_tokens:

                      if new_token not in tokens:

                          tokens.add(
                              new_token
                          )

                          queue.append(
                              new_token
                          )

              except Exception as e:

                  print(
                      "DISCOVERY WARNING:",
                      token,
                      repr(e)
                  )


          print(
              "TOTAL TOKENS:",
              len(tokens)
          )


          # ============================================================
          # 2026-09-06 の札幌1Rを探す
          # ============================================================

          target_date = now.strftime(
              "%Y%m%d"
          )

          target_token = None

          for token in sorted(tokens):

              if (
                  target_date in token
                  and "01012026" in token
                  and "01" in token[-5:-3]
              ):

                  target_token = token

                  break


          # 上記の判定で見つからない場合、
          # 日付一致 + venue code 01 + race 01 を正式に判定する。
          if target_token is None:

              token_pattern = re.compile(
                  r"^pw01dde"
                  r"[0-9A-Za-z]{2}"
                  r"(?P<venue>[0-9]{2})"
                  r"(?P<year>[0-9]{4})"
                  r"(?P<meeting>[0-9]{4})"
                  r"(?P<race>[0-9]{2})"
                  r"(?P<date>[0-9]{8})"
                  r"/[0-9A-Fa-f]{2}$"
              )

              for token in sorted(tokens):

                  m = token_pattern.match(
                      token
                  )

                  if not m:
                      continue

                  if (
                      m.group("venue") == "01"
                      and m.group("race") == "01"
                      and m.group("date") == target_date
                  ):

                      target_token = token

                      break


          # ============================================================
          # 万一札幌1Rが見つからなければ、
          # 日付一致の最初のレースを診断対象にする。
          # ============================================================

          if target_token is None:

              print()
              print(
                  "WARNING: 札幌1Rを直接発見できませんでした。"
              )

              date_tokens = []

              token_pattern = re.compile(
                  r"^pw01dde"
                  r"[0-9A-Za-z]{2}"
                  r"(?P<venue>[0-9]{2})"
                  r"(?P<year>[0-9]{4})"
                  r"(?P<meeting>[0-9]{4})"
                  r"(?P<race>[0-9]{2})"
                  r"(?P<date>[0-9]{8})"
                  r"/[0-9A-Fa-f]{2}$"
              )

              for token in sorted(tokens):

                  m = token_pattern.match(
                      token
                  )

                  if (
                      m
                      and m.group("date") == target_date
                  ):

                      date_tokens.append(
                          token
                      )

              if date_tokens:

                  target_token = date_tokens[0]

              else:

                  raise RuntimeError(
                      "対象日レースtokenを発見できませんでした"
                  )


          # ============================================================
          # 対象ページ取得
          # ============================================================

          target_url = (
              ACCESSD
              + "?CNAME="
              + quote(
                  target_token,
                  safe=""
              )
          )

          print()
          print("=" * 80)
          print("TARGET")
          print("=" * 80)

          print(
              "TOKEN:",
              target_token
          )

          print(
              "URL:",
              target_url
          )


          race_response = session.get(
              target_url,
              timeout=30,
              allow_redirects=True
          )

          race_html = decode_response(
              race_response
          )


          print(
              "HTTP:",
              race_response.status_code
          )

          print(
              "FINAL URL:",
              race_response.url
          )

          print(
              "CONTENT TYPE:",
              race_response.headers.get(
                  "Content-Type"
              )
          )

          print(
              "ENCODING:",
              race_response.encoding
          )

          print(
              "APPARENT ENCODING:",
              race_response.apparent_encoding
          )

          print(
              "HTML LENGTH:",
              len(race_html)
          )


          # ============================================================
          # デバッグディレクトリ
          # ============================================================

          debug_dir = "jra_debug"

          os.makedirs(
              debug_dir,
              exist_ok=True
          )


          # ============================================================
          # 1. 生HTML
          # ============================================================

          raw_path = os.path.join(
              debug_dir,
              "sapporo1r_raw.html"
          )

          with open(
              raw_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  race_html
              )


          # ============================================================
          # 2. タグ除去後テキスト
          # ============================================================

          plain_text = html_to_text(
              race_html
          )

          text_path = os.path.join(
              debug_dir,
              "sapporo1r_text.txt"
          )

          with open(
              text_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  plain_text
              )


          # ============================================================
          # 3. セル境界保持テキスト
          # ============================================================

          cell_lines = html_to_cells(
              race_html
          )

          cells_path = os.path.join(
              debug_dir,
              "sapporo1r_cells.txt"
          )

          with open(
              cells_path,
              "w",
              encoding="utf-8"
          ) as f:

              for i, line in enumerate(
                  cell_lines,
                  1
              ):

                  f.write(
                      f"{i:04d}: {line}\n"
                  )


          # ============================================================
          # 4. 馬名・オッズ候補を機械的に検索
          #
          # 今回は「正しい解析」はまだ行わない。
          # いろいろなパターンが実際に存在するかを調査する。
          # ============================================================

          diagnostic_path = os.path.join(
              debug_dir,
              "diagnostic.txt"
          )


          with open(
              diagnostic_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "JRA DIAGNOSTIC\n"
              )

              f.write(
                  "=" * 80
                  + "\n\n"
              )

              f.write(
                  "TARGET TOKEN:\n"
              )

              f.write(
                  target_token
                  + "\n\n"
              )

              f.write(
                  "TARGET URL:\n"
              )

              f.write(
                  target_url
                  + "\n\n"
              )

              f.write(
                  f"HTTP STATUS: {race_response.status_code}\n"
              )

              f.write(
                  f"HTML LENGTH: {len(race_html)}\n\n"
              )


              # --------------------------------------------------------
              # パターンA
              # 馬名＋オッズ＋人気
              # --------------------------------------------------------

              patterns = {

                  "A_name_odds_popularity":
                      r"([一-龯ぁ-んァ-ヶー々A-Za-z0-9・．ー]+)"
                      r"\s*"
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"\s*\(\s*"
                      r"([0-9]+)"
                      r"\s*番人気",

                  "B_weight":
                      r"([0-9]{3})kg\s*\(\s*([+-]?[0-9]+|初出走)\s*\)",

                  "C_sex_age":
                      r"([牡牝セ騙])([0-9]{1,2})",

                  "D_carried_weight":
                      r"([0-9]{2}(?:\.[0-9])?)\s*kg"
              }


              for name, pattern in patterns.items():

                  f.write(
                      "\n"
                      + "-" * 80
                      + "\n"
                  )

                  f.write(
                      name
                      + "\n"
                  )

                  f.write(
                      "-" * 80
                      + "\n"
                  )

                  found = list(
                      re.finditer(
                          pattern,
                          plain_text
                      )
                  )

                  f.write(
                      f"COUNT: {len(found)}\n\n"
                  )

                  for match in found[:50]:

                      f.write(
                          repr(
                              match.group(0)
                          )
                          + "\n"
                      )


              # --------------------------------------------------------
              # 「番人気」が含まれる行
              # --------------------------------------------------------

              f.write(
                  "\n"
                  + "=" * 80
                  + "\n"
              )

              f.write(
                  "LINES CONTAINING 番人気\n"
              )

              f.write(
                  "=" * 80
                  + "\n\n"
              )

              for i, line in enumerate(
                  plain_text.splitlines(),
                  1
              ):

                  if "番人気" in line:

                      f.write(
                          f"{i:04d}: {line}\n"
                      )


              # --------------------------------------------------------
              # 「kg」が含まれる行
              # --------------------------------------------------------

              f.write(
                  "\n"
                  + "=" * 80
                  + "\n"
              )

              f.write(
                  "LINES CONTAINING kg\n"
              )

              f.write(
                  "=" * 80
                  + "\n\n"
              )

              for i, line in enumerate(
                  plain_text.splitlines(),
                  1
              ):

                  if "kg" in line:

                      f.write(
                          f"{i:04d}: {line}\n"
                      )


              # --------------------------------------------------------
              # セル構造のうち「番人気」を含む行
              # --------------------------------------------------------

              f.write(
                  "\n"
                  + "=" * 80
                  + "\n"
              )

              f.write(
                  "CELL LINES CONTAINING 番人気\n"
              )

              f.write(
                  "=" * 80
                  + "\n\n"
              )

              for line in cell_lines:

                  if "番人気" in line:

                      f.write(
                          line
                          + "\n"
                      )


          # ============================================================
          # 5. コンソールにも重要部分を出す
          # ============================================================

          print()
          print("=" * 80)
          print("DIAGNOSTIC SEARCH")
          print("=" * 80)


          print()
          print(
              "[番人気を含むテキスト]"
          )

          count = 0

          for i, line in enumerate(
              plain_text.splitlines(),
              1
          ):

              if "番人気" in line:

                  print(
                      f"{i:04d}: {line[:1000]}"
                  )

                  count += 1

                  if count >= 30:
                      break


          print()
          print(
              "[kgを含むテキスト]"
          )

          count = 0

          for i, line in enumerate(
              plain_text.splitlines(),
              1
          ):

              if "kg" in line:

                  print(
                      f"{i:04d}: {line[:1000]}"
                  )

                  count += 1

                  if count >= 30:
                      break


          print()
          print(
              "[セル境界保持テキスト：番人気]"
          )

          count = 0

          for line in cell_lines:

              if "番人気" in line:

                  print(
                      line[:1500]
                  )

                  count += 1

                  if count >= 30:
                      break


          # ============================================================
          # 6. 先頭部分も保存
          # ============================================================

          preview_path = os.path.join(
              debug_dir,
              "sapporo1r_preview.txt"
          )

          with open(
              preview_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  plain_text[:30000]
              )


          print()
          print("=" * 80)
          print("FILES CREATED")
          print("=" * 80)

          print(
              raw_path
          )

          print(
              text_path
          )

          print(
              cells_path
          )

          print(
              diagnostic_path
          )

          print(
              preview_path
          )

          print()
          print(
              "DIAGNOSTIC FINISHED"
          )

          PY


      # ================================================================
      # 診断ファイルをArtifactsとして保存
      # ================================================================

      - name: Upload JRA diagnostic files
        uses: actions/upload-artifact@v4
        with:
          name: jra-diagnostic
          path: jra_debug/
          if-no-files-found: error
          retention-days: 7
