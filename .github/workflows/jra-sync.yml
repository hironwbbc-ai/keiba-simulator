name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]

  schedule:
    # JST Saturday/Sunday 08:00
    - cron: "0 23 * * 5,6"

  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 (YYYYMMDD)。空欄なら今日(JST)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # PAGES
      # ============================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # JRA SYNC
      # ============================================================
      - name: Sync JRA official race pages
        shell: bash

        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}

        run: |

          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'

          import datetime
          import html
          import http.cookiejar
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo


          # ============================================================
          # BASIC SETTINGS
          # ============================================================

          BASE = "https://www.jra.go.jp"

          ACCESS = BASE + "/JRADB/accessD.html"

          ENTRY_TOKEN = "pw01dli00/F3"

          JST = ZoneInfo("Asia/Tokyo")

          UA = (
              "Mozilla/5.0 "
              "(Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/140.0 Safari/537.36"
          )


          # ============================================================
          # DATE
          # ============================================================

          now = datetime.datetime.now(JST)

          requested = os.environ.get(
              "RACE_DATE_INPUT",
              ""
          ).strip()

          if requested:

              if not re.fullmatch(
                  r"\d{8}",
                  requested
              ):
                  raise RuntimeError(
                      "race_date は YYYYMMDD 形式で指定してください"
                  )

              target_ymd = requested

          else:

              target_ymd = now.strftime("%Y%m%d")


          target_date = datetime.datetime.strptime(
              target_ymd,
              "%Y%m%d"
          ).date()

          target_date_iso = target_date.isoformat()


          print("")
          print("=" * 70)
          print("JRA SYNC")
          print("=" * 70)

          print("TARGET DATE :", target_ymd)
          print("TARGET ISO  :", target_date_iso)

          print("=" * 70)
          print("")


          # ============================================================
          # HTTP SESSION
          # ============================================================

          cookie_jar = http.cookiejar.CookieJar()

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookie_jar)
          )


          def request_bytes(
              url,
              method="GET",
              data=None,
              referer=None
          ):

              headers = {
                  "User-Agent": UA,

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8",

                  "Accept-Language":
                      "ja,en-US;q=0.9,en;q=0.8",

                  "Cache-Control":
                      "no-cache",

                  "Pragma":
                      "no-cache",
              }

              if referer:
                  headers["Referer"] = referer

              if method == "POST":

                  headers["Content-Type"] = (
                      "application/x-www-form-urlencoded"
                  )

                  headers["Origin"] = BASE

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              with opener.open(
                  req,
                  timeout=45
              ) as response:

                  return response.read()


          def decode_jra(raw):

              # JRA pages are primarily Shift_JIS / CP932.

              for encoding in (
                  "cp932",
                  "shift_jis",
                  "utf-8"
              ):

                  try:

                      text = raw.decode(
                          encoding
                      )

                      if (
                          "<html" in text.lower()
                          or "JRADB" in text
                          or "accessD" in text
                      ):
                          return text

                  except UnicodeDecodeError:
                      pass

              return raw.decode(
                  "cp932",
                  "replace"
              )


          def get_html(
              url,
              referer=None
          ):

              raw = request_bytes(
                  url,
                  "GET",
                  None,
                  referer
              )

              return decode_jra(raw)


          def post_cname(
              token,
              referer=None
          ):

              body = urllib.parse.urlencode(
                  {
                      "cname": token
                  }
              ).encode("ascii")

              raw = request_bytes(
                  ACCESS,
                  "POST",
                  body,
                  referer
              )

              return decode_jra(raw)


          # ============================================================
          # TOKEN REGEX
          # ============================================================

          # Exact JRA race token.
          #
          # Example:
          #
          # pw01dde0101202602060120260906/6A
          #
          # Structure:
          #
          # pw01dde
          # + 2 chars
          # + venue 2 digits
          # + meeting/day 4 digits
          # + race 2 digits
          # + date 8 digits
          # + /XX
          #

          RACE_TOKEN_RE = re.compile(
              r"pw01dde"
              r"[0-9A-Za-z]{22}"
              r"(?:/|%2F)"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          # Generic navigation TOKEN.
          #
          # We deliberately do NOT limit this to pw01dli/pw01dde.
          # JRA may expose other pw01d* access tokens.

          GENERIC_TOKEN_RE = re.compile(
              r"pw01d"
              r"[0-9A-Za-z]+"
              r"(?:
