name: JRA data sync and Pages deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 0-8 * * 6,0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync JRA official daily calendar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import datetime, json, re, urllib.request
          from zoneinfo import ZoneInfo

          now=datetime.datetime.now(ZoneInfo("Asia/Tokyo"))
          y=now.strftime("%Y"); m=now.strftime("%m"); d=now.strftime("%d")
          url=f"https://www.jra.go.jp/keiba/calendar{y}/{y}/{int(m)}/{m}{d}.html"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          html=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")

          links=[]
          for h in re.findall(r'href=["\']([^"\']+)["\']',html,re.I):
              if "accessD.html" in h:
                  if h.startswith("/"): h="https://www.jra.go.jp"+h
                  elif h.startswith("./"): h=f"https://www.jra.go.jp/keiba/calendar{y}/{y}/{int(m)}/{h[2:]}"
                  if h.startswith("http"): links.append(h)

          obj={"date":now.strftime("%Y-%m-%d"),
               "updated_at":now.isoformat(),
               "calendar_url":url,
               "official_race_links":sorted(set(links)),
               "source":"JRA公式開催日程"}

          with open("data/jra_daily.json","w",encoding="utf-8") as f:
              json.dump(obj,f,ensure_ascii=False,indent=2)
          print(json.dumps(obj,ensure_ascii=False,indent=2))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
