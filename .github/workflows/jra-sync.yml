name: JRA Daily Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 5"
    - cron: "0 23 * * 6"

permissions:
  contents: write

jobs:
  jra-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and parse JRA
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import html as htmlmod
          from urllib.parse import quote
          from datetime import datetime, timezone, timedelta

          BASE = "https://www.jra.go.jp"
          ENTRY_TOKEN = "pw01dli00/F3"
          ACCESSD = BASE + "/JRADB/accessD.html"

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          print("=" * 70)
          print("JRA DAILY SYNC")
          print("=" * 70)
          print("JST:", now.strftime("%Y-%m-%d %H:%M:%S"))

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1",
              "Accept":
                  "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language":
                  "ja-JP,ja;q=0.9"
          })

          def decode(r):
              enc = r.apparent_encoding or "utf-8"

              try:
                  return r.content.decode(
                      enc,
                      errors="replace"
                  )
              except Exception:
                  return r.text

          def clean_text(s):
              s = htmlmod.unescape(s)

              s = re.sub(
                  r"(?is)<script.*?</script>",
                  " ",
                  s
              )

              s = re.sub(
                  r"(?is)<style.*?</style>",
                  " ",
                  s
              )

              s = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  s
              )

              s = re.sub(
                  r"\s+",
                  " ",
                  s
              )

              return s.strip()

          # ============================================================
          # 1. JRA 出馬表入口
          # ============================================================

          print()
          print("[1] JRA ENTRY")

          try:
              r = session.post(
                  ACCESSD,
                  data={
                      "cname": ENTRY_TOKEN
                  },
                  timeout=30,
                  allow_redirects=True
              )

              entry_html = decode(r)

              print("STATUS:", r.status_code)
              print("URL:", r.url)
              print("BYTES:", len(r.content))

          except Exception as e:
              raise RuntimeError(
                  "JRA出馬表入口の取得に失敗しました: "
                  + repr(e)
              )

          # ============================================================
          # 2. accessD レースURLを抽出
          # ============================================================

          race_pattern = re.compile(
              r'/JRADB/accessD\.html\?CNAME='
              r'(pw01dde[0-9A-Za-z]+/[0-9A-Fa-f]{2})'
          )

          race_tokens = set(
              race_pattern.findall(entry_html)
          )

          print()
          print(
              "[2] ENTRY RACE TOKENS:",
              len(race_tokens)
          )

          # 入口ページだけで足りない場合に備えて巡回
          queue = list(race_tokens)
          visited = set()

          while queue and len(visited) < 100:

              token = queue.pop(0)

              if token in visited:
                  continue

              visited.add(token)

              try:

                  url = (
                      ACCESSD
                      + "?CNAME="
                      + quote(token, safe="")
                  )

                  rr = session.get(
                      url,
                      timeout=30,
                      allow_redirects=True
                  )

                  hh = decode(rr)

                  found = race_pattern.findall(hh)

                  for x in found:

                      if x not in race_tokens:

                          race_tokens.add(x)
                          queue.append(x)

              except Exception as e:

                  print(
                      "DISCOVERY WARNING:",
                      token,
                      repr(e)
                  )

          print(
              "TOTAL DISCOVERED TOKENS:",
              len(race_tokens)
          )

          # ============================================================
          # 3. 対象日
          # ============================================================

          target_date = now.strftime("%Y%m%d")

          target_tokens = []

          for token in sorted(race_tokens):

              if target_date in token:

                  target_tokens.append(token)

          print()
          print(
              "TARGET DATE:",
              target_date
          )

          print(
              "TARGET RACES:",
              len(target_tokens)
          )

          # ============================================================
          # 4. race token解析
          # ============================================================

          race_info_pattern = re.compile(
              r'^pw01dde'
              r'(?P<prefix>[0-9A-Za-z]{2})'
              r'(?P<venue>[0-9]{2})'
              r'(?P<year>[0-9]{4})'
              r'(?P<meeting>[0-9]{4})'
              r'(?P<race>[0-9]{2})'
              r'(?P<date>[0-9]{8})'
          )

          venue_names = {
              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉"
          }

          def parse_token(token):

              m = race_info_pattern.search(token)

              if not m:
                  return None

              d = m.groupdict()

              venue_code = d["venue"]

              return {
                  "venue_code": venue_code,
                  "venue": venue_names.get(
                      venue_code,
                      venue_code
                  ),
                  "year": int(d["year"]),
                  "meeting": d["meeting"],
                  "race_number": int(d["race"]),
                  "date": d["date"],
                  "token": token
              }

          # ============================================================
          # 5. 現在の馬ヘッダーパターン
          # ============================================================

          horse_header = re.compile(
              r'(?<!\d)'
              r'(?P<number>1[0-8]|[1-9])'
              r'\s+'
              r'(?P<name>.+?)'
              r'\s+'
              r'(?P<odds>[0-9]+(?:\.[0-9]+)?)'
              r'\s*'
              r'\('
              r'\s*'
              r'(?P<popularity>[0-9]+)'
              r'\s*番人気'
              r'\s*'
              r'\)'
              r'\s+'
              r'(?P<weight>[0-9]{3})kg'
              r'\s*'
              r'\('
              r'(?P<weight_diff>[+\-−±]?[0-9]+)'
              r'\)'
          )

          def to_int(s):

              try:

                  return int(
                      s.replace(
                          "−",
                          "-"
                      )
                  )

              except:

                  return None

          def to_float(s):

              try:

                  return float(s)

              except:

                  return None

          # ============================================================
          # 6. 馬データ抽出
          # ============================================================

          def parse_horses(page_html):

              text = clean_text(page_html)

              matches = list(
                  horse_header.finditer(text)
              )

              horses = []

              for i, m in enumerate(matches):

                  number = int(
                      m.group("number")
                  )

                  start = m.start()

                  end = (
                      matches[i + 1].start()
                      if i + 1 < len(matches)
                      else len(text)
                  )

                  block = text[
                      start:end
                  ]

                  name = m.group(
                      "name"
                  ).strip()

                  odds = to_float(
                      m.group("odds")
                  )

                  popularity = int(
                      m.group("popularity")
                  )

                  weight = int(
                      m.group("weight")
                  )

                  weight_diff = to_int(
                      m.group("weight_diff")
                  )

                  sex_age = None

                  sex_age_match = re.search(
                      r'([牡牝セ騙])([0-9]+)',
                      block
                  )

                  if sex_age_match:

                      sex_age = (
                          sex_age_match.group(1)
                          + sex_age_match.group(2)
                      )

                  carried_weight = None
                  jockey = None

                  carried_match = re.search(
                      r'([0-9]{2}(?:\.[0-9])?)\s*kg'
                      r'\s+'
                      r'(?:★|▲|△|◇|☆)?'
                      r'\s*'
                      r'([^0-9]{1,30}?)'
                      r'\s+'
                      r'202[0-9]年',
                      block
                  )

                  if carried_match:

                      carried_weight = to_float(
                          carried_match.group(1)
                      )

                      jockey = (
                          carried_match.group(2)
                          .strip()
                      )

                  if jockey is None:

                      jockey_match = re.search(
                          r'([0-9]{2}(?:\.[0-9])?)\s*kg\s+'
                          r'([^0-9]{1,30}?)\s+'
                          r'202[0-9]年',
                          block
                      )

                      if jockey_match:

                          carried_weight = to_float(
                              jockey_match.group(1)
                          )

                          jockey = (
                              jockey_match.group(2)
                              .strip()
                          )

                  horses.append({
                      "number": number,
                      "name": name,
                      "odds": odds,
                      "popularity": popularity,
                      "body_weight": weight,
                      "body_weight_diff": weight_diff,
                      "sex_age": sex_age,
                      "carried_weight": carried_weight,
                      "jockey": jockey
                  })

              # 重複除去
              unique = {}

              for horse in horses:

                  n = horse["number"]

                  if n not in unique:

                      unique[n] = horse

              horses = [
                  unique[n]
                  for n in sorted(unique)
              ]

              return horses

          # ============================================================
          # 7. 診断用
          # ============================================================

          def diagnostic_output(
              page_html,
              venue,
              race_no
          ):

              text = clean_text(page_html)

              print()
              print("=" * 70)
              print(
                  "HORSE PARSER DIAGNOSTIC"
              )
              print("=" * 70)

              print(
                  "FAILED RACE:",
                  f"{venue}{race_no}R"
              )

              print(
                  "TEXT LENGTH:",
                  len(text)
              )

              print(
                  "HTML LENGTH:",
                  len(page_html)
              )

              # --------------------------------------------------------
              # 馬番候補
              # --------------------------------------------------------

              possible = list(
                  re.finditer(
                      r'(?<!\d)(?:1[0-8]|[1-9])\s+',
                      text
                  )
              )

              print()
              print(
                  "POSSIBLE HORSE STARTS:",
                  len(possible)
              )

              # --------------------------------------------------------
              # 最初の15候補を表示
              # --------------------------------------------------------

              for i, dm in enumerate(
                  possible[:15],
                  1
              ):

                  start = max(
                      0,
                      dm.start() - 80
                  )

                  end = min(
                      len(text),
                      dm.start() + 500
                  )

                  snippet = text[
                      start:end
                  ]

                  print()
                  print(
                      f"--- CANDIDATE {i} ---"
                  )

                  print(snippet)

              # --------------------------------------------------------
              # JRA関連キーワード
              # --------------------------------------------------------

              for keyword in [
                  "馬名",
                  "オッズ",
                  "馬体重",
                  "騎手",
                  "単勝",
                  "人気"
              ]:

                  positions = [
                      m.start()
                      for m in re.finditer(
                          re.escape(keyword),
                          text
                      )
                  ]

                  if not positions:
                      continue

                  print()
                  print(
                      f"--- KEYWORD: {keyword} "
                      f"({len(positions)} matches) ---"
                  )

                  pos = positions[0]

                  start = max(
                      0,
                      pos - 200
                  )

                  end = min(
                      len(text),
                      pos + 1500
                  )

                  print(
                      text[
                          start:end
                      ]
                  )

              # --------------------------------------------------------
              # 現在のhorse_headerが何も拾えないことを確認
              # --------------------------------------------------------

              print()
              print(
                  "CURRENT HORSE HEADER MATCHES:",
                  len(
                      list(
                          horse_header.finditer(
                              text
                          )
                      )
                  )
              )

              print()
              print("=" * 70)
              print(
                  "END HORSE PARSER DIAGNOSTIC"
              )
              print("=" * 70)

          # ============================================================
          # 8. レース取得
          # ============================================================

          races = []

          failures = []

          venue_count = {}

          sorted_tokens = sorted(
              target_tokens,
              key=lambda x: (
                  parse_token(x)["venue_code"],
                  parse_token(x)["race_number"]
              )
          )

          for index, token in enumerate(
              sorted_tokens,
              1
          ):

              info = parse_token(token)

              if info is None:
                  continue

              venue = info["venue"]
              race_no = info["race_number"]

              print()
              print(
                  f"[{index}/{len(sorted_tokens)}] "
                  f"{venue}{race_no}R"
              )

              url = (
                  ACCESSD
                  + "?CNAME="
                  + quote(token, safe="")
              )

              try:

                  rr = session.get(
                      url,
                      timeout=30,
                      allow_redirects=True
                  )

                  hh = decode(rr)

                  print(
                      "HTTP:",
                      rr.status_code,
                      "BYTES:",
                      len(rr.content)
                  )

                  horses = parse_horses(hh)

                  print(
                      "HORSES:",
                      len(horses)
                  )

                  if len(horses) == 0:

                      # ==================================================
                      # 失敗レースの詳細診断
                      # ==================================================

                      diagnostic_output(
                          hh,
                          venue,
                          race_no
                      )

                      failures.append({
                          "venue": venue,
                          "race_number": race_no,
                          "url": url,
                          "reason":
                              "horse parser returned 0"
                      })

                      continue

                  venue_count[venue] = (
                      venue_count.get(
                          venue,
                          0
                      ) + 1
                  )

                  races.append({
                      "date": info["date"],
                      "venue": venue,
                      "venue_code": info["venue_code"],
                      "race_number": race_no,
                      "token": token,
                      "official_url": url,
                      "horses": horses
                  })

              except Exception as e:

                  print(
                      "ERROR:",
                      repr(e)
                  )

                  failures.append({
                      "venue": venue,
                      "race_number": race_no,
                      "url": url,
                      "reason": repr(e)
                  })

          # ============================================================
          # 9. 結果
          # ============================================================

          print()
          print("=" * 70)
          print("RESULT")
          print("=" * 70)

          print(
              "TOTAL RACES:",
              len(races)
          )

          print(
              "FAILURES:",
              len(failures)
          )

          for venue in [
              "札幌",
              "中山",
              "阪神"
          ]:

              print(
                  venue,
                  ":",
                  venue_count.get(
                      venue,
                      0
                  ),
                  "/12"
              )

          # ============================================================
          # 10. JSON保存
          # ============================================================

          output = {
              "updated_at": now.isoformat(),
              "date": target_date,
              "source": "JRA official",
              "race_count": len(races),
              "venue_count": venue_count,
              "races": races,
              "failures": failures
          }

          import os

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/jra_daily.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "JSON:",
              "data/jra_daily.json"
          )

          # ============================================================
          # 11. GitHub Actions Summary
          # ============================================================

          summary = []

          summary.append(
              "# JRA Daily Sync Result"
          )

          summary.append("")

          summary.append(
              f"- date: `{target_date}`"
          )

          summary.append(
              f"- races: `{len(races)}`"
          )

          summary.append(
              f"- failures: `{len(failures)}`"
          )

          summary.append("")

          summary.append(
              "## Venue"
          )

          for venue in [
              "札幌",
              "中山",
              "阪神"
          ]:

              summary.append(
                  f"- {venue}: "
                  f"{venue_count.get(venue, 0)}/12"
              )

          summary.append("")

          summary.append(
              "## Race horse counts"
          )

          for race in sorted(
              races,
              key=lambda x: (
                  x["venue_code"],
                  x["race_number"]
              )
          ):

              summary.append(
                  f"- {race['venue']}"
                  f"{race['race_number']}R: "
                  f"{len(race['horses'])}頭"
              )

          if failures:

              summary.append("")
              summary.append(
                  "## Failures"
              )

              for failure in failures:

                  summary.append(
                      f"- {failure['venue']}"
                      f"{failure['race_number']}R: "
                      f"{failure['reason']}"
                  )

          with open(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ],
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(summary)
              )

          # ============================================================
          # 12. 0件の場合のみエラー
          # ============================================================

          if len(races) == 0:

              raise RuntimeError(
                  "JRAのレースデータを1件も取得できませんでした。"
              )

          print()
          print("=" * 70)
          print(
              "JRA SYNC FINISHED"
          )
          print("=" * 70)

          PY

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jra_daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update JRA daily race data"
            git push
          fi
