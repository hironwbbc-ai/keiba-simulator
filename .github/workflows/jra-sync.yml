name: JRA Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: JRA connection diagnostic
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import unquote
          import re

          print("=" * 70)
          print("JRA CONNECTION / HTML DIAGNOSTIC")
          print("=" * 70)

          s = requests.Session()

          s.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1",
              "Accept":
                  "text/html,application/xhtml+xml,application/xml;q=0.9,"
                  "*/*;q=0.8",
              "Accept-Language": "ja-JP,ja;q=0.9",
          })

          # ------------------------------------------------------------
          # 1. JRAトップ
          # ------------------------------------------------------------

          print()
          print("STEP 1 : JRA TOP")
          print("-" * 70)

          url = "https://www.jra.go.jp/"

          try:
              r = s.get(
                  url,
                  timeout=30,
                  allow_redirects=True
              )

              print("STATUS       :", r.status_code)
              print("FINAL URL    :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))

              text = r.content.decode(
                  r.apparent_encoding or "utf-8",
                  errors="replace"
              )

              print("CHARACTERS   :", len(text))
              print("JRA          :", "JRA" in text)
              print("出馬表       :", "出馬表" in text)

          except Exception as e:
              print("ERROR:", repr(e))

          # ------------------------------------------------------------
          # 2. JRA calendar
          # ------------------------------------------------------------

          print()
          print("STEP 2 : JRA CALENDAR")
          print("-" * 70)

          calendar_url = (
              "https://www.jra.go.jp/keiba/calendar2026/"
              "2026/9/0906.html"
          )

          try:
              r = s.get(
                  calendar_url,
                  timeout=30
              )

              print("STATUS       :", r.status_code)
              print("URL          :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))

              text = r.content.decode(
                  r.apparent_encoding or "utf-8",
                  errors="replace"
              )

              print("CHARACTERS   :", len(text))

              for word in [
                  "札幌",
                  "中山",
                  "阪神",
                  "出馬表",
                  "9月6日"
              ]:
                  print(
                      f"{word:<10}:",
                      word in text
                  )

              print()
              print("CALENDAR TEXT PREVIEW")
              print(text[:3000])

          except Exception as e:
              print("ERROR:", repr(e))

          # ------------------------------------------------------------
          # 3. 既知の札幌1R公式URL
          # ------------------------------------------------------------

          print()
          print("STEP 3 : KNOWN SAPPORO 1R")
          print("-" * 70)

          race_url = (
              "https://www.jra.go.jp/JRADB/accessD.html?"
              "CNAME=pw01dde0101202602060120260906/XX"
          )

          print("TEST URL:", race_url)

          try:
              r = s.get(
                  race_url,
                  timeout=30,
                  allow_redirects=True
              )

              print("STATUS       :", r.status_code)
              print("FINAL URL    :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))

              text = r.content.decode(
                  r.apparent_encoding or "utf-8",
                  errors="replace"
              )

              print("CHARACTERS   :", len(text))

              print()
              print("KEYWORDS")

              for word in [
                  "出馬表",
                  "馬名",
                  "騎手",
                  "オッズ",
                  "馬体重",
                  "札幌",
                  "1R"
              ]:
                  print(
                      f"{word:<10}:",
                      word in text
                  )

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              print()
              print("TITLE")
              print(
                  soup.title.get_text(
                      " ",
                      strip=True
                  )
                  if soup.title
                  else "(NO TITLE)"
              )

              print()
              print("ALL LINKS CONTAINING accessD")
              print("-" * 70)

              count = 0

              for a in soup.find_all("a"):
                  href = a.get("href", "")
                  label = a.get_text(
                      " ",
                      strip=True
                  )

                  if "accessD" in href:
                      print(
                          "TEXT:",
                          label[:100]
                      )
                      print(
                          "HREF:",
                          href[:500]
                      )
                      print()

                      count += 1

                      if count >= 30:
                          break

              print(
                  "ACCESSD LINK COUNT:",
                  count
              )

              print()
              print("HTML TEXT PREVIEW")
              print("-" * 70)

              body = soup.get_text(
                  " ",
                  strip=True
              )

              print(body[:5000])

          except Exception as e:
              print("ERROR:", repr(e))

          # ------------------------------------------------------------
          # 4. app.jra.jp
          # ------------------------------------------------------------

          print()
          print("STEP 4 : APP.JRA.JP")
          print("-" * 70)

          app_url = "https://app.jra.jp/"

          try:
              r = s.get(
                  app_url,
                  timeout=30,
                  allow_redirects=True
              )

              print("STATUS       :", r.status_code)
              print("FINAL URL    :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))

              text = r.content.decode(
                  r.apparent_encoding or "utf-8",
                  errors="replace"
              )

              print("CHARACTERS   :", len(text))

              for word in [
                  "出馬表",
                  "馬名",
                  "騎手",
                  "オッズ"
              ]:
                  print(
                      f"{word:<10}:",
                      word in text
                  )

              print()
              print(text[:3000])

          except Exception as e:
              print("ERROR:", repr(e))

          # ------------------------------------------------------------
          # 5. sp.jra.jp
          # ------------------------------------------------------------

          print()
          print("STEP 5 : SP.JRA.JP")
          print("-" * 70)

          sp_url = "https://sp.jra.jp/"

          try:
              r = s.get(
                  sp_url,
                  timeout=30,
                  allow_redirects=True
              )

              print("STATUS       :", r.status_code)
              print("FINAL URL    :", r.url)
              print("CONTENT TYPE :", r.headers.get("content-type"))
              print("BYTES        :", len(r.content))

              text = r.content.decode(
                  r.apparent_encoding or "utf-8",
                  errors="replace"
              )

              print("CHARACTERS   :", len(text))

              for word in [
                  "出馬表",
                  "馬名",
                  "騎手",
                  "オッズ"
              ]:
                  print(
                      f"{word:<10}:",
                      word in text
                  )

              print()
              print(text[:3000])

          except Exception as e:
              print("ERROR:", repr(e))

          print()
          print("=" * 70)
          print("DIAGNOSTIC FINISHED")
          print("=" * 70)

          PY
