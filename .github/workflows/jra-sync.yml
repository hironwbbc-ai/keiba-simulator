name: JRA data sync and Pages deploy

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 23 * * 5,6"

  workflow_dispatch:
    inputs:
      race_date:
        description: "取得日 YYYYMMDD（例: 20260906）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  sync-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch JRA official data
        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}
        run: |

          set -euo pipefail

          mkdir -p data

          python3 - <<'PY'

          import datetime
          import html
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import http.cookiejar

          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo


          # ============================================================
          # SETTINGS
          # ============================================================

          BASE = "https://www.jra.go.jp"

          ACCESS_URL = (
              BASE +
              "/JRADB/accessD.html"
          )

          USER_AGENT = (
              "Mozilla/5.0 "
              "(iPhone; CPU iPhone OS 18_0 like Mac OS X) "
              "AppleWebKit/605.1.15 "
              "Version/18.0 Mobile/15E148 Safari/604.1"
          )

          JST = ZoneInfo(
              "Asia/Tokyo"
          )


          # ============================================================
          # DATE
          # ============================================================

          now = datetime.datetime.now(
              JST
          )

          input_date = os.environ.get(
              "RACE_DATE_INPUT",
              ""
          ).strip()


          if input_date:

              if not re.fullmatch(
                  r"\d{8}",
                  input_date
              ):

                  raise RuntimeError(
                      "race_date は YYYYMMDD 形式です"
                  )

              target_ymd = input_date

          else:

              target_ymd = now.strftime(
                  "%Y%m%d"
              )


          target_date = datetime.datetime.strptime(
              target_ymd,
              "%Y%m%d"
          ).date()


          target_iso = target_date.isoformat()


          print("")
          print("=" * 70)
          print("JRA SYNC")
          print("=" * 70)
          print("TARGET DATE :", target_ymd)
          print("TARGET ISO  :", target_iso)
          print("=" * 70)
          print("")


          # ============================================================
          # HTTP
          # ============================================================

          cookies = http.cookiejar.CookieJar()

          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(
                  cookies
              )
          )


          def fetch(
              url,
              method="GET",
              data=None,
              referer=None
          ):

              headers = {
                  "User-Agent":
                      USER_AGENT,

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml,"
                      "application/xml;q=0.9,"
                      "*/*;q=0.8",

                  "Accept-Language":
                      "ja,en-US;q=0.8,en;q=0.5",

                  "Connection":
                      "keep-alive",
              }


              if referer:

                  headers["Referer"] = (
                      referer
                  )


              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )


              with opener.open(
                  request,
                  timeout=60
              ) as response:

                  return response.read()


          def decode_jra(
              raw
          ):

              # JRAはShift_JIS系。
              # CP932を最優先にする。

              for encoding in (
                  "cp932",
                  "shift_jis",
                  "utf-8"
              ):

                  try:

                      text = raw.decode(
                          encoding
                      )

                      if (
                          "<html" in
                          text.lower()
                          or "JRADB" in text
                      ):

                          return text

                  except Exception:

                      pass


              return raw.decode(
                  "cp932",
                  errors="replace"
              )


          def get_html(
              url,
              referer=None
          ):

              return decode_jra(
                  fetch(
                      url,
                      "GET",
                      None,
                      referer
                  )
              )


          def post_cname(
              token,
              referer=None
          ):

              body = urllib.parse.urlencode({
                  "cname": token
              }).encode(
                  "ascii"
              )

              return decode_jra(
                  fetch(
                      ACCESS_URL,
                      "POST",
                      body,
                      referer
                  )
              )


          # ============================================================
          # TOKEN
          # ============================================================

          # 例:
          #
          # pw01dde0101202602060120260906/6A
          #
          # pw01dde
          # 22文字
          # /XX
          #

          TOKEN_PATTERN = re.compile(
              r"pw01dde"
              r"[0-9A-Za-z]{22}"
              r"(?:/|%2F)"
              r"[0-9A-Fa-f]{2}",
              re.I
          )


          TOKEN_STRUCTURE = re.compile(
              r"^pw01dde"
              r"(?P<prefix>[0-9A-Za-z]{2})"
              r"(?P<venue>[0-9]{2})"
              r"(?P<year>[0-9]{4})"
              r"(?P<meeting>[0-9]{4})"
              r"(?P<race>[0-9]{2})"
              r"(?P<date>[0-9]{8})"
              r"/"
              r"(?P<hash>[0-9A-Fa-f]{2})"
              r"$",
              re.I
          )


          def normalize_token(
              token
          ):

              token = html.unescape(
                  token
              )

              token = urllib.parse.unquote(
                  token
              )

              return token.strip()


          def scan_tokens(
              text
          ):

              text = html.unescape(
                  text
              )

              tokens = set()


              for match in TOKEN_PATTERN.finditer(
                  text
              ):

                  token = normalize_token(
                      match.group(0)
                  )

                  tokens.add(
                      token
                  )


              return tokens


          def target_token(
              token
          ):

              match = TOKEN_STRUCTURE.fullmatch(
                  token
              )

              if not match:

                  return False

              return (
                  match.group("date")
                  == target_ymd
              )


          # ============================================================
          # 競馬場
          # ============================================================

          VENUES = {

              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉",

          }


          # ============================================================
          # JRAトップページからtokenを探す
          # ============================================================

          seed_urls = [

              BASE,

              BASE + "/JRADB/",

              BASE + "/JRADB/accessD.html",

              BASE + "/JRADB/access.html",

              BASE + "/keiba/",

          ]


          discovered = set()


          for seed_url in seed_urls:

              print(
                  "SEED:",
                  seed_url
              )

              try:

                  page = get_html(
                      seed_url
                  )

                  found = scan_tokens(
                      page
                  )

                  print(
                      "  TOKENS:",
                      len(found)
                  )

                  discovered.update(
                      found
                  )

              except Exception as e:

                  print(
                      "  WARNING:",
                      repr(e)
                  )

              time.sleep(
                  0.5
              )


          print("")
          print(
              "DISCOVERED TOKENS:",
              len(discovered)
          )


          # ============================================================
          # 取得済みtokenから対象日を抽出
          # ============================================================

          target_tokens = set(
              token
              for token in discovered
              if target_token(token)
          )


          print(
              "TARGET TOKENS:",
              len(target_tokens)
          )


          # ============================================================
          # もし直接見つからなければ、
          # accessDのPOST/GETを使って候補を追加探索
          # ============================================================

          if len(target_tokens) < 36:

              print("")
              print(
                  "TARGET TOKENS < 36"
              )

              print(
                  "Starting recursive discovery..."
              )


              queue = list(
                  discovered
              )

              visited = set()


              max_pages = 150


              while (
                  queue
                  and len(visited) < max_pages
                  and len(target_tokens) < 36
              ):

                  token = queue.pop(0)

                  if token in visited:
                      continue

                  visited.add(
                      token
                  )


                  try:

                      url = (
                          ACCESS_URL
                          + "?CNAME="
                          + urllib.parse.quote(
                              token,
                              safe=""
                          )
                      )


                      page = get_html(
                          url,
                          ACCESS_URL
                      )


                      found = scan_tokens(
                          page
                      )


                      new_count = 0


                      for found_token in found:

                          if (
                              found_token
                              not in discovered
                          ):

                              discovered.add(
                                  found_token
                              )

                              queue.append(
                                  found_token
                              )

                              new_count += 1


                          if target_token(
                              found_token
                          ):

                              target_tokens.add(
                                  found_token
                              )


                      if (
                          new_count
                          or target_token(token)
                      ):

                          print(
                              "SCAN",
                              token,
                              "new=",
                              new_count,
                              "target=",
                              len(
                                  target_tokens
                              )
                          )


                  except Exception as e:

                      print(
                          "SCAN WARNING:",
                          repr(e)
                      )


                  time.sleep(
                      0.3
                  )


          # ============================================================
          # tokenをrace keyに変換
          # ============================================================

          races_by_key = {}


          for token in target_tokens:

              match = TOKEN_STRUCTURE.fullmatch(
                  token
              )

              if not match:
                  continue


              venue = match.group(
                  "venue"
              )

              race = int(
                  match.group(
                      "race"
                  )
              )


              key = (
                  venue,
                  race
              )


              races_by_key[key] = token


          print("")
          print("=" * 70)
          print(
              "TARGET RACE TOKENS:",
              len(races_by_key)
          )
          print("=" * 70)


          for key, token in sorted(
              races_by_key.items()
          ):

              venue = VENUES.get(
                  key[0],
                  key[0]
              )

              print(
                  venue,
                  f"{key[1]}R",
                  token
              )


          print("")


          # ============================================================
          # ここで0件なら即終了
          # ============================================================

          if not races_by_key:

              raise RuntimeError(
                  "対象日のJRAレースtokenを"
                  "1件も取得できませんでした。"
              )


          # ============================================================
          # HTML utilities
          # ============================================================

          TR_PATTERN = re.compile(
              r"<tr\b[^>]*>.*?</tr>",
              re.I | re.S
          )


          def class_pattern(
              name
          ):

              return (
                  r'class\s*=\s*["\'][^"\']*'
                  r"\b"
                  + re.escape(name)
                  + r"\b"
                  r'[^"\']*["\']'
              )


          def clean_text(
              text
          ):

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def capture(
              pattern,
              text
          ):

              match = re.search(
                  pattern,
                  text,
                  re.I | re.S
              )

              if not match:
                  return None

              return match.group(
                  1
              ).strip()


          # ============================================================
          # horse parser
          # ============================================================

          def parse_horse(
              row
          ):

              # 馬番

              number_raw = capture(
                  rf"<td[^>]*"
                  rf"{class_pattern('num')}"
                  rf"[^>]*>"
                  rf"\s*(\d{{1,2}})",
                  row
              )


              if not number_raw:
                  return None


              number = int(
                  number_raw
              )


              if number < 1 or number > 18:
                  return None


              # 馬名

              name = capture(
                  rf"<div[^>]*"
                  rf"{class_pattern('name')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"(?:<a[^>]*>)?"
                  rf"(.*?)"
                  rf"(?:</a>)?"
                  rf"\s*</div>",
                  row
              )


              if not name:
                  return None


              name = clean_text(
                  name
              )


              # オッズ

              odds_raw = capture(
                  rf"{class_pattern('odds')}"
                  rf"[^>]*>"
                  rf".*?"
                  rf"<strong[^>]*>"
                  rf"\s*"
                  rf"([0-9]+(?:\.[0-9]+)?)"
                  rf"\s*</strong>",
                  row
              )


              if not odds_raw:

                  return None


              odds = float(
                  odds_raw
              )


              # 人気

              popularity_raw = capture(
                  r"\(\s*"
                  r"(\d+)"
                  r"\s*"
                  r"<span[^>]*>"
                  r"\s*番人気"
                  r"\s*</span>"
                  r"\s*\)",
                  row
              )


              popularity = (
                  int(
                      popularity_raw
                  )
                  if popularity_raw
                  else None
              )


              # 馬体重

              body_weight_raw = capture(
                  rf"{class_pattern('weight')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"(\d{{3}})"
                  rf"\s*kg",
                  row
              )


              if not body_weight_raw:

                  return None


              body_weight = int(
                  body_weight_raw
              )


              # 馬体重増減

              body_diff_raw = capture(
                  rf"{class_pattern('weight')}"
                  rf"[^>]*>"
                  rf".*?"
                  rf"{class_pattern('transition')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"([+-]?\d+)"
                  rf"\s*</span>",
                  row
              )


              body_weight_diff = (

                  int(
                      body_diff_raw
                  )

                  if body_diff_raw

                  else None

              )


              # 性齢

              sex_age = capture(
                  rf"<p[^>]*"
                  rf"{class_pattern('age')}"
                  rf"[^>]*>"
                  rf"(.*?)"
                  rf"</p>",
                  row
              )


              sex_age = (
                  clean_text(
                      sex_age
                  )
                  if sex_age
                  else ""
              )


              # 斤量

              carried_raw = capture(
                  rf"<p[^>]*"
                  rf"{class_pattern('weight')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"([0-9]+(?:\.[0-9]+)?)"
                  rf"\s*"
                  rf"<span[^>]*>"
                  rf"\s*kg"
                  rf"\s*</span>"
                  rf"\s*</p>",
                  row
              )


              carried_weight = (

                  float(
                      carried_raw
                  )

                  if carried_raw

                  else None

              )


              # 騎手

              jockey = capture(
                  rf"<p[^>]*"
                  rf"{class_pattern('jockey')}"
                  rf"[^>]*>"
                  rf"\s*"
                  rf"(?:<a[^>]*>)?"
                  rf"(.*?)"
                  rf"(?:</a>)?"
                  rf"\s*</p>",
                  row
              )


              jockey = (
                  clean_text(
                      jockey
                  )
                  if jockey
                  else ""
              )


              return {

                  "number":
                      number,

                  "name":
                      name,

                  "odds":
                      odds,

                  "popularity":
                      popularity,

                  "body_weight":
                      body_weight,

                  "body_weight_diff":
                      body_weight_diff,

                  "sex_age":
                      sex_age,

                  "carried_weight":
                      carried_weight,

                  "jockey":
                      jockey,

              }


          # ============================================================
          # race parser
          # ============================================================

          class TextCollector(
              HTMLParser
          ):

              def __init__(self):

                  super().__init__(
                      convert_charrefs=True
                  )

                  self.data = []


              def handle_data(
                  self,
                  data
              ):

                  data = data.strip()

                  if data:

                      self.data.append(
                          data
                      )


              def text(
                  self
              ):

                  return "\n".join(
                      self.data
                  )


          def parse_race(
              page,
              token
          ):

              horses = []


              rows = TR_PATTERN.findall(
                  page
              )


              for row in rows:

                  # 馬行には horse / jockey が
                  # 存在する。

                  if not re.search(
                      class_pattern("horse"),
                      row,
                      re.I
                  ):

                      continue


                  if not re.search(
                      class_pattern("jockey"),
                      row,
                      re.I
                  ):

                      continue


                  horse = parse_horse(
                      row
                  )


                  if horse:

                      horses.append(
                          horse
                      )


              # 重複除去

              unique = {}


              for horse in horses:

                  unique[
                      horse["number"]
                  ] = horse


              horses = [

                  unique[number]

                  for number in sorted(
                      unique
                  )

              ]


              if not horses:

                  raise RuntimeError(
                      "馬データを抽出できませんでした"
                  )


              # token

              match = TOKEN_STRUCTURE.fullmatch(
                  token
              )


              venue_code = match.group(
                  "venue"
              )

              race_number = int(
                  match.group(
                      "race"
                  )
              )


              # テキスト

              collector = TextCollector()

              collector.feed(
                  page
              )

              text = collector.text()


              # 発走時刻

              time_match = re.search(
                  r"発走時刻"
                  r".{0,20}?"
                  r"(\d{1,2})時"
                  r"\s*(\d{2})分",
                  text,
                  re.S
              )


              race_time = ""


              if time_match:

                  race_time = (
                      f"{int(time_match.group(1)):02d}:"
                      f"{time_match.group(2)}"
                  )


              # 距離

              distance_match = re.search(
                  r"([\d,]+)"
                  r"\s*メートル",
                  text
              )


              distance = None


              if distance_match:

                  distance = int(
                      distance_match.group(1)
                      .replace(",", "")
                  )


              # 芝 / ダート

              surface = ""


              if "芝" in text:

                  surface = "芝"

              elif "ダート" in text:

                  surface = "ダート"


              # race name

              race_name = (
                  f"{race_number}R"
              )


              return {

                  "venue":
                      VENUES.get(
                          venue_code,
                          venue_code
                      ),

                  "venue_code":
                      venue_code,

                  "no":
                      race_number,

                  "date":
                      target_iso,

                  "time":
                      race_time,

                  "name":
                      race_name,

                  "distance":
                      distance,

                  "surface":
                      surface,

                  "course":
                      "",

                  "going":
                      "",

                  "url":
                      (
                          ACCESS_URL
                          + "?CNAME="
                          + urllib.parse.quote(
                              token,
                              safe=""
                          )
                      ),

                  "token":
                      token,

                  "horses":
                      horses,

              }


          # ============================================================
          # FETCH RACES
          # ============================================================

          races = []

          failures = []


          for (
              (venue_code, race_number),
              token
          ) in sorted(
              races_by_key.items()
          ):

              venue_name = VENUES.get(
                  venue_code,
                  venue_code
              )


              url = (
                  ACCESS_URL
                  + "?CNAME="
                  + urllib.parse.quote(
                      token,
                      safe=""
                  )
              )


              print(
                  ""
              )

              print(
                  "FETCH:",
                  venue_name,
                  f"{race_number}R"
              )


              try:

                  page = get_html(
                      url,
                      ACCESS_URL
                  )


                  race = parse_race(
                      page,
                      token
                  )


                  # ----------------------------------------------------
                  # 品質チェック
                  # ----------------------------------------------------

                  problems = []


                  for horse in race[
                      "horses"
                  ]:

                      if not horse["name"]:

                          problems.append(
                              f'{horse["number"]}:馬名'
                          )


                      if (
                          horse["odds"]
                          <= 0
                      ):

                          problems.append(
                              f'{horse["number"]}:odds'
                          )


                      if not horse[
                          "sex_age"
                      ]:

                          problems.append(
                              f'{horse["number"]}:性齢'
                          )


                      if (
                          horse[
                              "carried_weight"
                          ]
                          is None
                      ):

                          problems.append(
                              f'{horse["number"]}:斤量'
                          )


                      if not horse[
                          "jockey"
                      ]:

                          problems.append(
                              f'{horse["number"]}:騎手'
                          )


                  if problems:

                      raise RuntimeError(
                          "QUALITY: "
                          + ",".join(
                              problems[:10]
                          )
                      )


                  races.append(
                      race
                  )


                  print(
                      "  OK",
                      f"horses={len(race['horses'])}"
                  )


              except Exception as e:

                  failures.append({

                      "venue":
                          venue_name,

                      "race":
                          race_number,

                      "token":
                          token,

                      "error":
                          repr(e),

                  })


                  print(
                      "  FAIL:",
                      repr(e)
                  )


              time.sleep(
                  0.5
              )


          # ============================================================
          # FINAL CHECK
          # ============================================================

          races.sort(
              key=lambda r: (
                  r["venue_code"],
                  r["no"]
              )
          )


          print("")
          print("=" * 70)
          print("FINAL RESULT")
          print("=" * 70)

          print(
              "EXPECTED:",
              len(races_by_key)
          )

          print(
              "SUCCESS:",
              len(races)
          )

          print(
              "FAILURES:",
              len(failures)
          )


          if failures:

              print("")
              print(
                  "FAILURE DETAILS"
              )

              for failure in failures:

                  print(
                      failure["venue"],
                      f'{failure["race"]}R',
                      failure["error"]
                  )

              raise RuntimeError(
                  f"{len(failures)}レースの取得に失敗しました"
              )


          if len(races) != len(
              races_by_key
          ):

              raise RuntimeError(
                  "取得レース数が一致しません"
              )


          # ============================================================
          # VENUE COUNTS
          # ============================================================

          venue_counts = {}


          for race in races:

              venue = race[
                  "venue"
              ]

              venue_counts[
                  venue
              ] = venue_counts.get(
                  venue,
                  0
              ) + 1


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {

              "date":
                  target_iso,

              "target_ymd":
                  target_ymd,

              "updated_at":
                  now.isoformat(),

              "source":
                  "JRA公式",

              "parser_version":
                  "11.0",

              "race_count":
                  len(races),

              "venue_counts":
                  venue_counts,

              "races":
                  races,

          }


          output_path = Path(
              "data/jra_daily.json"
          )


          output_path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          summary_file = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )


          if summary_file:

              with open(
                  summary_file,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "# JRA DATA SYNC\n\n"
                  )

                  f.write(
                      f"- 対象日: `{target_iso}`\n"
                  )

                  f.write(
                      f"- レース数: `{len(races)}`\n"
                  )

                  f.write(
                      f"- 失敗: `{len(failures)}`\n\n"
                  )


                  f.write(
                      "|競馬場|R数|\n"
                  )

                  f.write(
                      "|---|---:|\n"
                  )


                  for venue, count in sorted(
                      venue_counts.items()
                  ):

                      f.write(
                          f"|{venue}|{count}|\n"
                      )


                  f.write(
                      "\n## Horse sample\n\n"
                  )


                  if races:

                      race = races[0]


                      for horse in race[
                          "horses"
                      ][:5]:

                          f.write(
                              "- "
                              f"{horse['number']} "
                              f"{horse['name']} / "
                              f"{horse['odds']} / "
                              f"{horse['sex_age']} / "
                              f"{horse['carried_weight']}kg / "
                              f"{horse['jockey']}\n"
                          )


          # ============================================================
          # FINISH
          # ============================================================

          print("")
          print("=" * 70)
          print("SUCCESS")
          print("=" * 70)

          print(
              "DATE:",
              target_iso
          )

          print(
              "RACES:",
              len(races)
          )

          print(
              "VENUES:",
              json.dumps(
                  venue_counts,
                  ensure_ascii=False
              )
          )

          print(
              "JSON:",
              output_path
          )

          print("")


          PY


