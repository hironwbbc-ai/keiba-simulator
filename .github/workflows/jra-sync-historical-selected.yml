name: JRA Sync - Historical Selected Race v15.7

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "取得する開催日 (YYYYMMDD)"
        required: true
        type: string
      race_venue:
        description: "開催場（例：阪神）"
        required: true
        type: string
      race_no:
        description: "レース番号（例：11）"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: historical-selected-race
  cancel-in-progress: true

jobs:
  sync-selected-race:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync selected JRA historical race
        shell: bash
        env:
          RACE_DATE_INPUT: ${{ inputs.race_date }}
          RACE_VENUE_INPUT: ${{ inputs.race_venue }}
          RACE_NO_INPUT: ${{ inputs.race_no }}
        run: |
          set -euo pipefail
          mkdir -p data/history
          python3 - <<'PY'
          import datetime
          import html as htmlmod
          import http.cookiejar
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          UA = "Mozilla/5.0 (compatible; keiba-simulator/jra-sync-15.6)"
          BASE = "https://www.jra.go.jp"
          ACCESS_S = BASE + "/JRADB/accessS.html"
          JST = ZoneInfo("Asia/Tokyo")
          
          VENUE_NAMES = {
              "01": "札幌", "02": "函館", "03": "福島", "04": "新潟",
              "05": "東京", "06": "中山", "07": "中京", "08": "京都",
              "09": "阪神", "10": "小倉",
          }
          VENUE_CODES = {name: code for code, name in VENUE_NAMES.items()}
          
          HIST_TOKEN_RE = re.compile(
              r"^pw01sde(?P<prefix>[0-9A-Za-z]{2})(?P<venue>[0-9]{2})"
              r"(?P<year>[0-9]{4})(?P<meet>[0-9]{2})(?P<day>[0-9]{2})"
              r"(?P<race>[0-9]{2})(?P<date>[0-9]{8})/(?P<hex>[0-9A-Fa-f]{2})$",
              re.I,
          )
          ACTION_TOKEN_RE = re.compile(
              r"doAction\s*\(\s*['\"](?:/JRADB/)?accessS\.html['\"]\s*,\s*['\"]?"
              r"(pw01(?:srl|sde)[^'\")\s<>&]+)['\"]?",
              re.I,
          )
          GENERIC_TOKEN_RE = re.compile(
              r"(pw01(?:srl|sde)[^\s'\"<>]+/[0-9A-Fa-f]{2})", re.I
          )
          
          now = datetime.datetime.now(JST)
          requested = os.environ.get("RACE_DATE_INPUT", "").strip()
          selected_venue_input = os.environ.get("RACE_VENUE_INPUT", "").strip()
          selected_race_s = os.environ.get("RACE_NO_INPUT", "").strip()
          
          if not re.fullmatch(r"\d{8}", requested):
              raise RuntimeError("race_date は YYYYMMDD 形式で指定してください")
          if not selected_venue_input:
              raise RuntimeError("race_venue を指定してください")
          if not re.fullmatch(r"\d{1,2}", selected_race_s):
              raise RuntimeError("race_no は1～18の数字で指定してください")
          
          selected_race = int(selected_race_s)
          if not 1 <= selected_race <= 18:
              raise RuntimeError("race_no は1～18で指定してください")
          
          target_date = datetime.datetime.strptime(requested, "%Y%m%d").date()
          target_ymd = requested
          target_date_iso = target_date.isoformat()
          
          if target_date >= now.date():
              raise RuntimeError("このworkflowは過去レース専用です。開催終了後の日付を指定してください。")
          
          if selected_venue_input in VENUE_NAMES:
              selected_venue_code = selected_venue_input
          elif selected_venue_input in VENUE_CODES:
              selected_venue_code = VENUE_CODES[selected_venue_input]
          else:
              raise RuntimeError(
                  f"開催場が認識できません: {selected_venue_input}。"
                  f" 例: 阪神 または 09"
              )
          selected_venue_name = VENUE_NAMES[selected_venue_code]
          
          print("=" * 70)
          print("DATE SELECTION")
          print("=" * 70)
          print("MODE: MANUAL")
          print("TARGET DATE:", target_date_iso)
          print("TARGET VENUE:", selected_venue_name, selected_venue_code)
          print("TARGET RACE:", selected_race)
          print("=" * 70)
          
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          
          def request_bytes(url, method="GET", data=None, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with opener.open(req, timeout=20) as response:
                  return response.read()
          
          def decode_jra(raw):
              for enc in ("cp932", "shift_jis", "utf-8"):
                  try:
                      text = raw.decode(enc)
                      if "<html" in text.lower() or "JRADB" in text:
                          return text
                  except UnicodeDecodeError:
                      pass
              return raw.decode("cp932", "replace")
          
          def post_s(token, referer=None):
              data = urllib.parse.urlencode({"cname": token}).encode("ascii")
              return decode_jra(request_bytes(ACCESS_S, "POST", data, referer or BASE))
          
          def get_s(token, referer=None):
              url = ACCESS_S + "?CNAME=" + urllib.parse.quote(token, safe="")
              return decode_jra(request_bytes(url, "GET", None, referer or BASE))
          
          def clean_token(value):
              value = htmlmod.unescape(value)
              value = urllib.parse.unquote(value)
              return value.strip().rstrip(",;")
          
          def extract_objparam(text):
              pairs = re.findall(
                  r'objParam\s*\[\s*["\'](\d{4})["\']\s*\]\s*=\s*["\']([0-9A-Fa-f]{2})["\']',
                  text,
                  re.I,
              )
              return {k.upper(): v.upper() for k, v in pairs}
          
          def extract_link_attributes(text):
              return [
                  match.group(2)
                  for match in re.finditer(
                      r"(?:href|onclick)\s*=\s*(['\"])(.*?)\1", text, re.I | re.S
                  )
              ]
          
          def find_tokens(text, prefix):
              text = htmlmod.unescape(text)
              found = set()
              for value in ACTION_TOKEN_RE.findall(text):
                  value = clean_token(value)
                  if value.lower().startswith(prefix.lower()):
                      found.add(value)
              for value in GENERIC_TOKEN_RE.findall(text):
                  value = clean_token(value)
                  if value.lower().startswith(prefix.lower()):
                      found.add(value)
              if prefix.lower() == "pw01srl":
                  for attr in extract_link_attributes(text):
                      attr = urllib.parse.unquote(htmlmod.unescape(attr))
                      for match in re.finditer(r"(pw01srl[^'\"<>\s,;)]+)", attr, re.I):
                          found.add(clean_token(match.group(1)))
              return found
          
          # ------------------------------------------------------------
          # 1. Get the monthly historical selector.
          # ------------------------------------------------------------
          HIST_ENTRY = "pw01skl00999999/B3"
          selector = post_s(HIST_ENTRY, BASE)
          obj = extract_objparam(selector)
          ym = target_ymd[:6]
          check_digit = obj.get(ym[2:].upper()) or obj.get(ym.upper())
          if not check_digit:
              raise RuntimeError(f"JRA過去レース検索のチェックデジットを取得できませんでした: {ym}")
          
          month_candidates = [
              f"pw01skl10{ym}/{check_digit}",
              f"pw01skl00{ym}/{check_digit}",
          ]
          
          chosen_month_token = None
          rsl_tokens = set()
          for candidate in month_candidates:
              for method in ("POST", "GET"):
                  try:
                      page = post_s(candidate, ACCESS_S) if method == "POST" else get_s(candidate, ACCESS_S)
                      found = find_tokens(page, "pw01srl")
                      print(f"MONTH TRY: {candidate} {method} len={len(page)} rsl={len(found)}")
                      title_match = re.search(r"<title[^>]*>(.*?)</title>", page, re.I | re.S)
                      if title_match:
                          title = re.sub(r"\s+", " ", htmlmod.unescape(title_match.group(1))).strip()
                          print("  TITLE:", title[:120])
                      if found:
                          chosen_month_token = candidate
                          rsl_tokens = found
                          break
                  except Exception as exc:
                      print("MONTH TRY WARNING:", candidate, method, repr(exc))
              if chosen_month_token:
                  break
          
          if not rsl_tokens:
              raise RuntimeError(f"{ym} の月別ページから開催選択token(pw01srl)を抽出できませんでした。")
          
          print("MONTH TOKEN USED:", chosen_month_token)
          print("MONTH RSL TOKENS:", len(rsl_tokens))
          
          # ------------------------------------------------------------
          # 2. Discover lightweight race tokens only.
          #    No historical horse-data sweep is performed here.
          # ------------------------------------------------------------
          def probe_rsl(item):
              index, token = item
              try:
                  page = post_s(token, ACCESS_S)
                  found = {
                      clean_token(x)
                      for x in find_tokens(page, "pw01sde")
                      if target_ymd in x
                  }
                  return index, token, found, None
              except Exception as exc:
                  return index, token, set(), repr(exc)
          
          rsl_items = list(enumerate(sorted(rsl_tokens), 1))
          sde_tokens = set()
          with ThreadPoolExecutor(max_workers=min(6, max(1, len(rsl_items)))) as executor:
              futures = [executor.submit(probe_rsl, item) for item in rsl_items]
              for future in as_completed(futures):
                  index, token, found, error = future.result()
                  if error:
                      print("RSL warning:", token, error)
                      continue
                  sde_tokens.update(found)
                  print(
                      f"RSL {index}/{len(rsl_items)}: "
                      f"target_races={len(found)} total_target={len(sde_tokens)}"
                  )
          
          print("HISTORICAL RACE TOKENS:", len(sde_tokens))
          if not sde_tokens:
              raise RuntimeError(f"{target_ymd} のレース結果token(pw01sde)を取得できませんでした。")
          
          # ------------------------------------------------------------
          # 3. Select exactly one race token.
          # ------------------------------------------------------------
          target_tokens = []
          for token in sorted(sde_tokens):
              match = HIST_TOKEN_RE.fullmatch(token)
              if not match:
                  continue
              if match.group("date") != target_ymd:
                  continue
              if match.group("venue") != selected_venue_code:
                  continue
              if int(match.group("race")) != selected_race:
                  continue
              target_tokens.append(token)
          
          if not target_tokens:
              raise RuntimeError(
                  f"{target_ymd} の {selected_venue_name} {selected_race}R のtokenが見つかりません。"
              )
          
          selected_token = sorted(target_tokens)[0]
          print("SELECTED TOKEN:", selected_token)
          
          # ------------------------------------------------------------
          # 4. Download only the selected official result page.
          # ------------------------------------------------------------
          selected_url = ACCESS_S + "?CNAME=" + urllib.parse.quote(selected_token, safe="")
          raw = post_s(selected_token, ACCESS_S)
          title_match = re.search(r"<title[^>]*>(.*?)</title>", raw, re.I | re.S)
          title = (
              re.sub(r"\s+", " ", htmlmod.unescape(title_match.group(1))).strip()
              if title_match else ""
          )
          if "パラメータエラー" in title or title == "エラー":
              raw = get_s(selected_token, ACCESS_S)
          
          class CellParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.parts = []
          
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif self.row is not None and tag in ("td", "th"):
                      self.cell = []
                      self.parts = []
                  elif self.cell is not None and tag == "img":
                      alt = dict(attrs).get("alt", "")
                      if alt:
                          self.parts.append(alt)
          
              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.row is not None and self.cell is not None:
                      text = re.sub(r"\s+", " ", htmlmod.unescape("".join(self.parts))).strip()
                      self.row.append(text)
                      self.cell = None
                      self.parts = []
                  elif tag == "tr" and self.row is not None:
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None
                      self.cell = None
                      self.parts = []
          
              def handle_data(self, data):
                  if self.cell is not None:
                      self.parts.append(data)
          
          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.out = []
          
              def handle_starttag(self, tag, attrs):
                  if tag in ("tr", "p", "div", "li", "h1", "h2", "h3"):
                      self.out.append("\n")
                  elif tag in ("td", "th"):
                      self.out.append(" | ")
          
              def handle_endtag(self, tag):
                  if tag in ("tr", "p", "div", "li", "h1", "h2", "h3"):
                      self.out.append("\n")
          
              def handle_data(self, data):
                  self.out.append(data)
          
              def text(self):
                  text = htmlmod.unescape("".join(self.out))
                  lines = []
                  for raw_line in text.splitlines():
                      value = re.sub(r"\s+", " ", raw_line).strip(" |")
                      if value:
                          lines.append(value)
                  return "\n".join(lines)
          
          def parse_history_page(raw_html, token):
              cell_parser = CellParser()
              cell_parser.feed(raw_html)
              rows = []
              for cells in cell_parser.rows:
                  if len(cells) < 14:
                      continue
                  finish_match = re.fullmatch(r"\d+", cells[0].strip())
                  frame_match = re.search(r"(\d+)", cells[1])
                  number_match = re.fullmatch(r"\d+", cells[2].strip())
                  if not finish_match or not frame_match or not number_match:
                      continue
                  finish = int(finish_match.group(0))
                  frame = int(frame_match.group(1))
                  number = int(number_match.group(0))
                  if not (1 <= finish <= 18 and 1 <= frame <= 8 and 1 <= number <= 18):
                      continue
                  name = re.sub(r"\s+", " ", cells[3]).strip()
                  if not name:
                      continue
                  carried_match = re.search(r"([0-9]+(?:\.[0-9]+)?)", cells[5])
                  body_match = re.search(r"(\d{3})\s*\(([-+]?\d+|-)\)", cells[11])
                  popularity_match = re.search(r"(\d+)", cells[13])
                  corner_raw = re.sub(r"\s+", " ", cells[9]).strip()
                  corner_numbers = [int(x) for x in re.findall(r"\d+", corner_raw)]
                  rows.append({
                      "finish": finish,
                      "frame": frame,
                      "no": number,
                      "name": name,
                      "popularity": int(popularity_match.group(1)) if popularity_match else None,
                      "sexAge": cells[4].strip(),
                      "bodyWeight": int(body_match.group(1)) if body_match else None,
                      "bodyWeightDiff": (
                          None if not body_match or body_match.group(2) == "-"
                          else int(body_match.group(2))
                      ),
                      "jockey": re.sub(r"\s+", " ", cells[6]).strip(),
                      "carriedWeight": float(carried_match.group(1)) if carried_match else None,
                      "corner3": corner_numbers[-2] if len(corner_numbers) >= 2 else None,
                      "corner4": corner_numbers[-1] if corner_numbers else None,
                      "cornerRaw": corner_raw,
                  })
          
              deduped = {row["no"]: row for row in rows}
              text_parser = TextParser()
              text_parser.feed(raw_html)
              text = text_parser.text()
              lines = [line.strip() for line in text.splitlines() if line.strip()]
          
              date_match = re.search(r"(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日", text)
              time_match = re.search(r"発走時刻：?\s*(\d{1,2})時\s*(\d{2})分", text)
              meet_match = re.search(r"(\d+)回([^\n|]+?)(\d+)日", text)
              token_match = HIST_TOKEN_RE.fullmatch(token)
          
              meta = {
                  "date": (
                      f"{date_match.group(1)}-{int(date_match.group(2)):02d}-{int(date_match.group(3)):02d}"
                      if date_match else target_date_iso
                  ),
                  "time": f"{int(time_match.group(1)):02d}:{time_match.group(2)}" if time_match else "",
                  "distance": None,
                  "surface": "",
                  "course": "",
                  "going": "",
                  "meet": meet_match.group(2).strip() if meet_match else "",
                  "meet_day": int(meet_match.group(3)) if meet_match else None,
                  "no": int(token_match.group("race")) if token_match else selected_race,
                  "name": "レース",
              }
          
              body_start = 0
              for index, line in enumerate(lines):
                  if line == "ここから本文です":
                      body_start = index
                      break
              body_lines = lines[body_start:] if body_start else lines
          
              weather_index = next(
                  (index for index, line in enumerate(body_lines) if line.startswith("天候")),
                  None,
              )
              if weather_index is not None:
                  for line in body_lines[weather_index + 1:weather_index + 5]:
                      if re.match(r"^(?:芝|ダート)", line):
                          going_match = re.search(r"(不良|稍重|重|良)\s*$", line)
                          if going_match:
                              meta["going"] = going_match.group(1)
                              break
          
              title_start = weather_index + 1 if weather_index is not None else 0
              for line in body_lines[title_start:title_start + 20]:
                  if line in ("本文へ移動する", "レース映像", "検索ウィンドウ"):
                      continue
                  if line.startswith(("天候", "本賞金", "コース：", "コース:")):
                      continue
                  # JRA結果ページでは馬場状態が「芝良」「ダート重」のように
                  # 1行で抽出される。空白入り表記も含め、レース名と誤認しない。
                  if re.fullmatch(r"(?:芝|ダート)\s*(?:不良|稍重|重|良)", line):
                      continue
                  # レース名として明らかに不自然な単独の馬場状態表記も除外。
                  if re.fullmatch(r"(?:良|稍重|重|不良)", line):
                      continue
                  if re.search(r"(?:\d+レース|Image:)", line):
                      continue
                  if re.fullmatch(r"(?:芝|ダート)\s*(?:不良|稍重|重|良)", line):
                      continue
                  if re.fullmatch(r"(?:良|稍重|重|不良)", line):
                      continue
                  if len(line) <= 100 and len(line) >= 2:
                      meta["name"] = line
                      break
          
              course_line = next(
                  (
                      line for line in body_lines[title_start:title_start + 30]
                      if re.match(r"^コース[:：].*メートル（", line)
                  ),
                  None,
              )
              if course_line:
                  distance_match = re.search(r"([\d,]+)メートル（([^）]+)）", course_line)
                  if distance_match:
                      meta["distance"] = int(distance_match.group(1).replace(",", ""))
                      spec = distance_match.group(2).strip()
                      if "→" in spec:
                          meta["surface"] = spec
                      elif "・" in spec:
                          surface, course = spec.split("・", 1)
                          meta["surface"] = surface.strip()
                          meta["course"] = course.strip()
                      else:
                          meta["surface"] = spec
          
              return meta, sorted(deduped.values(), key=lambda row: row["no"])
          
          meta, horses = parse_history_page(raw, selected_token)
          if not horses:
              raise RuntimeError("選択レースの結果馬データを抽出できませんでした")
          
          race = {
              "venue": selected_venue_name,
              "venue_code": selected_venue_code,
              "meet": meta["meet"],
              "meet_day": meta["meet_day"],
              "no": selected_race,
              "date": meta["date"],
              "time": meta["time"],
              "name": meta["name"],
              "distance": meta["distance"],
              "surface": meta["surface"],
              "course": meta["course"],
              "going": meta["going"],
              "url": selected_url,
              "token": selected_token,
              "historical": True,
              "horses": horses,
          }
          
          # ------------------------------------------------------------
          # 5. Save exactly one detailed race + lightweight index.
          # ------------------------------------------------------------
          out_dir = Path(f"data/history/{target_ymd}")
          out_dir.mkdir(parents=True, exist_ok=True)
          out_file = out_dir / f"{selected_venue_code}_{selected_race:02d}.json"
          out_file.write_text(
              json.dumps(race, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          
          index_file = out_dir / "index.json"
          index = {
              "date": target_date_iso,
              "updated_at": now.isoformat(),
              "target_ymd": target_ymd,
              "source": "JRA公式 accessS 過去レース結果",
              "mode": "historical_index",
              "races": [],
          }
          if index_file.exists():
              try:
                  index = json.loads(index_file.read_text(encoding="utf-8"))
              except Exception:
                  pass
          
          by_key = {
              f"{item.get('venue_code')}-{item.get('no')}": item
              for item in index.get("races", [])
          }
          for token in sorted(sde_tokens):
              match = HIST_TOKEN_RE.fullmatch(token)
              if not match or match.group("date") != target_ymd:
                  continue
              venue_code = match.group("venue")
              race_no = int(match.group("race"))
              key = f"{venue_code}-{race_no}"
              by_key.setdefault(
                  key,
                  {
                      "venue": VENUE_NAMES.get(venue_code, venue_code),
                      "venue_code": venue_code,
                      "no": race_no,
                      "date": target_date_iso,
                  },
              )
          
          index["races"] = sorted(
              by_key.values(),
              key=lambda item: (item.get("venue_code", ""), item.get("no", 0)),
          )
          index["race_count"] = len(index["races"])
          index["parser_version"] = "15.6-selected-race"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          
          print("WROTE:", out_file)
          print("WROTE:", index_file, "RACES INDEX:", len(index["races"]))
          print("SELECTED:", race["venue"], f"{selected_race}R", "HORSES:", len(horses))
          PY

      - name: Commit selected historical race data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No selected historical data changes."
          else
            git commit -m "chore: sync selected JRA historical race"
            git push
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

