name: JRA Sync - Horse History (selected race) v16

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "開催日 (YYYYMMDD)"
        required: true
        type: string
      race_venue:
        description: "開催場（例：阪神）"
        required: true
        type: string
      race_no:
        description: "レース番号（例：11）"
        required: true
        type: string
      max_runs:
        description: "馬ごとに遡る最大走数（既定12）"
        required: false
        default: "12"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: horse-history-selected
  cancel-in-progress: false

jobs:
  sync-horse-history:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect horse history for the selected race
        shell: bash
        env:
          RACE_DATE: ${{ inputs.race_date }}
          RACE_VENUE: ${{ inputs.race_venue }}
          RACE_NO: ${{ inputs.race_no }}
          MAX_RUNS: ${{ inputs.max_runs }}
        run: |
          set -euo pipefail
          python3 jra_horse_history_phase2.py \
            --date "$RACE_DATE" --venue "$RACE_VENUE" --race "$RACE_NO" \
            --max-runs "${MAX_RUNS:-12}"

      - name: Commit data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horse_history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: horse history for selected race"
            git pull --rebase
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
