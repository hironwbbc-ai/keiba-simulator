name: JRA Sync - Race List + Horse History v1

on:
  workflow_dispatch:
    inputs:
      race_list:
        description: "取得したいレースを1行に1つ。形式: 開催日_場コード_R（例: 20260906_09_11）"
        required: true
        type: string
      max_runs:
        description: "馬ごとに遡る最大走数（既定12）"
        required: false
        default: "12"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: race-list-and-history
  cancel-in-progress: false

jobs:
  sync-race-list-and-history:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Step 1/2 - 複数レースの出走馬一覧
        shell: bash
        env:
          RACE_LIST_INPUT: ${{ inputs.race_list }}
        run: |
          set -euo pipefail
          mkdir -p data/history
          python3 - <<'PY'
          import datetime
          import html as htmlmod
          import http.cookiejar
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from html.parser import HTMLParser

          JST = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(JST)

          UA = "Mozilla/5.0 (compatible; keiba-simulator/jra-sync-15.13.2)"
          BASE = "https://www.jra.go.jp"
          ACCESS_S = BASE + "/JRADB/accessS.html"

          VENUE_NAMES = {
              "01": "札幌", "02": "函館", "03": "福島", "04": "新潟", "05": "東京",
              "06": "中山", "07": "中京", "08": "京都", "09": "阪神", "10": "小倉",
          }
          VENUE_CODES = {name: code for code, name in VENUE_NAMES.items()}

          HIST_TOKEN_RE = re.compile(
              r"^pw01sde(?P<prefix>[0-9A-Za-z]{2})(?P<venue>[0-9]{2})"
              r"(?P<year>[0-9]{4})(?P<meet>[0-9]{2})(?P<day>[0-9]{2})"
              r"(?P<race>[0-9]{2})(?P<date>[0-9]{8})/(?P<hex>[0-9A-Fa-f]{2})$"
          )
          ACTION_TOKEN_RE = re.compile(
              r"doAction\s*\(\s*['\"](?:/JRADB/)?accessS\.html['\"]\s*,\s*['\"]?"
              r"(pw01(?:srl|sde)[^'\")\s<>&]+)['\"]?", re.I)
          GENERIC_TOKEN_RE = re.compile(r"(pw01(?:srl|sde)[^\s'\"<>]+/[0-9A-Fa-f]{2})", re.I)

          # --- レース一覧の入力を解析 ---
          raw_list = os.environ.get("RACE_LIST_INPUT", "")
          entries = []
          for line in raw_list.splitlines():
              line = line.strip().strip(",")
              if not line:
                  continue
              m = re.fullmatch(r"(\d{8})[_,](\S{1,8}?)[_,](\d{1,2})", line)
              if not m:
                  print("SKIP (形式不正):", line)
                  continue
              ymd, venue_in, race_s = m.group(1), m.group(2), m.group(3)
              target_date = datetime.datetime.strptime(ymd, "%Y%m%d").date()
              if target_date >= now.date():
                  print("SKIP (未来日付はこのworkflow対象外):", line)
                  continue
              if venue_in in VENUE_NAMES:
                  venue_code = venue_in
              elif venue_in in VENUE_CODES:
                  venue_code = VENUE_CODES[venue_in]
              else:
                  print("SKIP (開催場が不明):", line)
                  continue
              race_no = int(race_s)
              if not 1 <= race_no <= 18:
                  print("SKIP (race_noが範囲外):", line)
                  continue
              entries.append((ymd, venue_code, race_no))
          if not entries:
              raise RuntimeError("有効なレース指定が1件もありません。「開催日_場コード_R」の形式で入力してください。")
          print("REQUESTED:", len(entries), entries)

          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def request_bytes(url, method="GET", data=None, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with opener.open(req, timeout=25) as r:
                  return r.read()

          def decode_jra(raw):
              for enc in ("cp932", "shift_jis", "utf-8"):
                  try:
                      text = raw.decode(enc)
                      if "<html" in text.lower() or "JRADB" in text:
                          return text
                  except UnicodeDecodeError:
                      pass
              return raw.decode("cp932", "replace")

          def post_s(token, referer=None):
              data = urllib.parse.urlencode({"cname": token}).encode("ascii")
              return decode_jra(request_bytes(ACCESS_S, "POST", data, referer or BASE))

          def get_s(token, referer=None):
              url = ACCESS_S + "?CNAME=" + urllib.parse.quote(token, safe="")
              return decode_jra(request_bytes(url, "GET", None, referer or BASE))

          def clean_token(value):
              value = htmlmod.unescape(value)
              value = urllib.parse.unquote(value)
              return value.strip().rstrip(",;")

          def extract_objparam(text):
              pairs = re.findall(r'objParam\s*\[\s*["\'](\d{4})["\']\s*\]\s*=\s*["\']([0-9A-Fa-f]{2})["\']', text, re.I)
              return {k.upper(): v.upper() for k, v in pairs}

          def extract_link_attributes(text):
              return [m.group(2) for m in re.finditer(r"(?:href|onclick)\s*=\s*(['\"])(.*?)\1", text, re.I | re.S)]

          def find_tokens(text, prefix):
              text = htmlmod.unescape(text)
              found = set()
              for value in ACTION_TOKEN_RE.findall(text):
                  value = clean_token(value)
                  if value.lower().startswith(prefix.lower()):
                      found.add(value)
              for value in GENERIC_TOKEN_RE.findall(text):
                  value = clean_token(value)
                  if value.lower().startswith(prefix.lower()):
                      found.add(value)
              if prefix.lower() == "pw01srl":
                  for attr in extract_link_attributes(text):
                      attr = urllib.parse.unquote(htmlmod.unescape(attr))
                      for match in re.finditer(r"(pw01srl[^'\"<>\s,;)]+)", attr, re.I):
                          found.add(clean_token(match.group(1)))
              return found

          # --- 月選択ページのチェックデジットは全体で1回だけ取得（複数月でも共用） ---
          HIST_ENTRY = "pw01skl00999999/B3"
          _obj_cache = {}

          def get_checkdigit(ym):
              if not _obj_cache:
                  selector = post_s(HIST_ENTRY, BASE)
                  _obj_cache.update(extract_objparam(selector))
              return _obj_cache.get(ym[2:].upper()) or _obj_cache.get(ym.upper())

          _month_rsl_cache = {}

          def get_month_rsl(ym):
              """その月の『日』選択token一覧（pw01srl）。月ごとに1回だけ取得し使い回す。"""
              if ym in _month_rsl_cache:
                  return _month_rsl_cache[ym]
              check_digit = get_checkdigit(ym)
              if not check_digit:
                  raise RuntimeError(f"JRA過去レース検索のチェックデジットを取得できませんでした: {ym}")
              month_candidates = [f"pw01skl10{ym}/{check_digit}", f"pw01skl00{ym}/{check_digit}"]
              rsl_tokens = set()
              for candidate in month_candidates:
                  for method in ("POST", "GET"):
                      try:
                          page = post_s(candidate, ACCESS_S) if method == "POST" else get_s(candidate, ACCESS_S)
                          found = find_tokens(page, "pw01srl")
                          print(f"MONTH TRY: {candidate} {method} len={len(page)} rsl={len(found)}")
                          if found:
                              rsl_tokens = found
                              break
                      except Exception as exc:
                          print("MONTH TRY WARNING:", candidate, method, repr(exc))
                  if rsl_tokens:
                      break
              if not rsl_tokens:
                  raise RuntimeError(f"{ym} の月別ページから開催選択token(pw01srl)を抽出できませんでした。")
              _month_rsl_cache[ym] = rsl_tokens
              return rsl_tokens

          _date_sde_cache = {}

          def get_date_sde(ymd):
              """その日のレースtoken一覧（pw01sde）。日付ごとに1回だけ取得し使い回す。"""
              if ymd in _date_sde_cache:
                  return _date_sde_cache[ymd]
              rsl_tokens = get_month_rsl(ymd[:6])

              def probe(token):
                  try:
                      page = post_s(token, ACCESS_S)
                      found = {clean_token(x) for x in find_tokens(page, "pw01sde") if ymd in x}
                      return found, None
                  except Exception as exc:
                      return set(), repr(exc)

              sde_tokens = set()
              with ThreadPoolExecutor(max_workers=min(6, max(1, len(rsl_tokens)))) as executor:
                  futures = [executor.submit(probe, t) for t in sorted(rsl_tokens)]
                  for future in as_completed(futures):
                      found, error = future.result()
                      if error:
                          print("RSL warning:", error)
                          continue
                      sde_tokens.update(found)
              print(f"DATE {ymd}: SDE TOKENS={len(sde_tokens)}")
              if not sde_tokens:
                  raise RuntimeError(f"{ymd} のレース結果token(pw01sde)を取得できませんでした。")
              _date_sde_cache[ymd] = sde_tokens
              return sde_tokens

          class CellParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cells, self._buf, self._depth = [], [], 0
              def handle_starttag(self, tag, attrs):
                  if tag in ("td", "th"):
                      self._depth += 1; self._buf = []
                  elif tag == "br" and self._depth:
                      self._buf.append(" ")
              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self._depth:
                      self._depth -= 1
                      if self._depth == 0:
                          self.cells.append("".join(self._buf).strip())
              def handle_data(self, data):
                  if self._depth:
                      self._buf.append(data)

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
              def handle_data(self, data):
                  self.text.append(data)

          def strip_tags(s):
              tp = TextParser(); tp.feed(s or "")
              return re.sub(r"\s+", " ", "".join(tp.text)).strip()

          def parse_history_page(raw_html, token):
              match = HIST_TOKEN_RE.fullmatch(token)
              cp = CellParser(); cp.feed(raw_html)
              cells = cp.cells
              title_match = re.search(r"<title[^>]*>(.*?)</title>", raw_html, re.I | re.S)
              title = strip_tags(title_match.group(1)) if title_match else ""
              text = strip_tags(raw_html)

              meta = {"name": "", "distance": None, "surface": "", "course": "", "going": "", "time": "",
                      "meet": "", "meet_day": None, "date": match.group("date") if match else None}
              nm = re.search(r"第?\s*\d+回[^\s　<>]*(?:ステークス|S|カップ|記念|賞|杯|特別|レース)[^\s　<>]*", title)
              if nm: meta["name"] = nm.group(0)
              else:
                  nm2 = re.search(r"\d+R\s*(.+?)(?:\s|$)", title)
                  if nm2: meta["name"] = nm2.group(1).strip()
              dm = re.search(r"([\d,]+)メートル", text)
              if dm: meta["distance"] = int(dm.group(1).replace(",", ""))
              if "ダート" in text: meta["surface"] = "ダート"
              elif "障" in text: meta["surface"] = "障害"
              elif "芝" in text: meta["surface"] = "芝"
              gm = re.search(r"(不良|稍重|重|良)", text)
              if gm: meta["going"] = gm.group(1)
              mm = re.search(r"(\d+)回([^\d\s]{1,4})(\d+)日", text)
              if mm: meta["meet"] = mm.group(2); meta["meet_day"] = int(mm.group(3))
              tm = re.search(r"発走時刻[:：]?\s*(\d{1,2}時\d{1,2}分)", text)
              if tm: meta["time"] = tm.group(1)

              rows, cur = [], []
              for c in cells:
                  cur.append(c)
                  if len(cur) >= 15:
                      rows.append(cur); cur = []
              deduped = {}
              for row in rows:
                  try:
                      finish_s, waku, no_s = row[0].strip(), row[1].strip(), row[2].strip()
                      if not re.fullmatch(r"\d{1,2}", no_s):
                          continue
                      no = int(no_s)
                      finish = int(finish_s) if re.fullmatch(r"\d{1,2}", finish_s) else None
                      name = row[3].strip()
                      if not name:
                          continue
                      corner_raw = row[9] if len(row) > 9 else ""
                      agari = None
                      if len(row) > 10 and re.fullmatch(r"\d{2}\.\d", row[10].strip()):
                          agari = float(row[10].strip())
                      deduped[no] = {
                          "number": no, "name": name, "finish": finish,
                          "jockey": row[6].strip() if len(row) > 6 else "",
                          "time": row[7].strip() if len(row) > 7 else "",
                          "corner_raw": corner_raw, "agari": agari,
                          "weight": row[11].strip() if len(row) > 11 else "",
                          "popularity": int(row[13]) if len(row) > 13 and row[13].strip().isdigit() else None,
                      }
                  except Exception:
                      continue
              return meta, sorted(deduped.values(), key=lambda row: row["no"])

          def fetch_one(ymd, venue_code, race_no):
              sde_tokens = get_date_sde(ymd)
              target_tokens = []
              for token in sorted(sde_tokens):
                  match = HIST_TOKEN_RE.fullmatch(token)
                  if not match or match.group("date") != ymd:
                      continue
                  if match.group("venue") != venue_code or int(match.group("race")) != race_no:
                      continue
                  target_tokens.append(token)
              if not target_tokens:
                  raise RuntimeError(f"{ymd} の {VENUE_NAMES.get(venue_code, venue_code)} {race_no}R のtokenが見つかりません。")
              token = sorted(target_tokens)[0]
              url = ACCESS_S + "?CNAME=" + urllib.parse.quote(token, safe="")
              raw = post_s(token, ACCESS_S)
              title_match = re.search(r"<title[^>]*>(.*?)</title>", raw, re.I | re.S)
              title = strip_tags(title_match.group(1)) if title_match else ""
              if "パラメータエラー" in title or title == "エラー":
                  raw = get_s(token, ACCESS_S)
              meta, horses = parse_history_page(raw, token)
              if not horses:
                  raise RuntimeError("結果馬データを抽出できませんでした")
              race = {
                  "venue": VENUE_NAMES.get(venue_code, venue_code), "venue_code": venue_code,
                  "meet": meta["meet"], "meet_day": meta["meet_day"], "no": race_no,
                  "date": meta["date"], "time": meta["time"], "name": meta["name"],
                  "distance": meta["distance"], "surface": meta["surface"], "course": meta["course"],
                  "going": meta["going"], "url": url, "token": token, "historical": True, "horses": horses,
              }
              return race, meta

          ok, failed = [], []
          for ymd, venue_code, race_no in entries:
              key = f"{ymd}_{venue_code}_{race_no:02d}"
              try:
                  race, meta = fetch_one(ymd, venue_code, race_no)
                  out_dir = Path(f"data/history/{ymd}")
                  out_dir.mkdir(parents=True, exist_ok=True)
                  out_file = out_dir / f"{venue_code}_{race_no:02d}.json"
                  out_file.write_text(json.dumps(race, ensure_ascii=False, indent=2), encoding="utf-8")

                  index_file = out_dir / "index.json"
                  index = {"date": ymd, "updated_at": now.isoformat(), "target_ymd": ymd,
                           "source": "JRA公式 accessS 過去レース結果", "mode": "historical_index", "races": []}
                  if index_file.exists():
                      try: index = json.loads(index_file.read_text(encoding="utf-8"))
                      except Exception: pass
                  by_key = {f"{it.get('venue_code')}-{it.get('no')}": it for it in index.get("races", [])}
                  rkey = f"{venue_code}-{race_no}"
                  by_key[rkey] = {"venue": race["venue"], "venue_code": venue_code, "no": race_no,
                                  "date": ymd, "name": race["name"]}
                  index["races"] = sorted(by_key.values(), key=lambda it: (it.get("venue_code", ""), it.get("no", 0)))
                  index["race_count"] = len(index["races"])
                  index["updated_at"] = now.isoformat()
                  index["parser_version"] = "race-list-v1"
                  index_file.write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding="utf-8")

                  meta_file = out_dir / "meta.json"
                  meta_doc = {"date": ymd, "updated_at": now.isoformat(), "target_ymd": ymd,
                              "source": "JRA公式 過去レース・軽量メタデータ", "mode": "historical_metadata", "races": []}
                  if meta_file.exists():
                      try: meta_doc = json.loads(meta_file.read_text(encoding="utf-8"))
                      except Exception: pass
                  meta_by_key = {f"{it.get('venue_code')}-{it.get('no')}": it for it in meta_doc.get("races", [])}
                  meta_by_key[rkey] = {
                      "venue": race["venue"], "venue_code": venue_code, "meet": meta.get("meet", ""),
                      "meet_day": meta.get("meet_day"), "no": race_no, "date": meta.get("date", ymd),
                      "time": meta.get("time", ""), "name": race["name"], "distance": meta.get("distance"),
                      "surface": meta.get("surface", ""), "course": meta.get("course", ""),
                      "going": meta.get("going", ""), "url": race["url"], "token": race["token"],
                  }
                  meta_doc["races"] = sorted(meta_by_key.values(), key=lambda it: (it.get("venue_code", ""), it.get("no", 0)))
                  meta_doc["race_count"] = len(meta_doc["races"])
                  meta_doc["updated_at"] = now.isoformat()
                  meta_doc["parser_version"] = "race-list-v1"
                  meta_file.write_text(json.dumps(meta_doc, ensure_ascii=False, indent=2), encoding="utf-8")

                  ok.append((ymd, venue_code, race_no))
                  print(f"OK {key}: {race['name']} horses={len(race['horses'])}")
              except Exception as exc:
                  failed.append((key, repr(exc)))
                  print(f"FAIL {key}: {exc!r}")

          print("SUMMARY: OK", len(ok), "FAILED", len(failed))
          if failed:
              print("FAILED LIST:", failed)
          if not ok:
              raise RuntimeError("1レースも取得できませんでした。")
          Path("data/.race_list_ok.json").write_text(
              json.dumps([f"{y}_{v}_{n:02d}" for y, v, n in ok], ensure_ascii=False), encoding="utf-8")
          PY

      - name: Commit race entry data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No race entry data changes."
          else
            git commit -m "chore: sync race list entry data"
            git pull --rebase
            git push
          fi

      - name: Step 2/2 - 複数レースの出走馬ごとの過去走
        shell: bash
        env:
          MAX_RUNS: ${{ inputs.max_runs }}
        run: |
          set -euo pipefail
          OK_LIST=$(python3 -c "import json;print(' '.join(json.load(open('data/.race_list_ok.json'))))")
          rm -f data/.race_list_ok.json
          for key in $OK_LIST; do
            ymd=$(echo "$key" | cut -d_ -f1)
            venue=$(echo "$key" | cut -d_ -f2)
            race=$(echo "$key" | cut -d_ -f3 | sed 's/^0*//')
            echo "=== Horse history: $ymd $venue ${race}R ==="
            python3 jra_horse_history_phase2.py --date "$ymd" --venue "$venue" --race "$race" \
              --max-runs "${MAX_RUNS:-12}" || echo "FAILED: $key"
          done

      - name: Commit horse history data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/horse_history
          if git diff --cached --quiet; then
            echo "No horse history data changes."
          else
            git commit -m "chore: horse history for race list"
            git pull --rebase
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
