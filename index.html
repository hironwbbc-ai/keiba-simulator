<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2eddf">
<link rel="manifest" href="manifest.webmanifest">
<title>競馬予想シミュレーター</title>
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<header class="masthead">
  <p class="kicker">走りの記録から展開を読む</p>
  <h1>競馬予想<span>シミュレーター</span></h1>
</header>
<main>
  <section>
    <h2><b>壱</b>レースを選ぶ</h2>
    <div class="line">
      <input id="date" type="date" aria-label="開催日">
      <button id="load" class="btn">読み込む</button>
    </div>
    <div id="races" class="races"></div>
  </section>

  <section id="cond" hidden>
    <h2><b>弐</b>条件を整える</h2>
    <p id="raceTitle" class="racetitle"></p>
    <div class="line two">
      <label>馬場<select id="going"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></label>
      <label>ペース<select id="pace"><option value="">自動（脚質から予測）</option><option>ハイ</option><option>平均</option><option>スロー</option></select></label>
    </div>
    <button id="run" class="btn wide">シミュレーション実行</button>
  </section>

  <p id="status" class="status" role="status"></p>

  <section id="out" hidden>
    <h2><b>参</b>予想</h2>
    <div id="pacebox" class="pacebox"></div>
    <div id="verdict" class="verdict"></div>
    <div id="results"></div>
  </section>

  <section id="verify">
    <h2><b>検</b>複数レースで検証</h2>
    <p class="hint">取得済みの過去レースを「開催日_場コード_R」の形で1行ずつ入力（例: 20260906_09_11）。場コード: 01札幌 02函館 03福島 04新潟 05東京 06中山 07中京 08京都 09阪神 10小倉</p>
    <textarea id="verifyKeys" rows="4" placeholder="20260906_09_11&#10;20260927_06_11"></textarea>
    <button id="verifyRun" class="btn wide">検証実行</button>
    <div id="verifyOut"></div>
  </section>
</main>
<footer>過去走データから作った試算です。的中や収益を保証するものではありません。馬券の購入は自己責任でお願いします。</footer>
<script src="model.js?v=26"></script>
<script src="app.js?v=26"></script>
</body>
</html>
