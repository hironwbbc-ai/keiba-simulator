<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">

<title>競馬シミュレーター Ver.10.0</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#dfe4ea;
  --accent:#0f766e;
  --danger:#b42318;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}

main{
  max-width:780px;
  margin:auto;
  padding:12px 12px 44px
}

.top{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(244,246,248,.96);
  backdrop-filter:blur(10px);
  padding:8px 0 12px
}

h1{
  font-size:22px;
  margin:3px 0
}

.sub{
  font-size:12px;
  color:var(--muted)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 2px 10px rgba(16,24,40,.04)
}

h2{
  font-size:16px;
  margin:0 0 10px
}

h3{
  font-size:14px;
  margin:12px 0 7px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.full{
  grid-column:1/-1
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px
}

select,
input,
button{
  font:inherit;
  width:100%;
  border-radius:11px;
  border:1px solid var(--line);
  padding:10px;
  background:#fff;
  color:var(--ink)
}

button{
  font-weight:700;
  border:0;
  background:var(--accent);
  color:#fff
}

button:disabled{
  opacity:.5
}

.secondary{
  background:#e9eef2;
  color:var(--ink)
}

.status{
  font-size:13px;
  line-height:1.55
}

.ok{
  color:#067647
}

.err{
  color:var(--danger)
}

.race{
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  margin:8px 0
}

.race b{
  font-size:14px
}

.race button{
  margin-top:8px
}

.small,
.note{
  font-size:11px;
  color:var(--muted);
  line-height:1.5
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th,
td{
  padding:7px 5px;
  border-bottom:1px solid var(--line);
  text-align:left
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.wide{
  grid-column:1/-1
}

.hidden{
  display:none!important
}

.pill{
  display:inline-block;
  border-radius:999px;
  background:#eef2f6;
  padding:3px 7px;
  font-size:11px;
  margin:2px
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid #d0d5dd;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:-2px
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.summary{
  padding:12px;
  background:#f4f6f8;
  border-radius:12px;
  margin-bottom:10px
}

.version{
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
  margin-top:10px
}

.scroll{
  overflow-x:auto
}
</style>
</head>

<body>

<main>

<div class="top">

  <h1>
    🏇 競馬シミュレーター
    <span class="small">Ver.10.0</span>
  </h1>

  <div class="sub">
    JRA公式同期JSON → 出馬表 → シミュレーション → 過去レース・一括バックテスト
  </div>

</div>


<!-- =====================================================
     ① 開催取得
     ===================================================== -->

<section class="card">

  <h2>① 開催を取得</h2>

  <div class="grid">

    <div>
      <label>日付</label>
      <input id="date" type="date">
    </div>

    <div>
      <label>開催場</label>

      <select id="venue">
        <option value="">
          取得後に選択
        </option>
      </select>
    </div>

  </div>

  <div class="actions" style="margin-top:9px">

    <button
      id="loadBtn"
      class="wide"
    >
      指定日の開催を取得
    </button>

  </div>

  <div
    id="status"
    class="status"
    style="margin-top:9px"
  >
    GitHub Actionsで同期したJRA公式データを優先して読み込みます。
  </div>

  <div id="races"></div>

</section>


<!-- =====================================================
     ② 出馬表
     ===================================================== -->

<section
  id="entryCard"
  class="card hidden"
>

  <h2>② 出馬表</h2>

  <div id="raceInfo"></div>

  <div id="horses"></div>

  <div
    class="actions"
    style="margin-top:10px"
