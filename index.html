<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2eddf">
<link rel="manifest" href="manifest.webmanifest">
<title>競馬予想シミュレーター</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<header class="masthead">
  <p class="kicker">走りの記録から展開を読む</p>
  <h1>競馬予想<span>シミュレーター</span></h1>
</header>
<main>
  <section>
    <h2><b>壱</b>レースを選ぶ</h2>
    <div class="line">
      <input id="date" type="date" aria-label="開催日">
      <button id="load" class="btn">読み込む</button>
    </div>
    <div id="races" class="races"></div>
  </section>

  <section id="cond" hidden>
    <h2><b>弐</b>条件を整える</h2>
    <p id="raceTitle" class="racetitle"></p>
    <div class="line two">
      <label>馬場<select id="going"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></label>
      <label>ペース<select id="pace"><option value="">自動（脚質から予測）</option><option>ハイ</option><option>平均</option><option>スロー</option></select></label>
    </div>
    <button id="run" class="btn wide">シミュレーション実行</button>
  </section>

  <p id="status" class="status" role="status"></p>

  <section id="out" hidden>
    <h2><b>参</b>予想</h2>
    <div id="pacebox" class="pacebox"></div>
    <div id="verdict" class="verdict"></div>
    <div id="results"></div>
  </section>
</main>
<footer>過去走データから作った試算です。的中や収益を保証するものではありません。馬券の購入は自己責任でお願いします。</footer>
<script src="model.js?v=21"></script>
<script src="app.js?v=19"></script>
</body>
</html>
